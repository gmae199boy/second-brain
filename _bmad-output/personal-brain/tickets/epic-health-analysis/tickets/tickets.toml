[[entry]]
id = 9
type = "story"
title = "이 Mac에서 전환: 새 11:30 분석이 실계정으로 한 번 돌고 옛 Garmin 리포트 예약은 내려간다"
description = "기능 묶음을 플러그인 배포(`plugin/app-ref`를 앞선 커밋으로, `plugin/.claude-plugin/plugin.json`의 `version`을 함께 올림)로 이 Mac의 설치본에 넣고 에이전트가 진행한다(2026-10-28 위임, `hitl = false`). 순서: 새 분석 예약·청구를 보류한 상태로 설치본의 분석 설정 기본값 확인(`analysis.agent=codex`)과 옛 profile 파일이 있으면 `analysis.profile_path` 설정 → 16.9가 남긴 전환 상태를 읽고, 옛 `local.garmin-pipeline.report` LaunchAgent가 남아 있으면 bootout(plist 보존), 등록 부재와 진행 중 옛 평가 프로세스의 종료 확인(종료가 불명이면 전환을 멈추고 실평가 성공으로 세지 않음) → 11:30 분석 예약 등록과 보류 해제 → 오늘 수집 결과에 대해 분석 그래프를 수동으로 한 번 돌림 → 로그인된 각 CLI(Codex, 있으면 Claude Code)로 실제 모델이 scratch 밖에 심은 합성 표식 파일을 읽지 못하는지 한 번씩 확인(없는 CLI는 미확인으로 기록) → 네 scope의 확정, 리포트 파일, usage, 결과 묶음의 발신 상태 확인. Codex 로그인이 만료됐으면 재로그인 절차를 `operator_actions`에 남기고 그 단계만 `awaiting-operator`다. plan에는 공개 투영(scope별 성공/실패, 건수, usage 유무, 발신 상태)만 남기고 분석 본문·건강값·계정 id는 쓰지 않는다. 모델 품질 판단은 사람 몫이다. 복구 절차(새 예약 보류·제거 → 진행 중 새 평가의 종료 확인 → 옛 plist 다시 load, 동시에 켜지 않음)를 plan에 적는다. 원격 push가 있어야만 하는 단계는 `operator_actions`다."
verify = "에이전트가 이 Mac에서 위 순서를 한 번 돌리고 결과를 plan에 남긴다(공개 투영만). `launchctl list`에 옛 report label이 없고, 옛 평가 종료 확인 뒤에 11:30 분석 예약이 활성화됐으며(보류 중 예약 시각을 넘겨도 새 모델 호출 0), 실제 모델이 scratch 밖 표식 파일을 읽지 못했고, 실평가가 성공했으면 네 scope의 `analyses` 행과 리포트 파일이 있고 usage가 있거나 unknown으로 기록되며 묶음 요청이 `sent` 또는 기록된 실패 상태다. 로그인 문제가 있었으면 `operator_actions`를 남기고 9는 `awaiting-operator`다."
