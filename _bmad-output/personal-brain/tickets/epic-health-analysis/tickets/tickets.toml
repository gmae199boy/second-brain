[[entry]]
id = 4
type = "story"
title = "두 모델 adapter: Codex와 Claude Code가 같은 판정 fixture를 통과하고, 멈추거나 취소된 모델 프로세스는 손자까지 정리된다"
description = "E18-4를 끝낸다. 설정 `analysis.agent`·`analysis.model`(NULL이면 인자 생략)·`analysis.effort`·`analysis.timeout_minutes`를 설정 코덱이 실행 snapshot으로 넘긴다. Codex adapter(`codex exec -C <scratch> --json -c model_reasoning_effort=<effort> [-m <model>] …`, usage는 `turn.completed`의 세 값)와 Claude Code adapter(`claude -p <prompt> [--model <model>] --effort <effort> --output-format json`, usage는 결과의 `usage`, 원문 skill을 읽히는 wrapper)를 만든다. 둘 다 core가 같은 schema로 출력을 다시 검증하고, usage는 세 값이 모두 비음수 정수일 때만 ABI `usage`에 싣고 아니면 unknown이다. 모델 프로세스 env에서 DB 비밀과 API 키 변수를 뺀다. 실행 port의 접근 제한을 완성한다: cwd는 scratch, 모델이 읽을 수 있는 것은 export와 scratch뿐이 되게 CLI의 sandbox·권한 인자(Codex는 `-s workspace-write`, Claude Code는 도구 허용 목록을 scratch로 제한하고 셸 도구를 끔)를 고정하고, CLI 로그인 자료 말고는 홈의 다른 파일을 넘기지 않는다. 도구 응답은 출력 코덱을 거친다. 진단 정책: 원 stdout·stderr·이벤트 파일·출력 JSON은 private scratch에만 두고 검증 뒤 지우며, `failures`·로그·plan에는 허용 목록의 코드·단계·상태만 남긴다. 20분 호출 timeout과 25분 정체 창(12.5)을 구별한다. 설정한 CLI가 없거나 로그인되지 않았으면 다시 하지 않는 오류(`agent_unavailable`)로 `failures`와 doctor에 보인다. 설치 버전의 실제 출력 모양을 정적 fixture로 고정한다(값 없이 모양만)."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 두 adapter의 fake CLI에 성공·`status=failed`·깨진 JSON·schema 불일치·빈 본문·nonzero 종료·출력 없음·usage 없음·여러 turn·잘린 이벤트를 주면 같은 판정이 나오고, `analysis.model`이 NULL이면 argv에 모델 인자가 없으며, TERM을 무시하는 자식·손자를 남기는 fake CLI를 취소하면 그룹 전체가 정리되고 감독자가 reap하며, 기본 설정에서 호출이 20분(12.1의 가짜 clock)을 넘으면 timeout 실패이고, `analysis.timeout_minutes`를 25분보다 크게 둔 경우 heartbeat만 내는 호출은 25분에 `stalled`가 되며 진행 이벤트를 내면 정체 창이 갱신되고(자식·손자 생성·TERM 무시·그룹 종료·reap은 실제 OS 프로세스로 확인), fake 모델이 동기화 지점에서 기다리는 동안 별도 합성 세션의 수집·spool drain이 새 메시지를 확정하고 그 확정이 모델 해제보다 먼저 관찰되며, 격리 홈에 심은 합성 DB 비밀·계정·건강값·보존 본문 표식이 adapter의 argv·env·cwd·넘긴 파일·도구 응답·`failures`·로그 어디에도 없고 실패하는 CLI의 진단에도 없으며, 두 adapter 각각 fake CLI가 받은 argv에 sandbox·도구 허용 인자가 정해진 값으로 있고(fake 시험이 보장하는 것은 이 인자 전달까지), adapter가 도구 호출을 중개하는 경로에서는 scratch 밖 표식 파일을 읽는 요청이 거부되며, CLI가 PATH에 없으면 `agent_unavailable`이 `failures`와 doctor에 보이고, fake CLI가 받은 env에 DB URL과 시험 API 키가 없다."
covers = ["E18-4"]
after = [3, "12.5"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-health-analysis/epic-health-analysis-research-code.md, §4, 스토리 후보 T4"]

[[entry]]
id = 5
type = "story"
title = "체성분 intake: inbox의 체성분 사진이 모델 일감으로 검증된 측정 JSON이 되어 epic 16이 읽는 자리에 놓인다"
description = "E18-9를 만든다. core `body_intake` 일감(`supervised`, 4의 adapter 재사용)은 자기 현지 예약(기본 10:45, 수집 11:00 전)과 수동 실행(`brain schedules run`)으로 들어가고, inbox·inbody 바로 아래의 체성분 사진 중 측정 JSON이 없는 것을 찾아 옛 body-intake skill·출력 schema v1으로 모델을 돌린다. 출력은 core가 schema로 검증한 뒤 epic 16이 읽는 같은 자리에 사용자가 넣은 JSON과 같은 형식으로 원자적으로 쓴다(임시 파일 → rename). 검증·모델 실패는 그 사진을 pending으로 남기고 다음 실행에서 다시 시도하며, 같은 사진에 JSON을 두 번 쓰지 않는다. 체성분 병합과 원본 파일 등록은 epic 16(16.5) 몫이다. 확장을 끄면 보류 그룹 `extension:garmin`으로 멈춘다. body-intake 리소스를 v1으로 저장소에 둔다."
verify = "시험(fake 모델 CLI. 시험 이름과 실행 명령은 plan에 적는다)에서 JSON이 없는 합성 사진 둘을 inbox에 두고 `body_intake`를 돌리면 사진마다 schema를 통과한 측정 JSON이 한 번 생기고 이어서 16.5의 처리가 그것을 병합하며, 깨진 출력을 내는 경우 그 사진은 pending으로 남고 JSON이 생기지 않으며, 다시 돌려도 이미 JSON이 있는 사진은 모델을 부르지 않고, rename 직전에 죽여도 반쯤 쓴 JSON이 남지 않으며, 한 사진의 실패가 다른 사진과 수집을 막지 않고, 10:45 예약이 등록돼 있고, fake 모델을 그날 artifacts의 읽기 경계 뒤까지 기다리게 하면 그날 snapshot에는 그 측정이 없고 다음 artifacts 실행에서 한 번만 병합된다."
covers = ["E18-9"]
after = [4, "16.5"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-health-analysis/epic-health-analysis-research-code.md, §3(body-intake 경계), §4(이미지 입력 인자)"]

[[entry]]
id = 6
type = "story"
title = "결과 묶음과 실패 알림: 요약 → 앨범 → 전문이 한 번만 나가고, 발신이 실패해도 평가는 그대로다"
description = "E18-7을 만든다. 묶음 조립기: 요약(day+7d+30d+all 순, UTF-16 4000 넘으면 뒤 기간 줄부터 버리고 마지막에 day를 자름), 앨범(같은 수집 결과의 epic 16 그래프 `file_requests` 결과 file_id, 역할 metadata로 두 묶음, 10장씩), 전문(Markdown 파일). 확정된 파일만 넣고, 그래프 실패는 평가를 지우지 않는다. 15.4의 묶음 요청으로 넣고 의미 키는 `(분석 묶음 id, Garmin 봇·채팅 conversation, health-report, 묶음 revision)`이다. `REPORT_FAILED`는 `(계정+현지 날짜의 실패 사건 id, conversation, report-failed, 템플릿 revision)`으로 날짜당 한 번이고 실패 scope를 담는다. 캡션·요약은 출력 코덱으로 가린다(15가 한다). 발신 실패·불명은 평가를 지우거나 모델을 다시 부르지 않는다."
verify = "시험(15.1의 가짜 Telegram 서버. 시험 이름과 실행 명령은 plan에 적는다)에서 네 scope가 끝난 그래프의 묶음이 요약 → 앨범 → 전문 순으로 나가고, 같은 묶음을 다시 조립해 넣어도 POST가 늘지 않으며, 둘째 앨범에서 연결을 끊고 다시 돌리면 남은 항목만 나가고, 요약이 4000을 넘는 합성 출력에서 뒤 기간 줄부터 빠지며, 발신을 모두 실패시켜도 `analyses` 행·파일·id가 그대로이고 fake 모델 호출 수가 늘지 않으며, 같은 날 실패를 두 번 내도 `REPORT_FAILED` 요청이 하나다."
covers = ["E18-7"]
after = [5, "15.4", "16.6"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-health-analysis/epic-health-analysis-research-code.md, §6, 스토리 후보 T5"]

[[entry]]
id = 7
type = "story"
title = "예약과 끄기: 11:30 예약이 그날 수집이 끝난 뒤에만 평가하고, 여러 날을 놓쳐도 최신 날 하나만 평가하며, Garmin을 끄면 멈춘다"
description = "E18-8을 만든다. 분석 예약(현지 11:30, core `timezone`)을 등록하는 경로와, 발화가 오늘 날짜의 분석 그래프를 넣되 같은 날짜의 epic 16 `collect`·`artifacts` 성공 결과를 선행 의존으로 거는 연결을 만든다(시각 polling 없음). 수집 실패는 `dependency_failed`와 `REPORT_FAILED`로 이어진다. 놓친 날짜는 12.8의 규칙으로 한 번만 깨어나고, 그 실행은 수집이 끝난 가장 최근 날짜 하나만 평가한다. 수동 실행(`brain schedules run`)은 같은 대상의 열린 그래프와 합쳐진다. 분석 예약·모델 일감·`body_intake`는 보류 그룹 `extension:garmin`을 붙인다. doctor와 `brain queue list`가 분석 일감의 상태·걸린 시간·usage를 보인다."
verify = "시험(가짜 clock. 시험 이름과 실행 명령은 plan에 적는다)에서 11:30에 오늘 수집이 아직 안 끝났으면 그래프가 기다리다 수집 성공 뒤 돌고, 수집이 실패하면 `dependency_failed`와 `REPORT_FAILED` 요청 하나가 생기며, 사흘을 건너뛴 뒤 깨어나면 가장 최근 수집 날짜 하나만 평가하고 빠진 날의 day 행이 생기지 않고, 수동 실행이 열린 그래프와 합쳐지며, `extension:garmin`을 보류하면 진행 중 모델 일감이 취소되고 예약이 발화하지 않으며 해제하면 이어서 돌고, 저장된 평가와 이전된 분석이 남는다."
