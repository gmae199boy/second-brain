# epic 18 core 건강 분석 — 표 순서 = 만드는 순서. id는 영구.
# 한 레인: core 분석 코드·PG 마이그레이션·Store·조립(apps/cli/src/assembly.ts)·출력 코덱 등록부를 모든 스토리가 함께 고친다(코드 조사 8절).

[[entry]]
id = 1
type = "story"
title = "Tracer: 고정 합성 snapshot의 day 평가가 감독되는 core 일감에서 fake 모델을 거쳐 analyses와 리포트 파일로 확정된다"
description = "가장 얇은 길로 분석 층을 잇는다. Core 분석 use case(입력 snapshot 읽기 → 모델 실행 port → 출력 schema 검증 → 확정)와 Core 모델 실행 port를 만들고, Runtime이 Codex adapter의 최소형을 조립한다. 시험은 Codex 모양의 fake 모델 CLI(argv·env를 기록하고 schema에 맞는 출력과 `--json` 이벤트를 내는 실행 파일)를 쓴다. 모델 일감은 `supervised` core 일감이고 감독자가 프로세스 그룹으로 띄운다. 고정 합성 snapshot(day 하나)의 export는 출력 코덱을 거친다. 옛 daily skill·daily 출력 schema를 v1 리소스로 넣는다. `analyses` 호환 확장 마이그레이션의 최소 칸(묶음 id·현지 날짜·scope·snapshot id·revision·agent·출력 JSON)과 리포트 Markdown의 core FileStore 등록·파일 관계 행을 둔다. 설정 `analysis.agent`(기본 `codex`)를 설정 코덱이 읽는다. 시험 기반도 1이 만들고 2~9가 다시 쓴다: fake 모델 CLI(두 adapter 모양으로 넓힐 자리), 합성 snapshot 생성기, 격리된 PG와 Brain 홈, 정리 도구. 각 plan은 실행 명령, 사전 조건, 관찰값, 정리 명령을 적는다. 받는 것: 14.1·14.5의 `analyses` 최소형과 파일 관계, 12.1·12.4의 감독자·ABI v1(`usage`), 11.4의 FileStore·추출. 실제 시그니처는 착수 시점 main HEAD에서 확인한다. plan 상한은 scope 하나, 정상 경로 하나다."
verify = "통합 시험(PG, 데몬 감독자, fake 모델 CLI. 시험 이름과 실행 명령은 plan에 적는다)에서 합성 snapshot으로 day 평가 일감을 넣으면 감독자가 fake CLI를 프로세스 그룹으로 띄우고, schema를 통과한 출력이 `analyses` 한 행(묶음 id·scope·snapshot id·agent 포함)이 되며, 리포트 Markdown이 core 파일로 등록돼 파일 관계로 되읽히고 추출 세대가 생기며, fake CLI가 받은 입력 export에 시험 비밀 문자열이 가려져 있고, schema에 맞지 않는 출력은 `analyses` 행을 만들지 않으며, 같은 일감을 다시 돌려도 행이 하나다."
covers = ["E18-2", "E18-3", "E18-4", "E18-5", "E18-6"]
after = ["14.5", "12.4"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-health-analysis/epic-health-analysis-research-code.md, §1, §3, §4, §5, 스토리 후보 T1"]

[[entry]]
id = 2
type = "story"
title = "입력 snapshot: 같은 합성 fixture에서 새 snapshot export가 옛 report-input과 파일·값·선행 선택까지 같다"
description = "E18-1을 만든다. 수집·artifacts 성공 결과를 받아 짧은 read로 snapshot manifest(현지 날짜·IANA 시간대·UTC cutoff·운동 창·결과 id·catalog·정규화 버전·건강 행 revision 목록·권위 규칙 버전·ambiguity 제외 목록·raw export·digest JSON·그래프·body·profile·labels 참조·선행 분석 목록)를 확정하고 바이트로 남긴다. 건강 값은 14.2의 \"현재\" view에서 catalog 단위·타입대로 pivot해 옛 day_values 열을 재현하고(문자열·JSON 열은 숫자 평균에서 뺀다), raw는 `garmin.raw_records`에서 cutoff·endpoint 필터(stress·BB·HR 배열의 timestamp < cutoff, 오늘 user_summary·body_battery 제외, cutoff에 끝난 운동 제외)와 식별자 scrub으로 내보낸다. key의 `<scope>/` 접두사를 떼어 옛 폴더 모양을 만든다. 선행 분석 선택 규칙(day는 어제 day·7d·본문, 7d는 창 안의 day, 30d는 7d 다섯, all은 월별 30d, previous는 같은 scope의 앞선 최신)과 all의 월별 집계(허용 집계만, 없는 날을 0으로 채우지 않음)를 옮긴다. digest는 epic 16 `artifacts`의 digest JSON 파일을 읽고 다시 계산하지 않는다. 옛 SQLite reader와 새 reader에 같은 합성 fixture를 넣는 비교 시험을 둔다. ambiguity·여러 dataset은 옛 소스에 없으므로 따로 새 계약 시험으로 검증한다."
verify = "비교 시험(시험 이름과 실행 명령은 plan에 적는다)에서 같은 합성 raw·run·activity·body·profile·평가 fixture와 같은 clock·시간대·cutoff로 옛 reader와 새 snapshot export를 만들면 파일 목록·JSON 값·배열 순서·notes·NULL·누락·선행 선택이 같고(임시 경로 차이만 제거), cutoff 직전·같음·직후, 미완료 운동, 짧은 이력, 월 경계, 잘못된 raw·body, 중첩 식별자 fixture를 모두 통과하며, 새 계약 시험에서 ambiguity 행은 snapshot에 들어가지 않고 제외 목록에 남으며, 같은 그래프의 네 scope가 같은 snapshot id를 읽는다."
covers = ["E18-1"]
after = [1, "16.5"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-health-analysis/epic-health-analysis-research-code.md, §2, §9(Done when 1), 스토리 후보 T2"]

[[entry]]
id = 10
type = "story"
title = "건강 현재값 조회: 판정과 입력 snapshot을 유지하며 조회·회귀 시험 시간을 줄인다"
description = "E18-1의 조회 성능을 개선한다. 18.2가 완료·병합된 기준에서 건강 현재값·판정 조회, 반입 검증 snapshot, 18.2 입력 snapshot과 느린 Garmin 정규화 시험을 같은 합성 데이터로 측정한다. SQL 최적화와 필요한 후보·권위 규칙을 일괄 조회한 뒤 공통 프로그램 코드에서 판정하는 방안을 비교하고, 동등성과 실행 계획·시간·쿼리 수를 근거로 하나를 구현한다. 건강 현재값·판정·반입 검증 및 입력 snapshot 조회의 인덱스 사용 여부를 실행 계획으로 확인하고, 쿼리 변경과 관련 인덱스 추가·변경을 비교한다. 인덱스 변경을 채택하면 조회 성능과 관측·권위 기록 쓰기 비용을 함께 검증하며, 변경이 불필요하면 근거를 남긴다. 다른 기능의 인덱스 전수 정비는 범위 밖이다. 계정·날짜·지표 등 논리 키 범위를 일찍 제한하되 그 키의 경쟁 dataset·revision·버전 후보를 임의로 버리지 않는다. 일괄 조회를 쓰면 후보와 규칙을 같은 읽기 snapshot에서 얻고 항목별 추가 조회를 반복하지 않는다. 필터 없는 전체 조회와 반입 검증도 함께 확인한다. 기존 공개 건강 DB 계약과 18.2 snapshot의 내용·순서·cutoff·ambiguity 제외 목록·권위 provenance를 유지하고, Python 검증기의 독립 기대 판정은 유지한다. 생산 조회 경로를 개선하며 시험 assertion 생략·시험 전용 우회·전역 timeout 증가로 성능 개선을 대신하지 않는다. SQL 경로를 남기면 그 경로도 개선 대상이다. Python 전체 이식, 수집 빈도 변경, 수집·정규화·분석 정책 변경은 범위 밖이다."
verify = "합성 fixture의 기존·변경 구현 결과를 대조한다: 명시 권위 순서, 복수 dataset ambiguity, 계정·시간대 미확인, 동률 revision 충돌, 지원/미지원 버전, 논리 text·JSON 동등/상이, 원형 identity·NUL, NULL·누락, 날짜/instant·cutoff 경계, 재정규화·재개에서 current 행과 resolution의 reason/current_id/selected_ids/unselected_ids/authority 버전이 같고, 18.2 입력 snapshot 비교와 반입 검증의 독립 기대 판정을 통과한다. 조건을 좁힌 조회가 전체 판정 후 같은 키를 고른 결과와 같고 다른 날짜·계정·지표를 늘려도 후보 판정 범위가 함께 늘지 않는지 실행 계획 또는 처리 행수로 확인한다. 착수 시 고정한 기준 커밋과 동일 환경·동일 fixture에서 간섭 작업 없이 warm-up 뒤 3회씩 비교하여 좁은 현재값 조회와 기존 정규화 시험의 중앙 실행 시간이 각각 절반 이하이고, 전체 조회·반입 검증·18.2 snapshot의 중앙 실행 시간이 기준보다 10% 넘게 나빠지지 않음을 보인다. 인덱스 검토는 합성 데이터의 규모와 조건 선택도를 달리한 EXPLAIN (ANALYZE, BUFFERS)로 사용 인덱스·필터링 행수·버퍼 접근·실행 시간을 대조한다. 채택한 인덱스의 크기와 같은 관측·권위 기록 쓰기 배치의 전후 시간·처리량을 기록해 쓰기 비용을 평가하고, 인덱스를 바꾸지 않으면 기존 인덱스로 충분한 이유 또는 쿼리 구조가 우선인 근거를 남긴다. 관측 수와 쿼리 수를 함께 기록하고 결과 캐시·assertion 축소로 달성하지 않는다. 실패하면 원인과 미달 구간을 남기고 성능 조건 충족으로 처리하지 않는다. 반복 검증은 pnpm test:changed만 사용하며, 최종 커밋 직전 pnpm test와 pnpm test:python을 순차로 각 한 번 실행해 결과와 전체 시간을 기록한다. 명령·환경·준비/측정 구간·실행 계획·행수·정리 방법은 plan에 남긴다."
covers = ["E18-1"]
after = [2]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-health-analysis/epic-health-analysis.md, Requirements E18-1; Notes Decision(2026-11-04, 건강 조회 성능)", "_bmad-output/personal-brain/tickets/epic-health-analysis/epic-health-analysis-health-query-performance-evidence.md, 사용자 결정·측정 근거·유지할 계약·검증"]
notes = ["Decision(2026-11-04, 사용자): 18.2 완료·병합 뒤 18.3보다 먼저 별도 티켓으로 진행한다. 구현 방식을 언어나 SQL 형태로 미리 고정하지 않는다.", "Decision(2026-11-04, 추천으로 정함): 성능 인수 기준은 동일 fixture 3회 중앙값으로 좁은 조회·정규화 시험 각각 기준의 절반 이하, 전체 조회·검증·snapshot은 10% 초과 회귀 없음으로 둔다. 과거 9초/148초 측정치를 절대 시간 기준으로 쓰지 않는다.", "Risk: high — 잘못된 후보 제한이나 판정 변경은 분석 입력을 빠뜨리거나 잘못된 현재값을 선택할 수 있다.", "추가 확인: 구현자가 만든 기대값만 쓰지 않고 기존 계약 fixture와 독립 검증기로 권위·revision·버전·논리 값 충돌을 대조한다. 저장 원문과 기존 분석 행이 바뀌지 않았는지도 별도로 확인한다.", "Decision(2026-11-04, 사용자): 18.10에 건강 현재값·판정·snapshot 경로의 인덱스 검토를 필수로 추가한다. 실제 인덱스 변경 여부는 조회 효과와 쓰기 비용을 비교해 결정하고, 변경하지 않는 경우에도 근거를 남긴다."]

[[entry]]
id = 3
type = "story"
title = "네 scope와 재개: day → 7d → 30d → all이 성공할 때마다 바로 남고, 중간에 죽이면 남은 scope만 다시 돈다"
description = "E18-2·E18-3을 끝낸다. 분석 그래프를 epic 12의 일감 의존으로 넣는다: scope마다 `supervised` 모델 일감, 확정 트랜잭션이 다음 scope를 푼다. 실패한 scope는 AD-21 재시도를 받고, 끝내 실패하면 뒤 scope는 `dependency_failed`다. 선행 분석 관계(별도 관계 표: 당일 앞 scope와 참조한 과거 평가의 id·역할)를 남긴다. 확정 직전·확정 직후·파일 등록 중에 죽어도 같은 scope 결과로 수렴하고 모델을 다시 부르지 않는다. 오래된 attempt의 확정은 거부된다. 명시적 재생성은 새 revision의 새 행이고 이전 행과 이전된 분석은 그대로다. period 출력 schema와 period skill을 v1 리소스로 더한다."
verify = "시험(fake 모델 CLI, 실제 감독자. 시험 이름과 실행 명령은 plan에 적는다)에서 네 scope가 순서대로 돌고 각 scope의 `analyses` 행이 그 scope가 끝난 직후 보이며, 7d 확정 직후 감독자를 죽이고 다시 띄우면 30d·all만 돌고 fake CLI 호출 수가 4이며, 검증한 출력의 durable checkpoint 뒤·FileStore 넣기 뒤·관계 확정 직전에 죽여도 호출 수가 늘지 않고(checkpoint 전에 죽인 경우만 다시 부름), 30d를 계속 실패시키면 all이 `dependency_failed`로 닫히고 day·7d 행이 남고, 회수된 attempt의 확정이 거부되며, 재생성하면 새 revision 행이 생기고 이전 행과 이전된 합성 분석 행이 바뀌지 않으며, 선행 분석 관계가 기대한 id를 가리킨다."
