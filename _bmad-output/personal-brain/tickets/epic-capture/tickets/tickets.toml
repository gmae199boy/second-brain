type = "story"
title = "사람이 읽는 출력을 한국어로"
description = "spine Conventions '출력 언어'대로, 지금까지 만든 출력 중 사람이 읽는 문장을 한국어로 바꾼다: `setup run` 질문·진행 줄, doctor 텍스트 줄(detail 포함), 오류 message와 Core 코드 표의 hint(텍스트 모드와 `--json`이 같은 문장), 명령 `--help` 설명과 commander가 찍는 기본 라벨(`Usage:`·`Options:` 등), 개발용 스크립트 안내(`tooling/dev/tracer-session.sh`는 2026-10-16에 이미 바뀜), README. 코드(`USAGE` 등)·JSON 키·점검 id·명령과 옵션 이름·설정 키는 영어로 둔다. 2.1의 hint 문체 검사를 한국어 기준(마침표 없음, 명령은 백틱)으로 고치고, 파괴적 hint 금지 검사가 한국어 hint에서도 걸러지게(지우·삭제·제거 등) 바꾸며, 영어 문장을 단정하던 테스트를 맞추며, 사람이 읽는 출력(설치기 줄, doctor 줄, 오류 message·hint, `--help`)에 영어 문장이 새로 들어오면 실패하는 출력 언어 검사를 남긴다(2026-10-16 사용자 결정)."
verify = "TTY와 `--yes` 두 방식의 `setup run`, doctor, `sessions ingest`의 실패 줄, `brain --help`가 한국어 문장을 내고, `--json` 엔벨로프의 `error.message`·`hint`가 텍스트 모드와 같은 한국어 문장이며 `code`·키·점검 id는 바뀌지 않고, hint 문체 검사가 한국어 hint를 통과시키고 마침표로 끝나는 hint를 거부하며, 코드 표 hint나 doctor 줄에 영어 문장을 하나 넣으면 출력 언어 검사가 실패한다."
