[[entry]]
id = 25
type = "story"
title = "지워진 워크트리의 꼬리표 추정과 꼬리표 근거 칸"
description = "세션의 꼬리표 근거 폴더(cwd가 있는 첫 메시지의 cwd)가 디스크에 없으면, 지금은 '레포 아님'으로 보고 꼬리표를 비운다. 이 스토리는 폴더가 없는 경우를 따로 알아보고 두 단계로 추정한다. (1) 위로 올라가며 처음 남아 있는 폴더가 git 저장소 안이면 그 저장소로 채운다. (2) 아니면 원래 폴더의 바로 위 폴더에서만 형제를 찾아, 형제 폴더 중 checkout인 것들이 모두 같은 remote 정체성(AD-12의 비교 키 `identity_key`로 비교)이면 그 프로젝트로 채운다. 바로 위 폴더가 없거나, 형제 checkout이 없거나, 정체성이 갈리면 비워 둔다. remote가 없는 로컬 저장소 형제는 다른 정체성으로 센다. 형제 하나라도 답을 못 받으면(권한, 시간 초과 등) 추정을 미루고 20의 다시 시도를 따른다. 특정 도구(Orca, Paseo 등)의 폴더 이름은 코드에 넣지 않는다. 채우기는 20의 다시 채우기와 같은 규칙이다(null → 값 한 번, 이미 있으면 그대로). 워크트리 행은 원래 cwd 경로로 둔다. 이미 꼬리표 없이 저장된 세션은 drain이 한 번 다시 판단하고, 다시 돌려도 결과가 같다. 마이그레이션 0007은 `sessions.tag_source`(꼬리표를 정한 방법 `cwd`, `ancestor`, `sibling`, 꼬리표가 없으면 null; 기존 행은 꼬리표가 있으면 `cwd`)와 `sessions.first_cwd`(꼬리표 근거 폴더 그대로, 꼬리표가 없어도 남김)를 더한다. 수집은 세션을 만들 때 `first_cwd`를 쓰고, 기존 행은 drain이 다시 판단할 때 transcript에서 채운다(transcript가 이미 없으면 null). 다시 판단은 transcript가 있으면 거기서, 없으면 `first_cwd`로 한다. Postgres는 epic 7이다. doctor는 꼬리표 없는 세션 수를 보인다. spine AD-12와 Table Contract(`tag_source`의 작성자와 불변 규칙)는 이 스토리가 고친다."
verify = "같은 부모 폴더 아래 살아 있는 워크트리가 있는 지워진 워크트리 세션이 그 프로젝트로 묶이고 `tag_source = sibling`이다. 저장소 안의 지워진 하위 폴더 세션은 그 저장소로 묶이고 `ancestor`다. 형제가 서로 다른 저장소인 폴더(`git worktree add ../x` 배치)와 형제 checkout이 없는 폴더의 세션은 비어 있다. 꼬리표가 있는 세션은 바뀌지 않는다. 이 기계의 실제 DB에서 꼬리표가 빈 세션 39개 중 지워진 워크트리 세션 33개에서 30개가 채워진다(2026-10-21 실측). 마이그레이션 뒤 기존 행의 꼬리표·출처가 보존되고, 꼬리표 없는 세션에도 `first_cwd`가 남으며, transcript를 지운 세션도 `first_cwd`로 다시 판단되고, doctor가 꼬리표 없는 세션 수를 보인다. 원래 폴더의 바로 위까지 지워진 세션과 형제 하나가 답하지 않는 세션은 비어 있다."
covers = ["E2-6", "E2-12"]
after = [14, 20, 24]
hitl = false
risk = "medium"
notes = ["2026-10-21 사용자: \"꼬리표 없는건 좀 그런데. 특히 난 워크트리만 쓰니깐.\"", "2026-10-21 사용자: \"orca를 사용하지 않는 경우도 생각해야 해. paseo나 아니면 그냥 터미널에서 사용한다던지\"", "2026-10-21 사용자: \"마이그레이션 건이라면 그냥 스토리에 같이 녹여도 될거 같은데\""]

