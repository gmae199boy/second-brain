id = 20
type = "story"
title = "정체성 보강: 대소문자 비교 키와 비어 있는 꼬리표 다시 채우기"
description = "Core 정규화에 비교 키 함수를 더하고(대소문자를 구분하지 않는 호스트 목록은 Core 상수, 처음은 `github.com`·`bitbucket.org`; 그 호스트면 정체성을 소문자로 접고, 그 밖의 호스트와 로컬 공통 디렉터리 정체성은 그대로) Store가 프로젝트를 18의 `identity_key`로 찾거나 만들게 하며(표시는 처음 본 `remote_identity`), `RepositoryInspector.inspect`의 결과를 checkout·레포 아님·모름(git 없음, 시간 초과, 권한, 비정상 출력) 셋으로 나눠 모름이면 꼬리표 없이 수집하고 그 세션의 `session_identity` 일감을 남긴다; drain은 그 일감에서 12의 세션 토큰 수집 경로로 transcript에서 cwd가 있는 첫 메시지의 cwd(22)를 다시 읽어 묻고, 성공하면 비어 있던 꼬리표를 한 번 채우며(null → 값만, 이미 있으면 그대로; 레포 아님이면 일감을 닫음), 끝내 실패하면 11의 실패 기록 함수로 `failures`에 남겨 doctor가 보인다."
verify = "`github.com/Owner/Repo`와 `github.com/owner/repo` remote의 두 세션이 한 프로젝트이고 목록에 없는 호스트의 대소문자만 다른 두 remote는 두 프로젝트이며, git을 찾을 수 없게 한 채 연 세션은 꼬리표 없이 수집되고 git을 되돌린 뒤 drain이 꼬리표를 채우며, 레포 밖 세션에는 일감이 남지 않고, 꼬리표가 있는 세션은 drain이 바꾸지 않는다."
covers = ["E2-6"]
after = [8, 11, 12, 18, 23]
hitl = false
risk = "medium"
