# epic 2 세션 수집과 비밀 가리기 — 표 순서 = 만드는 순서. id는 영구.

[[entry]]
id = 1
type = "story"
title = "엔벨로프·종료 코드·확인 게이트"
description = "Core에 엔벨로프 코덱(`error{code, message, exit_code, retryable?, hint?, retry{ns, verb, args}}`·`meta{hint, count, has_more, omitted, next}`)과 경고·오류 코드 상수 하나를 두고, SDK 확인 게이트(`confirm: true`, CLI `--yes`)와 종료 코드 3 `CONFIRMATION_REQUIRED`(CLI만 `retry_argv`를 덧붙이고 hook 경로는 0), doctor 상태 `warn`·`skip`(`detail`에 선행 항목)·`summary`, 빈 위치 인자와 id 인자의 제어문자 거부를 만든 뒤, 첫 게이트로 비대화형 `setup run`의 동의를 exit 3으로 바꾼다."
verify = "비TTY에서 `--yes` 없는 `setup run --json`이 exit 3과 `error.retry`(`confirm: true`)·`retry_argv`를 내고, hook 경로 명령은 같은 상황에서 exit 0이며, 다른 프로세스가 잠금을 쥔 동안 doctor `writable`이 `warn`이고 `summary` 건수가 맞으며, 빈 위치 인자가 사용법 오류로 거부된다."
covers = ["E2-1"]
