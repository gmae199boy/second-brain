[[entry]]
id = 6
type = "story"
title = "마이그레이션 0004: 가리기·추출·서브에이전트·브랜치 칸과 실패 키"
description = "SQLite 네 번째 마이그레이션(0003은 2의 `users`)으로 `redactions.pattern_version`과 파일 가리기 자리(`message_id`를 비울 수 있고 `file_id`가 있으며 파일 가리기는 위치가 없음)와 `redactions` 변경 거부 trigger, `document_chunks.chunk_locator`(`page`는 그 사본), `document_extractions`의 `attempt`(`(file_id, attempt)` UNIQUE, 파일당 진행 중 세대 하나)·`failed_stage`·`index_config_id`, `files.source_unreachable_at`, `failures` 키를 `work_items`와 같은 대상 키 `(target_kind, target_id, stage, fingerprint)`로 바꾸는 재생성(행 없음), 서브에이전트 최종 보고를 표시하는 메시지 칸과 `messages.git_branch`(불변 trigger가 새 칸도 막음)를 더하고, `work_items_due_idx`를 11의 청구 질의(미완료이고 `next_attempt_at`이 지난 것, `attempts ASC, id ASC`)를 덮는 인덱스로 바꾸고 그 질의 모양을 테스트에 고정하며(`redactions`의 nullable 전환은 0002 `index_configs`와 같은 재생성으로), `SQLITE_SCHEMA_VERSION`을 4로 올린다; 동작은 이 에픽의 마스킹·가리기·parser와 epic-attachments가 만든다."
verify = "버전 3 DB가 데이터를 보존한 채 4가 되고, 같은 파일의 `attempt` 중복과 같은 대상·단계·fingerprint의 `failures` 두 행과 파일당 진행 중 세대 둘과 `redactions` 수정·삭제가 거부되며, 메시지의 새 칸도 일반 UPDATE로 바뀌지 않고, 청구 순서 질의의 `EXPLAIN QUERY PLAN`에 임시 정렬이 없으며, 마이그레이션 재실행이 `applied=[]`이다."
