[[entry]]
id = 10
type = "story"
title = "spool: DB에 못 쓴 것의 대기열"
description = "`<home>/spool/`에 프로세스별 JSON Lines(쓰는 동안 `.jsonl.open`, 다 쓴 뒤 rename, 줄마다 `schema_version`, 한 줄 64KB 이하, 레코드의 ID·`occurred_at`은 처음 만든 프로세스가 정함)와 claim(`.claiming`, 이름에 청구한 pid; pid가 죽었거나 청구 뒤 10분이 지난 파일은 다음 drain이 `.jsonl`로 되돌림, AD-9)·재주입 틀을 만들고, 수집이 DB를 열 수 없거나 잠금 시간 초과·스키마 불일치일 때 수집 밀림 표시를 spool에 쓰게 하며(디스패처의 스키마 불일치 거부도 spool로), doctor에 spool 건수와 가장 오래된 시각을 더한다(재주입 일감은 12)."
verify = "다른 프로세스가 쓰기 잠금을 쥔 동안 hook 수집이 turn 예산(3초)이 지나면 곧바로 exit 0으로 끝나고 spool에 표시가 남으며, 쓰는 중인 `.open` 파일은 claim되지 않고, 청구한 프로세스를 죽이면 다음 청구가 그 파일을 `.jsonl`로 되돌려 다시 집으며, 스키마 버전이 다른 DB에서 쓰기 명령이 spool로 가며 `SCHEMA_MISMATCH`를 내고, doctor가 spool 건수를 보인다."
covers = ["E2-7"]
after = [2, 5, 9]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/deferred-work.md, 쓰기 가드의 DB_UNAVAILABLE exit 항목(Triage → story 10)"]

[[entry]]
id = 11
type = "story"
title = "일감 대기열과 drain"
description = "`work_items` 청구(짧은 쓰기 트랜잭션, 종류별 청구 기간과 1초~1시간 지수 재시도를 Core 상수로, 실패가 적은 것부터 `attempts ASC, id ASC`이고 6이 바꾼 인덱스를 씀, 처리에 들어간 워커만 시도 횟수를 올림; 오류 분류에 따라 DB에 쓸 수 없음은 실패로 세지 않고 spool로, 영구 오류(`retryable: false`)는 첫 실패에서 기록하고 닫음, 외부 일시 오류는 `Retry-After` 또는 종류별 긴 간격, 분류를 모르는 오류는 기본 간격으로 10번, AD-21)와 10번 실패한 일감을 `failures`에 남기고 같은 트랜잭션에서 그 행을 닫는(`completed_at`; 같은 대상의 다음 일감은 새 행이고, 실패였는지는 `failures` 행으로 안다) 실패 기록 함수 하나(결정된 fingerprint, 실패 대상 키(6이 바꾼 `failures`의 `target_kind`·`target_id`, `work_items`와 같음; 세션 수집은 `session`/세션 토큰), 오류 문자열은 마스킹한 뒤 8KB에서 UTF-8 경계로 잘라 `message`에, 마지막 시도에서만 기록, payload는 두지 않고 다시 하기는 대상을 다시 읽음, DB에 못 쓰면 spool), 시간 예산이 있는 `brain queue drain`, 사람이 부른 명령 끝의 기회적 drain(동기 시작 hook과 hook 경로는 돌지 않고, 할 일이 있는지 읽어 본 뒤에만 쓰기 잠금)을 만든다."
verify = "겹쳐 돈 drain 두 개가 같은 일감을 두 번 처리하지 않고, 10번 실패한 일감이 `failures` 한 행으로 남고 닫혀서 같은 대상의 새 일감을 막지 않으며, 영구 오류는 한 번에 `failures`에 남고 닫히며, `Retry-After`가 있는 일시 오류는 그 시각 전에 다시 청구되지 않고, 같은 원인 100번이 한 행이고 분류가 다르면 다른 행이며, 청구를 놓친 워커는 시도 횟수를 올리지 않고, 실제 청구 질의의 `EXPLAIN QUERY PLAN`이 6의 인덱스를 쓰고 임시 정렬이 없다."
covers = ["E2-7"]
after = [3, 6, 9, 10]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/architecture-brain-v1-slice-1/reviews/review-adversary-2026-10-14.md, H-8", "_bmad-output/personal-brain/inputs/weknora-patterns.md, §1.1 (A8, A9)"]

[[entry]]
id = 12
type = "story"
title = "수집 일감: 내역 스캔, 세션 토큰 수집, 재시도, spool 재주입"
description = "drain에 수집 일감 종류를 더해(스캔 대상은 각 프로젝트 폴더 바로 아래의 `<session-id>.jsonl`뿐이고 `subagents/`·`tool-results/`는 세션으로 보지 않음; 7이 서브에이전트 최종 보고를 `<session-id>/subagents/`에서 읽는다면 그것은 부모 세션의 수집으로 들어오고 스캔하지 않음) `transcript_files` 내역에 없거나 커진 transcript만 읽게 하고(설치 직후 첫 스캔이 디스크에 남은 것을 모두 가져오고 그 뒤로는 hook이 놓친 것만 줍는다; 세션을 처음 만든 경로가 스캔이면 `import`, hook이면 `live`), 세션 토큰만으로 그 세션의 transcript를 찾아 증분 수집하는 SDK 기능(epic 3의 `log append`와 epic 4의 `recall`이 부름), 실패한 수집 다시 하기, spool의 수집 표시와 실패 기록 재주입(레코드별 시도 횟수는 10의 줄 형식에 칸을 더해 남기고, 일부 줄만 실패하면 남은 줄을 횟수와 함께 새 `.jsonl`로 다시 쓰며, 한 레코드가 10번 실패하면 `failures`에 남기고 그 줄을 `spool/failed/`로 옮겨 지우지 않고 doctor가 건수를 보임, AD-9), `brain failures list`·`brain failures retry`(대상 종류로 거르는 조회와 종류별 다시 하기. 이 스토리는 세션 종류를 만들고, 다른 종류는 그 일감을 만드는 에픽이 더함), doctor의 미수집 세션(30일 기한이 가까운 것은 경고)·실패 수집 항목을 만든다."
verify = "transcript 폴더 fixture에서 첫 drain이 모든 세션을 `import`로 넣고, 그 뒤 hook 없이 생긴 세션과 이어 쓴 턴은 다음 drain이 줍되 바뀌지 않은 파일은 읽지 않으며, 세션 토큰만으로 수집하면 그 세션의 새 턴만 들어가고, DB가 돌아오면 spool에 남은 표시가 채워지며, fixture의 `subagents/` 파일은 세션 수에 들어가지 않고 fixture의 세션 수와 Brain 세션 수가 같다(SM-5)."
covers = ["E2-7", "E2-5"]
after = [7, 10, 11]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-capture/epic-capture-research.md, §4"]
notes = ["내역 관리를 하면 안되나? 설치 했을 때 한 번 하고 너가 말한대로 데몬이 꺼져있었거나 했던 것들을 내역으로 관리해서?"]

