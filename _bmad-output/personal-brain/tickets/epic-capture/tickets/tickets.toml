[[entry]]
id = 5
type = "story"
title = "플러그인 설치 경로: bootstrap·완료 기록·shim"
description = "`plugin/`(매니페스트 `.claude-plugin/plugin.json`, SessionStart 비동기 bootstrap hook만 든 `hooks/hooks.json`, PATH에 기대지 않고 node를 찾는 sh 런처, 의존성 없는 `bootstrap.js` 복사본과 parity 테스트, `app-ref`와 함께 오르는 `version`, 첫 세션 자동 설치를 밝힌 설명; `skills/`는 epic 3)과 루트 `.claude-plugin/marketplace.json`을 만들고, bootstrap에 설치 잠금·Node 24.16 하한(F7)·ref로만 ff·`--frozen-lockfile --ignore-scripts`·플러그인이 앞설 때만 갱신·4의 흐름 결과 끝에서 완료 검증(`guide schema --json`) 뒤 `installed.json`·`systemMessage` 한 줄만의 stdout을, 빌드에 `dist/build.json`을, shim에 node 실제 바이너리 고정과 폴백 재고정을, doctor에 `PLUGIN_BEHIND`와 shim에 박힌 home과 다른 home으로 도는 경우의 `warn`(F9)을 더하며, 런처가 하한 이상의 node를 찾지 못하면 아무것도 하지 않고 stdout에 `systemMessage` 한 줄(찾아본 위치와 하한)을 내고, 설치 잠금의 stale 판정은 pid 프로세스 생존(`kill -0`) 또는 30분 경과다(AD-19); 자동 업데이트 설정 `[update] auto`(기본 true, 설치기가 TTY에서 묻고 비대화형은 기본값)를 설정 코덱에 더하고, bootstrap은 false면 갱신하지 않으며(첫 설치는 함) doctor가 경고 `UPDATE_AVAILABLE`(Core 코드 목록에 더함, hint는 epic 5의 `setup upgrade` 전까지 `[update] auto`를 켜라고 안내)을 낸다(2026-10-16; 수집 hook은 14)."
verify = "사람이 로컬 marketplace로 플러그인을 설치하고 새 세션을 열면 설치가 한 번 돌아 `installed.json`이 생기고, 두 세션을 동시에 열어도 bootstrap은 한 번만 돌며, `app-ref`를 올리면 다음 세션에서 ff+build가 한 번 돌고, 뒤처진 `app-ref`에서는 아무것도 하지 않고 doctor가 `PLUGIN_BEHIND`를 보이며, 하한 이상의 node가 없는 환경에서 첫 세션을 열면 `systemMessage` 한 줄이 남으며, `[update] auto = false`에서 `app-ref`를 올리면 갱신하지 않고 doctor가 `UPDATE_AVAILABLE`을 보인다."
