[[entry]]
id = 13
type = "story"
title = "messages redact 연쇄"
description = "`brain messages redact`(SDK 확인 게이트, 메타 `risk: destructive`)는 저장본에서 지우는 사람의 가리기다(나갈 때의 가리기는 17). 입력은 메시지와 지울 글자 그대로(종류는 사람이 주거나 `manual`), 또는 `detected`(그 메시지에서 지금 패턴이 찾는 구간 전부, `pattern_version` 기록)이고, 한 쓰기 트랜잭션에서 본문 일부나 전체와 그 메시지의 도구 메모 대상을 `[REDACTED:<kind>]`로 바꾸고, `redactions`에 위치·종류·지운 내용의 해시를 남기고(도구 메모 대상은 18의 `tool_note_id`, 위치는 그 대상 위), 그 메시지가 걸린 조각(그 메시지의 `occurred_at`이 `from_at..to_at` 안에 드는 조각, spine AD-11)과 FTS 행을 지우며, 하나라도 못 하면 롤백해 실패로 답한다(spool 금지; 조각·미러 재생성 일감은 epic 4, 내보내기는 epic 5, `ATTACHMENT_NOT_REDACTED`는 epic-attachments)."
verify = "가린 문자열이 DB 어디에도(본문, 도구 메모, chunks와 FTS, redactions) 남지 않고, redact 직후 같은 연결의 일반 UPDATE가 거부되며 롤백 뒤 표시가 남지 않고, 비TTY에서 `--yes` 없이 부르면 exit 3과 `error.retry`·`retry_argv`가 오며, `detected`로 가린 메시지의 저장 본문에 패턴이 찾던 값이 없고, 도구 메모 대상 가리기가 `tool_note_id` 행으로 남는다."
covers = ["E2-8"]
after = [1, 12, 17, 18, 20]
hitl = false
risk = "high"

[[entry]]
id = 14
type = "story"
title = "플러그인 수집 hook 개통"
description = "플러그인 hooks에 Stop·SessionEnd 수집과 SessionStart 비동기 drain을 더하고(모두 5의 런처를 거쳐 `|| exit 0`, SessionEnd는 최선 노력), hook으로 온 수집이 `<home>/run/`에 Harness별 마지막 수신 시각(파일 mtime)을 남기게 하며, claude-code connector를 등록해 `setup connect claude-code`가 `installed.json.plugin_root`로 플러그인을 확인하고(`PLUGIN_NOT_INSTALLED`는 경고) 설치기가 예전에 쓴 Brain 표식 hook을 지우며 shim은 doctor의 `inspectShim`으로 검사하게 하고(F8), doctor에 마지막 hook 수신 시각과 `PLUGIN_DUPLICATE`를 더한 뒤, 사람이 이 기계에서 실제 수집을 켠다."
verify = "플러그인을 켠 실제 세션이 hook 하나로 수집되고 설치기 hook과 플러그인 hook이 함께 있지 않으며, 시작 hook만 돈 세션에는 행이 없고 첫 설치 세션은 설치가 끝난 뒤 drain이 줍고, doctor가 마지막 hook 수신 시각과 `installed.json`·`app-ref`·빌드 신원의 관계를 보인다."
