id = 21
type = "story"
title = "수집 경로 보강: 커서 경고·start_source·큰 transcript"
description = "2.7 follow-up 리뷰의 커서·저장 지적을 고친다. 커서가 맞지 않아 처음부터 읽었는데 메시지가 없으면 `CURSOR_RESET` 경고를 그대로 내고 맞지 않는 커서를 지운다. 겹친 reset 읽기가 커서를 뒤로 돌리지 않는다(커서 비교는 24의 시각 비교를 쓴다). `start_source`는 이 세션이 처음 어떻게 시작했나이고, 이미 값이 있으면 바꾸지 않는다(2026-10-20 사용자). transcript에서 다섯 값(startup·resume·clear·compact·fork)을 모두 읽는다. Store의 세션 행 읽기는 예외 대신 `DB_UNAVAILABLE`로 답하고, transcript 내역 기록의 예외는 수집을 실패로 만들지 않는다. parser는 커서 뒤만 읽을 때 파일 전체를 여러 번 훑지 않는다(앞부분 확인은 한 번). 23이 parser 버전을 올리기 전에 이 스토리가 끝난다."
verify = "메시지가 없는 transcript로 바뀐 세션을 다시 넣으면 `warnings`가 `CURSOR_RESET`이고 다음 수집은 경고 없이 끝나며, reset 읽기 둘이 겹쳐도 커서가 뒤로 가지 않고, startup으로 시작해 resume된 transcript의 `start_source`가 startup으로 남고 다섯 값이 모두 읽히며, 잘못된 시각이 든 세션 행이 있어도 수집이 예외 없이 코드로 답하고, 30 MB 생성 fixture의 증분 수집 시간을 plan에 남기며 그것이 Stop hook 예산 안이다."
