[[entry]]
id = 17
type = "story"
title = "마스킹 B: 나갈 때 가리기로 바꾸기"
description = "9가 수집 경로에 넣은 가리기(`sessions.ingest` use case의 `maskSecrets` 호출, `IngestMessage.redactions`, Store가 수집 중 쓰는 `redactions` 행, `IngestCounts.redactions`)를 빼서 메시지 본문과 도구 메모 대상을 원문 그대로 저장하고, `maskSecrets`를 Core의 출력 가리기 함수로 남겨 Core의 출력 코덱(엔벨로프 코덱의 `data`·`error`·`warnings`·`meta` 문자열, hook 출력 코덱)이 그것을 부르게 하며(도구 메모를 돌려주는 읽기 결과는 그 칸에만 `tool_target` 규칙(셸 `NAME=value`)을 먼저 걸고, 코덱은 모든 문자열에 본문 규칙을 건다; 가린 표시는 다시 잡히지 않아 두 번 걸려도 같다 — 2026-10-19 사용자), 출력 코덱 등록부와 계약 테스트(비밀 fixture를 수집한 뒤 등록된 모든 코덱의 출력에 값이 없고 저장본에는 있음; 등록하지 않은 코덱이 있으면 실패; 미러·내보내기·복제·임베딩 코덱은 그것을 만드는 에픽이 등록)를 두고, 9가 미룬 패턴 문제 셋(영어 키워드 값이 평범한 코드·문장까지 가림, 한국어 '비밀번호 X'·'비밀번호가 X'를 놓침, 값이 `!` 같은 구두점에서 끊겨 뒤가 남음)을 고쳐 `SECRET_PATTERN_VERSION`을 '2'로 올린다(놓침은 넓히는 쪽, 과잉 가림은 값 모양 규칙으로; 세부는 plan, 2026-10-19 change-masking-b-and-review-fixes D1·D4), parser가 500자로 자른 도구 메모 대상의 끝에 걸쳐 잘린 비밀 조각도 출력에서 가린다(2.7 follow-up 리뷰 #21, 2026-10-20)."
