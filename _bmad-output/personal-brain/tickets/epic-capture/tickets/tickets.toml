[[entry]]
id = 2
type = "story"
title = "Tracer: Stop hook 한 턴이 brain.db에 남는다"
description = "parser 계약을 AD-4·8대로 바꾸고(parser는 순서만 내고 `seq`는 Store가 삽입 트랜잭션에서 배정하므로, 같은 seq를 조용히 버리던 메모리 가짜의 경우 자체가 없어짐) 메인 대화의 사용자·에이전트 본문만 읽는 Claude Code parser, `createBrain`의 sessions와 Clock·IdGen 주입, Core `sessions.ingest`(세션 행은 수집만 만든다), SQLite `SessionStore`(ensure·ingest·readSession), hook stdin을 읽는 `brain sessions ingest`를 잇고, 사람이 임시 home과 플러그인 밖의 개발용 Stop hook으로 Claude Code 세션을 열어 본다(플러그인 hook과 connector 등록은 14); 사용자 정체성은 마이그레이션 0003이 `users`(`id` UUIDv7, `name`, `is_self` 1인 행 하나, `created_at`)와 `sessions.user_id` FK(`sessions` 재생성)를 더하고 `SQLITE_SCHEMA_VERSION`을 3으로 올리며, `setup run`이 마이그레이션 직후 '나' 행을 찾거나 만들고 수집은 그 id를 쓰며 '나'가 없으면 `USER_MISSING`이다(2026-10-16, change-users-and-review-gaps D0)."
verify = "임시 home에서 개발용 Stop hook으로 두 턴 대화한 세션의 발화가 `messages`에 seq 0부터 순서대로 있고, 같은 수집을 다시 돌리거나 둘을 동시에 돌려도 건수가 같고 seq가 겹치지 않으며, SQLite가 `sessionStoreContract`를 통과하고, `second_brain` import만으로 DB 파일이 열리지 않으며, `setup run`을 두 번 돌려도 `users`에 '나' 한 행이고 세션의 `user_id`가 그 id다."
covers = ["E2-4", "E2-5"]
after = [1, "1.10", "1.11"]
hitl = true
