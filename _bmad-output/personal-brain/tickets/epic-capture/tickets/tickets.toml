[[entry]]
id = 18
type = "story"
title = "마이그레이션 0005: 도구 메모 가리기 기록·호출 키·실패 단계 강제·프로젝트 비교 키"
description = "SQLite 다섯 번째 마이그레이션으로 `redactions`에 `tool_note_id`(→ `tool_notes.id`)를 더하고 대상을 `message_id`·`file_id`·`tool_note_id` 중 하나만으로 하며(도구 메모 가리기의 위치는 그 대상 위의 구간; 0004와 같은 재생성, 불변 trigger 유지), `document_extractions`에 `failed`가 되는 insert·update는 `failed_stage`가 있어야 한다는 trigger를 두고(이미 `failed`인 0004 이전 행은 건드리지 않음), `projects`에 비교 키 `identity_key`(not null, UNIQUE; 기존 행은 `github.com/`·`bitbucket.org/`로 시작하면 소문자, 그 밖은 그대로 채움; `remote_identity`는 표시용으로 남음)를 더하고, 대소문자만 다른 이름은 같은 프로젝트이므로 0005 전에 setup이 비교 키가 겹치는 기존 프로젝트 묶음을 찾아 이미 있다고 보이고(묶음마다 `remote_identity`·세션 수), 합칠지 묻는다(SDK 확인 게이트; TTY는 묻고, 비대화형은 `--yes` 없으면 exit 3 `CONFIRMATION_REQUIRED`). 동의하면 묶음마다 먼저 만든 프로젝트(id가 가장 작은 UUIDv7) 하나로 합쳐 `worktrees`(같은 경로면 워크트리도 하나로)·`sessions`·`log_entries.apply_project_id`를 그쪽으로 옮기고 나머지 행을 지운 뒤 0005를 적용하며, 거절하면 아무것도 바꾸지 않고 DB를 버전 4로 둔 채 `SETUP_CANCELLED`로 끝낸다(2026-10-19 사용자), `failures`에 처음 난 때 `first_occurred_at`(not null, 정규형 시각; 기존 행은 `occurred_at`으로 채움)과 횟수 `occurrences`(not null, 1 이상; 기존 행은 1)를 더하고 11의 실패 기록 함수(`recordFailure`, SQLite와 가짜 store)가 새 행에는 `first_occurred_at = occurred_at`·`occurrences = 1`을, 같은 키를 다시 만나면 `first_occurred_at`은 그대로 두고 `occurrences`를 1 올리게 하며(`occurred_at`·`message`는 11이 이미 방금 것으로 바꿈, 2026-10-19 사용자), `tool_notes`에 그 메모를 만든 도구 호출의 id `call_id`(nullable, 기존 행은 null; 같은 세션에서 null이 아닌 값은 UNIQUE; 0004와 같은 재생성, 불변 trigger 유지)를 더해 parser 버전이 바뀌어 메모가 붙는 메시지가 달라져도 같은 호출을 한 메모로 알아보게 하고(2.7 follow-up 리뷰 #9), `SQLITE_SCHEMA_VERSION`을 5로 올린다; 동작은 13(도구 메모 가리기)·20(비교 키)·23(`call_id` 쓰기)과 epic-attachments(추출 실패)가 만든다."
verify = "버전 4 DB가 데이터를 보존한 채 5가 되고, 대상이 둘이거나 없는 `redactions` 행과 위치가 없는 `tool_note_id` 행과 `failed_stage` 없이 `failed`가 되는 추출 세대와 비교 키가 같은 두 프로젝트가 거부되며, 대소문자만 다른 두 프로젝트가 있는 DB에서 `setup run`이 그 묶음을 보이고 묻고, 동의하면 한 프로젝트로 합쳐져 세션·워크트리 건수가 보존되고, 거절하면 DB가 바뀌지 않고 버전 4로 남으며, 0004 이전의 `failed` 행은 그대로 읽히고, 버전 4의 `failures` 행이 `first_occurred_at = occurred_at`·`occurrences = 1`로 옮겨지고 같은 원인을 세 번 기록하면 한 행에 `occurrences = 3`이고 `first_occurred_at`은 첫 번째의, `occurred_at`·`message`는 세 번째의 것이며, 같은 세션에 `call_id`가 같은 두 도구 메모가 거부되고 버전 4의 도구 메모가 `call_id` null로 보존되며, 마이그레이션 재실행이 `applied=[]`이다."
