[[entry]]
id = 22
type = "story"
title = "parser 보고 판정·출처·꼬리표 근거"
description = "2.7 follow-up 리뷰의 보고·출처 지적을 고친다. 같은 에이전트의 handback 줄이 있는 Agent 도구 결과와 task-notification `<result>`는 보고가 아니다(안내 문장 맞춤은 보조로 남고, 'has not reported yet'도 빠진다). task-notification은 첫 `<status>`가 completed이고 `<result>`가 하나일 때만 보고다. handback은 앞쪽에 그 에이전트 id가 나온 것, 곧 이 세션이 시작한 에이전트의 것만 받고, 그 메시지의 cwd·branch는 비운다. 그래서 세션 꼬리표의 근거는 cwd가 있는 첫 메시지의 cwd다(8의 규칙을 바꿈, 2026-10-20 사용자). `handbackReportText`가 없는 옛 handback의 본문을 `origin.body`에서 읽는 규칙을 정해 넣거나, 넣지 않기로 한 결정을 plan에 남긴다(deferred-work 2026-10-19 항목). user 줄은 출처가 없거나 사람인 것과 handback만 받는다(허용 목록). `<local-command-stderr>`·`<user-prompt-submit-hook>`로 시작하는 줄은 도구 출력으로 뺀다. parser 버전은 올리지 않는다. 실제 수집 전이라 다시 읽을 저장 세션이 없고, 23이 한 번 올린다."
verify = "중립 fixture에서 handback이 있는 에이전트의 Agent 결과와 안내 문장뿐인 task-notification(두 문장, 바꾼 문구 포함)이 보고로 들어가지 않고, completed가 아닌 알림과 `<result>`가 둘인 알림이 보고가 아니며, 이 세션이 시작하지 않은 에이전트의 handback이 빠지고, handback 메시지에 cwd·branch가 없으며, 첫 줄이 handback인 세션의 꼬리표가 cwd가 있는 다음 메시지로 정해지고, 모르는 출처의 user 줄과 `<local-command-stderr>`·`<user-prompt-submit-hook>` 줄이 빠지며, 이 Mac transcript의 구조만 센 보고 판정을 수정 전후로 plan에 남긴다."
covers = ["E2-4", "E2-6"]
after = [21]
