[[entry]]
id = 24
type = "story"
title = "seq 삭제: 마이그레이션 0006과 시각 순서"
description = "메시지 번호를 없앤다(2026-10-20 사용자, change-drop-message-seq). SQLite 마이그레이션 0006이 `messages.seq`와 `unique (session_id, seq)`를 지우고(재생성, 불변 trigger 교체, FK 유지), `log_entries.anchor_seq`·`joined_upto_seq`를 지우고, `chunks`의 범위를 `seq_from`·`seq_to`에서 첫·끝 메시지 시각 `from_at`·`to_at`으로 바꾼다(키 `(session_id, index_config_id, from_at, to_at)`). `SQLITE_SCHEMA_VERSION`은 6이다. Store는 번호를 붙이지 않고, 메시지 정체는 `(session_id, harness_message_id)`뿐이다. 대화 순서로 돌려주는 읽기는 `occurred_at` 순서이고 같은 시각의 순서는 정하지 않는다. 그래서 버전 업으로 대화 중간에 더해진 메시지도 제자리에 읽힌다(2.7 follow-up 리뷰 #10을 닫는다). 도구 메모는 그 메시지의 `occurred_at`, 그다음 `ordinal` 순서다. 커서의 전진 비교는 커서 메시지의 `occurred_at`으로 한다. 21이 이 비교를 겹친 reset 규칙에 그대로 쓴다. Core 도메인 타입의 `seq`·`seqFrom`·`seqTo`·`anchorSeq`·`joinedUptoSeq`를 지운다. Core 가짜 store(`packages/core/src/testing/fakes/store.ts`)의 번호 붙이기·정렬·커서 비교와 `sessionStoreContract`의 번호 사례도 24가 고친다(21·23이 같은 파일을 이어 고친다). `chunks`·`log_entries`는 아직 쓰는 코드가 없어 행이 없다. 그래서 `chunks` 재생성(`chunks_fts` trigger를 다시 만듦)에 잃을 것이 없고, `log_entries`의 두 칸은 인덱스·trigger·제약에 걸리지 않으므로 `drop column`으로 지운다. Postgres 스키마는 바꾸지 않고 deferred-work의 Postgres 뒤처짐 항목에 0006을 더한다(epic 7). README의 순서 문단과 parser·port 주석을 시각 순서로 고친다."
verify = "`sessionStoreContract`가 번호 없는 계약으로 두 Store에서 통과하고, v5 DB를 `setup run`으로 올리면 버전 6이고 메시지·도구 메모 건수와 본문이 그대로이며 `messages`에 `seq` 칸이 없고, 같은 transcript를 두 번 또는 동시에 넣어도 모든 테이블의 건수가 같으며, 저장된 세션에 대화 중간 시각의 메시지가 나중 배치로 들어와도 `sessions` 읽기에서 제자리에 놓이고, 겹친 수집의 짧은 쪽이 나중에 커밋돼도 커서가 뒤로 가지 않으며, 이 Mac transcript를 현재 parser로 읽어 남는 메시지의 시각 역전·같은 밀리초 쌍 수를 plan에 남긴다."
covers = ["E2-5", "E2-11"]
after = [18]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/change-drop-message-seq/change-drop-message-seq.md, §1·§4", "_bmad-output/personal-brain/tickets/epic-capture/tickets/story-0005-plan.md, 재생성 방식", "_bmad-output/personal-brain/tickets/epic-capture/tickets/story-transcript-parser-follow-up-review.md, #10"]

