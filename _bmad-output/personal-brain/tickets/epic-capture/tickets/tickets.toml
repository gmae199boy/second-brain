id = 23
type = "story"
title = "parser v4: 도구 메모 호출 키·줄 읽기·버린 줄 집계"
description = "Claude Code parser를 버전 4로 올려(`CLAUDE_CODE_PARSER_VERSION` '4') 2.7 follow-up 리뷰의 도구 메모·줄 읽기 지적을 고친다. 22의 규칙도 이 버전 업으로 함께 나간다. 도구 메모는 호출 id를 18의 `call_id`로 내고, Store는 그것으로 같은 호출을 알아본다. 첫 메시지 앞의 호출에도 메모를 남긴다. 대화가 아닌 줄의 `tool_result`로 ok를 정하지 않고, 끝나지 않은 Agent 호출을 실패로 굳히지 않는다. 도구 대상은 식별 키 fallback을 넓히고, 기본 객체 키와 같은 도구 이름에도 맞게 찾으며, 코드 포인트 경계에서 자른다. 끝이 아닌 깨진 줄은 건너뛰고 경고 `TRANSCRIPT_LINES_SKIPPED`로 알린다(파일 전체를 거부하는 것은 읽을 줄이 하나도 없을 때뿐). 정규형으로 왕복되지 않는 timestamp의 줄은 뺀다. 버린 줄을 이유별로 세어 parser 결과와 `sessions ingest`의 `data`에 낸다(`meta`가 아님). 첫 메시지 앞의 도구 호출은 바로 다음 메시지에 붙여 메모를 남긴다(리뷰 #8, 스키마 변경 없음, 2026-10-20 사용자). 서브에이전트 보고는 메시지로 내지 않는다(2026-10-21 사용자): 동기 Agent 결과·task-notification `<result>`·peer handback의 보고 읽기와 그것만을 위한 규칙(안내 문장, handback 출처, 옛 handback 틀)을 걷어 내고, 그 줄들은 22의 user 줄 허용 목록대로 메시지가 아니다. `isSubagentReport`는 늘 false다. orca가 터미널에 친 고정 머리말 줄(본문이 `You are working inside Orca`, `Please carry out this task from my Orca coordinator`, `You have <숫자> orchestration message`로 시작하는 user 줄)은 사람이 한 말이 아니므로 메시지로 내지 않는다(2026-10-21 사용자; 실측 31줄. 워커 세션에서 코디네이터가 이어 보낸 나머지 지시는 deferred-work의 세션 단위 표시 후보)."
verify = "버전 3이 실제로 남긴 상태를 심은 세션을 버전 4로 다시 넣어도 한 호출에 도구 메모가 하나이고, 끝이 아닌 깨진 줄이 있는 transcript가 `TRANSCRIPT_LINES_SKIPPED`와 함께 수집되며, 대화가 아닌 줄의 `tool_result`가 ok를 정하지 않고 끝나지 않은 Agent 호출이 실패로 남지 않으며, 첫 메시지 앞의 호출에 메모가 있고, `toString`이라는 도구와 500번째 글자가 surrogate pair에 걸린 대상이 맞게 나오며, 시간대 없는 timestamp의 줄이 빠지고, 결과에 이유별 버린 줄 수가 나오며, 이 Mac transcript의 구조만 센 빈 도구 대상 비율을 수정 전후로 plan에 남기고, 21의 30 MB 증분 수집 시간이 여전히 Stop hook 예산 안이다. 보고가 든 fixture(`peer-handback.jsonl`·`report-provenance.jsonl`)를 넣으면 `is_subagent_report=1` 행과 보고·안내 문장 본문이 DB에 없고, Agent 호출의 도구 메모는 남는다. orca 머리말 세 가지로 시작하는 user 줄이 메시지로 들어가지 않고, 같은 낱말이 문장 중간에 든 내 발화는 그대로 들어간다."
covers = ["E2-4"]
