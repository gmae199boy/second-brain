# epic 21 Garmin 확장 — 표 순서 = 만드는 순서. id는 영구. (2026-11-05)
# 한 레인: extensions/garmin·Garmin migration·시험을 모든 스토리가 함께 고친다. 옛 21.1(정리)은 2026-11-05 공유 편집 충돌을 피하려고 20.6으로 옮겼다(id 1은 다시 쓰지 않음).

