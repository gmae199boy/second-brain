[[entry]]
id = 5
type = "story"
title = "core 연결·조회 명령·플러그인: 공통 cron 예약으로 수집 뒤 분석이 돌고, 결과가 core 채널로 나가며, brain ext garmin 명령으로 조회하고, second-brain-garmin 플러그인으로 설치된다"
description = "E21-5를 만든다. manifest에 수집·분석 일감, cron 기본 예약(수집 11:00, 분석 11:30, Asia/Seoul)과 의존(그날 수집 성공 → 분석), 놓친 회차 latest, 설정 garmin.*(분석 에이전트·모델·effort·timeout, tokenstore 경로)과 필요 기능 channel.send, 읽기 명령 `daily-values`(현지 날짜 범위+시간대·지표·운동 조건 → 행별 값·단위), `period-summary`(같은 조건 + 집계 sum|mean, 허용 집계만 → 값·단위·관측 수·NULL 수·적용 기간, 0건·전부 NULL은 값 null·개수 0, NULL은 0이 아님), `recent-evaluations`(scope·개수 → 평가 요지·날짜·file_id)를 선언한다. 이 조회 계약은 21.5가 만들고 17.4가 소비·독립 검증한다. 옛 telegram.py 발송·REPORT_FAILED를 core 채널 발신 요청(의미 키 UNIQUE)으로, 새 리포트·그래프를 21.2와 같은 중립 metadata로 file_requests에, 옛 config 파일 읽기를 설정 snapshot으로 바꾸고 옛 schedule.py(launchd)는 지운다. 같은 marketplace에 second-brain-garmin 플러그인(package/·digest, 얇은 진입점, 자기 ref·version)을 더한다."
verify = "시험(가짜 clock·fake Codex·가짜 Telegram 서버)에서 cron 예약이 수집 성공 뒤에만 분석을 돌리고, 결과 묶음이 core 채널로 한 번만 나가며 발신 실패가 평가를 지우지 않고, 리포트·그래프가 중립 metadata와 함께 core 파일로 등록되며, `brain ext garmin period-summary`와 MCP 도구가 합성 데이터의 `[10, NULL, 30]` 합계 40·평균 20과 운동 조건·0건·전부 NULL 결과를 가려진 JSON으로 돌려주고, ext disable 뒤 예약 발화·새 청구·명령이 멈추며 native 행·평가·core 리포트 파일은 남고 ext enable로 다시 돌며, Garmin 패키지(extensions/garmin) 안에 Telegram 직접 호출·launchd 예약·설정 파일 읽기가 없고(core Telegram adapter와 core 데몬 LaunchAgent는 대상 아님), second-brain-garmin 플러그인 fixture로 확장이 설치된다."
