[[entry]]
id = 2
type = "story"
title = "Tracer: 옛 Garmin 프로그램이 PG garmin 표 위에서 돌고, 합성 SQLite를 복사 반입하면 report_input이 SQLite 때와 같은 폴더를 만든다"
description = "E21-2를 만든다. `~/github/garmin` 7fb33dd의 src를 extensions/garmin으로 가져온다. 옛 store migration 16개(325행)를 같은 모양의 garmin 확장 migration으로 옮기고 user_id·garmin.account_connections(user_id ↔ 외부 계정 identity·tokenstore 참조·시간대)와 평가 이력(revision) + 최신 view를 더한다. store 계층을 sqlite3 → psycopg로 바꾸고(? → %s, INSERT OR IGNORE → ON CONFLICT DO NOTHING, PRAGMA table_info/user_version/foreign_keys/WAL·URI·autocommit·row_factory·예외 처리), 읽기 snapshot은 REPEATABLE READ다. 원본 SQLite 표를 같은 모양 표로 복사하고, 옛 리포트·그래프·facts 파일은 file_requests로 core 파일이 되며 중립 metadata(kind report|graph, report_date, scope, 원래 경로 hash)와 평가 행 ↔ file_id 관계를 남기는 반입 일감(epic 14 capture·읽기 전용 reader·hash·checkpoint·preserved_rows 재사용, 작은 트랜잭션·재개)을 만든다. 시험은 합성 SQLite fixture를 SQLite와 PG 양쪽에서 옛 report_input으로 돌려 비교한다."
verify = "통합 시험에서 Garmin 확장 설치 뒤 garmin native 표가 생기고, 합성 SQLite와 합성 리포트 파일을 복사 반입하면 표별 건수·자연키·값·NULL이 원본과 같고 리포트 파일이 중립 metadata와 함께 core 파일로 등록돼 평가 행에서 file_id로 이어지며, 같은 batch를 다시 돌려도 늘지 않고 중간에 죽여도 이어지며, 같은 clock·cutoff로 SQLite 위와 PG 위의 옛 report_input이 만든 폴더의 파일 목록·JSON 값·배열 순서·NULL이 같고, 평가 표에 같은 (report_date, scope)의 두 revision을 넣으면 최신 view가 마지막 하나만 보인다."
covers = ["E21-2"]
after = ["20.6", "20.2"]
hitl = false
risk = "high"
