type = "story"
title = "이 Mac에서 전환: 옛 데이터를 확정 반입하고 옛 예약을 새 예약으로 바꿔 실수집·실평가가 한 번 돈다"
description = "E21-6과 epic 20 설치본 확인을 한다. 플러그인 배포로 core·Garmin 플러그인을 설치하고, 예비 반입(online capture, 계정 raw profile id 확인 gate)으로 경로와 전수 비교를 확인한다. 전환: 옛 예약 중지 → 옛 writer 종료 확인 → 최종 capture → 차분 확정 반입 → 전수 비교·파일 관계 확인 → 새 예약 활성화 → 실수집·실평가 한 번. 어느 단계든 실패하면 새 예약을 켜지 않고 옛 plist를 되살린다. 설치본에서 확장 명령·cron 예약·확장 플러그인 설치가 동작하는지 확인한다. 공개 plan에는 건수·상태만 둔다."
verify = "설치본에서 확정 반입 보고서의 표별 건수·자연키·해시·평가·파일 관계 비교가 모두 일치하고, 옛 LaunchAgent가 내려가 있으며, 새 예약으로 실수집 한 번과 실평가 한 번이 형식·순서·저장·발신 상태 기준으로 성공하고, brain ext garmin 명령이 실제 수치를 돌려주며, 공개 plan·로그에 계정·건강값·평가 본문이 없다(모델 품질은 사람이 판단)."
