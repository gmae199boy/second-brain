description = "E21-4를 만든다. 옛 report·report_input·body intake(사진 → 측정 JSON)를 PG 위에서 확장 일감으로 돌린다. 평가 저장은 UPSERT 대신 revision 이력 + 최신 view이고, 옛 '오늘 day가 있으면 건너뜀'·scope 재개는 저장된 성공부터 잇는다. 모델 CLI(Codex, 설정 garmin.analysis_*)는 감독자 프로세스 그룹 안에서 돌고 모델 호출 동안 DB 트랜잭션을 열지 않는다. 결과 파일 등록·발송 연결은 21.5다. 시험은 fake Codex CLI다."
