# epic 11 PostgreSQL 단일 주 저장소 — 표 순서 = 만드는 순서. id는 영구.
# 한 레인: packages/postgres의 0001·Store 조립과 CLI 조립을 여러 스토리가 함께 고치므로 대부분 순서대로 만든다. 8과 9만 나란히 갈 수 있다.

[[entry]]
id = 1
type = "story"
title = "Tracer: PG 위에서 hook으로 수집한 세션 한 건이 컨테이너를 다시 만들어도 남는다"
description = "가장 얇은 길로 층을 잇는다. 자원 이름 파생 함수(Brain 홈 → compose project·볼륨·포트·Label, 기본 홈이 아니면 접미사), `<home>/postgres/compose.yaml` 템플릿(공식 `postgres:18`, named volume, `127.0.0.1` 포트, `restart: unless-stopped`)과 `.env` 비밀번호 생성, 외부 명령(`docker compose` 등)을 부르는 가짜로 바꿀 수 있는 비동기 runner 하나(8·9가 같은 것을 쓴다), `setup run`의 PG 단계(`docker compose up -d --wait` → 마이그레이션 소유자 role·`brain_app`·`brain` schema → 실행기 → \"나\"; OrbStack 판별·안내의 완성은 8). 새 마이그레이션 실행기(`brain.schema_migrations(owner, version, name, checksum, applied_at)`, 소유자별 연속 번호, checksum, 파일마다 advisory lock 아래 트랜잭션)와 baseline 0001의 수집 부분(workspaces·users·projects·worktrees·sessions·messages·tool_notes·transcript_files·failures·work_items·files·file_locations·message_attachments·redactions와 그 키·FK·불변 trigger). Store는 `setup run`과 `sessions ingest`가 실제로 부르는 verb만 PG에 구현하고, 쓰기는 `withWrite` 하나, 같은 세션 수집은 세션 토큰 `pg_advisory_xact_lock`이다. Core 수집 use case와 CLI 명령 조립을 그 capability로 좁히는 일은 이 스토리가 한다(전체 Store인 척하거나 비운 verb를 두지 않는다). 나머지 세션 verb와 계약은 14다. CLI는 `[store] url_env`가 있으면 이 경로에 PG를 쓰고, SQLite는 기본값으로 남는다(PG만 쓰는 것은 10). 테스트 Compose와 `@second-brain/test-db`를 공식 `postgres:18`·role·schema 기준으로 바꾸고 vector 탐침을 뺀다. 이 Mac의 OrbStack 확인과 판별 probe 결과는 2026-10-28에 끝나 epic Notes에 있다(8이 쓴다). 빌드하는 동안 OrbStack이 켜져 있어야 한다."
verify = "개발 홈에서 `brain setup run`이 compose·볼륨을 만들고 FK를 갖춘 baseline을 빈 DB에 적용한 뒤, hook payload로 `brain sessions ingest`를 돌리면 workspace가 null인 세션과 메시지가 PG에 들어가고, `docker compose down`(볼륨 유지) 뒤 `up`하면 같은 ID·시각·본문이 되읽히며, 운영 홈의 compose project·볼륨·포트는 생기지 않는다. 수집 경로의 계약 case가 PG에서 통과한다."
covers = ["E11-1", "E11-2", "E11-3", "E11-4", "E11-8"]
after = ["9.2", "10.1", "10.2", "10.3", "10.4", "10.6"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-postgres-primary/epic-postgres-primary-research-code.md, §1, §2, §3, §6, §7(T1)", "_bmad-output/personal-brain/tickets/epic-postgres-primary/epic-postgres-primary-validate-set.md, F1, F3, S1"]

[[entry]]
