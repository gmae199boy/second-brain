title = "저장본 가리기와 정리: 가린 문자열이 어디에도 없고 정리가 끝날 때까지 doctor가 경고한다"
description = "`messages.redact`·`files.redact`를 PG에 구현한다. 트랜잭션 로컬 GUC `brain.redacting`을 redact 함수 한 곳이 세우고 지우며, 본문 치환·`redactions`·파생물 삭제·정리 일감을 한 트랜잭션에 넣고, 실패하면 롤백하고 spool하지 않는다. 정리 일감은 트랜잭션 밖에서 `VACUUM FULL` 뒤 `CHECKPOINT`이고, 권한은 제한된 경로(MAINTAIN·`pg_checkpoint`)로만 주며 확장에는 주지 않는다. 끝날 때까지(실패·권한 부족·잠금 대기 포함) doctor가 `warn`이다. file-redaction 계약과 session-store의 가리기 case를 통과시킨다."
