title = "일감·예약·실패: 두 프로세스가 동시에 청구해도 한 번만 처리된다"
description = "WorkStore 10 verb와 ScheduleStore 3 verb를 PG에 구현하고 work-store·schedule-store 계약을 통과시킨다. 청구는 `FOR UPDATE SKIP LOCKED`이고, 연결 함수 한 곳에 경로별 `lock_timeout`·`statement_timeout`·`application_name`·UTC 세션 시간대를 둔다. 잠금 초과는 `DB_LOCKED`로 분류한다. 계약 밖 시험으로 두 프로세스의 동시 drain과 예약 발화 compare-and-set을 확인한다. 임대 갱신·의존성·현지 시각 예약은 epic 12다."
verify = "work-store·schedule-store 계약이 PG에서 통과하고, 두 프로세스가 동시에 drain하는 시험에서 일감마다 처리가 한 번이며, 같은 예약을 두 틱이 동시에 발화해도 일감은 하나이고, `lock_timeout`을 넘긴 쓰기가 `DB_LOCKED`로 돌아온다(시험 이름과 실행 명령은 plan에 적는다)."
covers = ["E11-4", "E11-5"]
after = [2]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-postgres-primary/epic-postgres-primary-research-code.md, §2, §3, §7(T2)"]

