[[entry]]
id = 10
type = "story"
title = "런타임 전환: 모든 명령·데몬·hook·bootstrap이 PG만 쓴다"
description = "7의 조립에서 SQLite 선택을 없애 CLI dispatch·assembly·daemon·install·bootstrap이 PG만 쓰게 하고, `config.toml`의 `store.path`를 없애며, `apps/cli`·`tooling/bootstrap` 통합 시험의 DB fixture를 PG로 옮긴다. 모든 공통 계약 suite를 PG에 연결한다. baseline 0001의 checksum을 여기서 고정한다(이후 바꾸려면 새 번호). 이 뒤로 Store 시험은 모두 PG에서 돈다."
