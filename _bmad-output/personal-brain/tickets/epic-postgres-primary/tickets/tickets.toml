id = 13
type = "story"
title = "이 Mac에서 확인: 플러그인 배포로 PG 설치본이 동작한다"
description = "기능 묶음을 플러그인 배포(`plugin/app-ref`를 앞선 커밋으로, `plugin/.claude-plugin/plugin.json`의 `version`을 함께 올림)로 이 Mac의 설치본에 넣고 에이전트가 확인한다(2026-10-28 위임: 로컬 설치본으로 확인하고, 원격 push가 있어야만 하는 단계는 `operator_actions`에 남긴다). 확인 목록: OrbStack 위에서 설치되고 디스크의 transcript가 다시 들어오며, 다음 Claude Code 세션이 hook으로 수집되고, 컨테이너를 다시 만들어도 데이터·설정이 남으며, DB를 끄면 hook이 막지 않고 spool에 남기고, 다시 켜면 데몬이 재연결해 drain하며, doctor가 상태를 보이고, 옛 `brain.db`에 대한 한 줄이 나온다. DB를 끄는 단계 뒤에는 반드시 다시 켜고 drain이 끝난 상태로 돌려 둔다(이후 스토리가 같은 설치본을 쓴다). plan에는 명령 출력·doctor 출력·`docker compose ps` 요약만 남기고 transcript 본문·비밀 값은 쓰지 않는다."
verify = "에이전트가 이 Mac에서 위 확인 목록을 한 번 돌리고 결과(명령 출력, doctor 출력, `docker compose ps` 요약)를 plan에 남긴다. 끝났을 때 DB와 데몬이 다시 떠 있고 spool이 비어 있다."
covers = ["E11-1", "E11-5", "E11-7", "E11-8", "E11-9"]
after = [12]
hitl = false
risk = "medium"
