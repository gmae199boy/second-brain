[[entry]]
id = 2
type = "story"
title = "baseline 0001 완성: 나머지 core 표와 규칙이 PG에 있다"
description = "1의 0001에 나머지 core 표(log_entries·log_entry_edits·index_configs·chunks·context_injections·document_extractions·document_chunks·file_names·file_metadata·schedules·settings)와 키·규칙을 더한다: 0004~0009의 trigger(locator 필수·page 사본, failed_stage 강제, tag evidence, 0008 첨부·추출 규칙), 반복 예약의 null 금지 CHECK, TRUNCATE 방어, 명명 UNIQUE·due 색인, 검색 대상 다섯 열(`chunks.body`, `log_entries.text`, `tool_notes.target`, `document_chunks.body`, `file_names.text`)의 `lower(col)` pg_trgm expression GIN, `chunk_locator text`와 JSON object CHECK. `DEFAULT now()`·serial·identity는 두지 않는다. 규칙은 직접 SQL 시험으로 확인하고, SQLite FTS 내부 블록 검사는 옮기지 않는다. 0001의 checksum은 10에서 고정한다. 그 전에는 개발 DB를 다시 만든다."
verify = "빈 DB에 0001을 적용하면 core 표 26개·명명 UNIQUE·GIN 다섯이 생기고, 규칙 시험(불변 표의 UPDATE·DELETE·TRUNCATE 거부, 0008 matrix, failed_stage 강제, 반복 예약 null 금지, chunk_locator CHECK)이 통과하며, schema에 `DEFAULT now()`·serial·identity가 없음을 시험이 확인한다."
covers = ["E11-3"]
