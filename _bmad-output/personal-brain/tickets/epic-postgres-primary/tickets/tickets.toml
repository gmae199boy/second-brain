[[entry]]
id = 7
type = "story"
title = "DB가 꺼졌을 때: hook은 막지 않고 spool에 남기고, DB가 돌아오면 들어간다"
description = "PG adapter가 모든 verb에서 연결 거부·접속 끊김·`brain` schema 없음을 `DB_UNAVAILABLE`로(지금은 schema 없음이 `SCHEMA_MISMATCH`가 된다), 소유자별 버전 불일치를 `SCHEMA_MISMATCH`로 내린다. hook 경로의 연결 시도에 경로별 시간 한도 Core 상수를 둔다. 런타임의 기대 버전을 소유자별 모델로 바꾸고(assembly와 빌드 기록 `build.json`), `[store] url_env`가 있을 때 PG를 고르는 조립을 hook·명령·데몬이 함께 쓰는 factory 하나로 만든다(1은 `sessions ingest`에만 붙였다. 9가 데몬에 쓰고, 10이 SQLite 선택을 없앤다). 접속이 끊긴 직후 commit 결과를 모르는 쓰기는 멱등 재시도로 같은 결과가 됨을 확인한다."
verify = "컨테이너를 멈춘 채 hook payload로 `brain sessions ingest`를 돌리면 시간 한도 안에 exit 0으로 끝나고 spool 파일이 생기며, 컨테이너를 켜고 drain하면 세션이 들어가고 spool이 비고, `brain` schema가 없는 DB는 `DB_UNAVAILABLE`, 버전이 다른 DB는 `SCHEMA_MISMATCH`로 답하며, commit 직후 접속을 끊는 시험에서 재시도 뒤 행 수가 한 번 쓴 결과와 같다(시험 이름과 실행 명령은 plan에 적는다)."
covers = ["E11-5", "E11-2"]
after = [6]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-postgres-primary/epic-postgres-primary-research-code.md, §2(오류 분기와 앞으로의 매핑)", "_bmad-output/personal-brain/tickets/epic-postgres-primary/epic-postgres-primary-validate-set.md, S2, S3"]

