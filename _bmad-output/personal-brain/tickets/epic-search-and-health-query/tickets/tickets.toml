# epic 17 텍스트·원문·건강 수치 조회 — 표 순서 = 만드는 순서. id는 영구.
# 한 레인: Store port·PG adapter·brain.ts·출력 코덱·명령 등록부를 모든 스토리가 함께 고친다(코드 조사 8절).

[[entry]]
id = 1
type = "story"
title = "Tracer: 분석 리포트 한 건을 한국어 두 글자로 찾고, 그 출처만으로 원문을 읽는다"
description = "가장 얇은 길로 검색 층을 잇는다. Core 텍스트 질의 함수 하나(`lower(col) LIKE lower(pattern)`, `%`·`_`·`\\` 이스케이프)와 검색 Store port·PG adapter의 최소형을 만들고, 문서 대상을 `analyses`와 파일 관계가 있는 core 파일의 현재 추출 세대로 좁힌다(14.5의 관계를 받는다). `document` 결과 종류(file_id·표시 이름·`chunk_locator`·분석 id·날짜·원문 접근 상태)와 `brain recall docs`, 문서 출처로 원문을 읽는 `brain files show`(현재 세대의 위치와 앞뒤)를 CommandSpec·명령 메타·SDK 1:1로 만든다. 출력 코덱 계약의 `OutputProbe`에 문서 조각·표시 이름·locator를 더하고 실제 renderer를 통과시킨다. 시험 기반도 1이 만들고 2~7이 다시 쓴다: 합성 대화·도구 메모·리포트 fixture, 격리된 PG와 Brain 홈, 정리 도구. 각 plan은 실행 명령, 사전 조건, 관찰값, 정리 명령을 적는다. 받는 것: 11의 PG 전문 색인(`document_chunks.body`의 expression GIN)·추출 세대, 14.5의 `analyses` 파일 관계. 실제 이름은 그 HEAD에서 확인한다. plan 상한은 리포트 한 파일, 질의 하나, 원문 경로 하나다."
verify = "통합 시험(PG. 시험 이름과 실행 명령은 plan에 적는다)에서 합성 `analyses` 리포트 Markdown 하나를 넣고 `brain recall docs`로 그 안의 한국어 두 글자를 찾으면 `document` 결과 하나가 분석 id·날짜·locator와 함께 나오고, 그 출처를 그대로 `brain files show`에 주면 같은 위치의 원문이 나오며, 리포트에 넣은 시험 비밀 문자열이 두 출력 모두에서 가려지고, 분석과 관계없는 core 파일은 결과에 나오지 않으며, 출력 코덱 계약 시험의 probe가 문서 조각을 포함한다."
covers = ["E17-2", "E17-3", "E17-6"]
after = ["14.5", "11.4"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-search-and-health-query/epic-search-and-health-query-research-code.md, §1, §4, §7, 스토리 후보 T1"]

[[entry]]
id = 2
type = "story"
title = "대화 조각: 같은 시각 메시지와 긴 메시지도 부딪히지 않게 조각이 만들어지고, 가린 뒤에는 다시 만들어진다"
description = "E17-1을 만든다. Core 순수 chunker(목표 1,200자, 메시지 경계, 겹침 1메시지, 2,400자 넘는 메시지 분할, 머리말 없음, `index_configs` 값이 진실)와 drain 일감을 만든다. 같은 `occurred_at` 묶음은 경계에서 쪼개지 않고, 긴 메시지의 분할 조각은 `part`(1..n, 나누지 않은 조각은 0)로 구별한다(필요한 다음 core 마이그레이션으로 `chunks` 키에 `part`를 더한다). 수집은 세션·설정의 열린 조각 일감을 멱등하게 만들고, 재청구는 같은 원문에서 같은 경계를 만든다. 읽은 snapshot 뒤 새 메시지나 redact가 끼면 낡은 조각을 확정하지 않는다(세션 입력 fingerprint 비교). `messages.redact`(11.5의 PG 경로)는 같은 트랜잭션에서 걸린 조각을 지우고 그 세션의 재생성 일감을 넣는다. U+0000이 든 본문은 AD-11의 쓰기 코덱으로 조각에 들어간다. 전체 `index rebuild` 명령은 epic 4다."
verify = "시험(PG. 시험 이름과 실행 명령은 plan에 적는다)에서 합성 세션의 조각 경계가 손으로 정한 기대값(1,200자·겹침 1메시지)과 같고, 같은 시각 메시지 셋과 5,000자 메시지 하나를 넣어도 UNIQUE 위반 없이 조각이 생기며 긴 메시지가 `part` 1..3으로 나뉘고, 같은 세션을 다시 처리해도 조각이 늘지 않으며, 메시지가 더 오면 뒤쪽만 이어 만들어지고, 조각 일감이 snapshot을 읽은 뒤 redact를 끼우면 낡은 조각이 확정되지 않으며, redact 뒤 지운 문자열이 어떤 조각에도 없고 재생성된 조각이 가린 본문을 담는다."
covers = ["E17-1"]
after = [1, "11.5"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-search-and-health-query/epic-search-and-health-query-research-code.md, §2, 스토리 후보 T2"]

[[entry]]
id = 3
type = "story"
title = "대화·도구 메모 검색과 넓히기: 결과가 근접 단계·관련도로 정렬되고 8,000자 안에서 잘리며, 출처만으로 앞뒤 원문을 읽는다"
description = "E17-2·E17-3의 대화 쪽과 공통 결과 계약을 끝낸다. `brain recall chunks`·`brain recall tools`가 1의 질의 함수로 조각·도구 메모를 찾고, 결과는 `conversation` 출처(session 토큰·harness·날짜·꼬리표·`from_at`·`to_at`·`chunk_id`)를 붙인다. 근접 단계(같은 워크트리 → 프로젝트 → 전체) 다음 관련도로 정렬한다. 공통 결과 budget: 기본 5건, 출력 코덱으로 가린 뒤 총 8,000자, 낮은 순위부터 통째로 빼고 1위는 남김, 1위 안을 자르는 것은 최후, `RESULT_TRUNCATED`·`meta.omitted`·`meta.next`, limit+1 `has_more`, 0건은 `data: []`와 `meta.hint`, 질의 오류·DB 잠금 초과는 `SEARCH_FAILED`. `brain recall expand`는 출처의 session·시각 구간으로 앞뒤 N개 메시지를 `(occurred_at, 안정 id)` 순으로 읽고 겹침을 지운다. `brain sessions read`는 세션 원문·도구 메모를 쪽 단위로 읽는다. 도구 메모 target은 전용 가리기를 먼저 거친다. 1의 `recall docs`도 같은 budget을 쓴다."
verify = "시험(PG. 시험 이름과 실행 명령은 plan에 적는다)에서 합성 세션들에 한국어 두 글자로 `brain recall chunks`를 돌리면 같은 워크트리의 결과가 먼저 나오고, 결과 6건 이상이면 5건과 `has_more`가 나오며, 긴 결과로 8,000자를 넘기면 낮은 순위부터 빠지고 `RESULT_TRUNCATED`·`meta.next`가 붙고 가린 뒤 길이가 8,000자 이하이며, 0건은 `data: []`와 `meta.hint`이고, 잠금 초과를 일으키면 `SEARCH_FAILED`이며, 결과의 출처를 `brain recall expand`에 주면 앞뒤 메시지가 겹침 없이 나오고 조각을 다시 만든 뒤에도 같은 메시지가 나오며, `brain recall tools`가 셸 `NAME=value`의 값을 가린다."
covers = ["E17-2", "E17-3", "E17-6"]
after = [2]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-search-and-health-query/epic-search-and-health-query-research-code.md, §2(넓히기), §9(Done when 3), 스토리 후보 T3"]

[[entry]]
id = 4
type = "story"
title = "건강 수치 조회: brain health query의 합계·평균이 독립 계산과 같고, NULL·ambiguity·현지 날짜 규칙을 지킨다"
description = "E17-4를 만든다. Core 건강 조회 port와 집계 함수: 입력은 기간(현지 날짜 범위+IANA 시간대, 또는 반열린 UTC 순간 범위), 지표 목록, 운동 조건, 집계(`sum` | `mean`, catalog 허용분만), 묶음(`day` | `month` | 없음). Store는 14.2의 \"현재\" view와 catalog에서 선택된 행과 근거를 읽고, 합계·평균은 Core 코드가 계산한다. NULL은 0이 아니고 평균의 분모는 유효 숫자 수이며, 값이 없으면 `value = null`과 개수 0이다. ambiguity는 집계에서 빠지고 건수·이유로 돌아온다. 단위가 다른 행은 섞지 않는다. 응답은 지표·정규 단위·집계·값·관측 수·NULL 수·ambiguity 수·적용 기간과 시간대를 낸다. 날짜형은 날짜+시간대로 비교하고, 순간형만 설정 시간대의 날짜 경계를 반열린 UTC로 바꾼다(23·25시간 날 포함). `brain health query`를 CommandSpec·명령 메타·SDK 1:1로 만든다. 독립 계산 fixture는 손으로 정한 기대값과 원시 행 목록이고, 제품의 집계·현재 선택 함수를 재사용하지 않는다."
verify = "시험(PG. 시험 이름과 실행 명령은 plan에 적는다)에서 `[10, NULL, 30]`의 합계 40·평균 20, 같은 논리 키의 다른 dataset·버전 중복(현재 값만 집계), ambiguity 두 행(빠지고 건수 2), 전부 NULL(`value = null`, 개수 0), 0건, 분류형 지표의 평균(정해진 오류), 다른 단위, 자정 경계, America/New_York DST 전환일, 운동 필터가 모두 손으로 정한 기대값과 같고, `brain health query`가 같은 결과를 출력 코덱을 거쳐 내며, garmin schema를 읽는 SQL이 없다(정적 검사)."
covers = ["E17-4", "E17-6"]
after = [3, "14.2"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-search-and-health-query/epic-search-and-health-query-research-code.md, §5, 스토리 후보 T4"]

[[entry]]
id = 5
type = "story"
title = "확장 상태·스킬·회귀: 미설치·비활성·0건·실패가 응답에서 구별되고, recall 스킬과 회귀 fixture가 통과하며, 실행계획이 기록된다"
description = "E17-5·E17-6·E17-7을 끝낸다. 검색·수치 응답의 `meta.extensions`(`{source, installed, enabled, searchable, work_state}`)를 epic 13 registry의 공개 view에서 채우고, 공통 봉투·코덱·명령 메타 예제를 넓힌다. 비활성 확장의 보존된 자료는 결과에 남긴다. 플러그인 스킬 `plugin/skills/recall/SKILL.md`(질의 바꾸기 → 검색 → 출처로 원문 → 수치 조회 → 데이터 없음·미설치 안내)를 13.7의 정적 검사와 가짜 CLI 행동 시험으로 검증한다(case: 두 글자 질의, 표현 바꾸기, 데이터 없음, 확장 비활성). 회귀 fixture: 한국어 두 글자·세 글자, 공백·`a-b`·`AND`·따옴표·`%`·`_`·역슬래시·NFC/NFD, 표현 바꾸기(고정 재질의 묶음과 기대 적중 id), 데이터 없음, 출처 → 원문 복원. 개발 전용 PG에서 공식 이미지 digest·locale·provider·encoding·`pg_trgm` 버전·다섯 expression index 정의를 기록하고, 합성 자료로 선택도별 `EXPLAIN (ANALYZE, BUFFERS)`를 plan에 남긴다(실행계획을 강제하지 않음)."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 Garmin 미설치·비활성·0건·`SEARCH_FAILED`·DB 연결 실패가 서로 다른 응답이고 비활성일 때 이전된 리포트가 여전히 검색되며 `meta.extensions`가 상태를 보이고, recall 스킬 정적 검사와 네 case 행동 시험이 통과하며, 회귀 fixture의 모든 문항이 기대 적중 id를 맞히고 전수 LIKE 결과와 같으며, plan에 이미지·locale·index 정의와 EXPLAIN 출력(합성 자료)이 남는다."
covers = ["E17-5", "E17-6", "E17-7"]
after = [4, "13.6", "13.7"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-search-and-health-query/epic-search-and-health-query-research-code.md, §3(실측 계획), §6, §7, 스토리 후보 T5"]

