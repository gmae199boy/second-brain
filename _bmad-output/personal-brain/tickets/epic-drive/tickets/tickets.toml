id = 7
type = "story"
title = "Refactor sweep"
description = "1~6이 미룬 정리만 한다. 범위는 착수 때 각 plan의 미룬 항목과 리뷰 지적에서 정한다. 다른 스토리에서 밀려난 기능은 새 스토리로 뺀다."
verify = "착수 때 정한 정리 목록의 항목이 모두 처리되고 빌드·typecheck·전체 테스트가 PG에서 통과한다. 데몬 없이도 이 에픽의 시험이 통과한다(epic 9 Done when 1의 이어받기)."
covers = []
after = [1, 2, 3, 4, 5, 6]
