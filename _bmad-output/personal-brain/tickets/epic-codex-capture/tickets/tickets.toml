# epic-codex-capture breakdown. Table order is build order.

[[entry]]
id = 1
type = "spike"
title = "Codex 세션 기록 실측"
description = "이 Mac의 Codex 세션 기록(~/.codex/sessions, archived_sessions)의 위치·형식·증분 읽기 가능 여부, 수집 트리거(hook·notify 지원 여부), cwd·브랜치·서브에이전트·도구 출력 표시 방식, 세션 식별자를 실측해 에픽의 research 파일에 남기고, 뒤 항목의 나눔을 확정한다."
verify = "epic-codex-capture-research.md가 위 질문마다 실측 근거(중립화한 구조 예시)와 결론을 담고, 뒤 항목의 범위 조정이 에픽 Notes의 Decision으로 남는다."
covers = []
after = []
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Tracer: Codex 세션 파일 하나가 수집되어 sessions read로 읽힌다"
description = "Codex parser(harness 등록, 본문·호출과 출력의 도구 메모·추적 정보·커서), 세션 Store 수집 경로 연결까지 가장 얇은 길을 잇는다. 파일별 session_meta.payload.id를 세션 키 후보로 검증하고 부모·자식 파일을 서로 다른 세션으로 보존한다. session_id는 자식의 고유 키로 가정하지 않으며 누락·불일치 정책과 기존 Store의 부모 관계 표현 가능성을 확인한다. 공통 계약 변경이 필요하면 별도 결정으로 다룬다."
verify = "합성 fixture를 두 번 수집해도 건수가 같고 sessions read가 메시지 순서대로 원문을 돌려준다. 부모와 자식의 session_id가 같아도 각 파일의 서로 다른 id가 별도 세션으로 수집되며 도구 호출·출력이 중복 없이 대응한다."
covers = []
after = [1, "epic-capture", "epic-postgres-primary"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "증분 수집과 폴더 스캔: 진행 중인 세션이 이어서 쌓이고 디스크의 과거 세션도 들어간다"
description = "활성 및 보관 루트의 transcript_files 내역 기반 스캔과 증분 읽기·앞부분 변경 또는 축소의 다시 읽기·완결된 깨진 줄 처리를 구현한다. 미완성 마지막 줄은 다음 읽기까지 보류하고 보관 이동과 중복 ID를 처리한다. hook·notify의 실제 적용과 기존 사용자 설정과의 공존을 검증하고 안전하게 연결할 수 있을 때만 트리거를 잇는다. 스캔은 트리거 누락·과거 기록 복구 경로로 유지한다."
verify = "합성 fixture의 추가·부분 줄 완성·앞부분 변경·축소를 처리하고 중복 없이 재수집한다. 활성·보관 루트의 과거 기록과 보관 이동을 스캔해 같은 세션이 중복되지 않으며 트리거 실패 뒤에도 스캔으로 복구된다."
covers = []
after = [2, "epic-daemon"]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Codex 세션의 프로젝트·워크트리 꼬리표"
description = "session_meta의 최초 cwd를 시작 폴더 증거로 삼고 턴별 cwd 및 선택적인 git branch 정보와 구분하여 Claude Code와 같은 정체성 규칙(git remote 정규화, 워크트리, 대소문자 비교 키, 지워진 폴더 추정)을 적용한다."
verify = "같은 레포의 Claude Code 세션과 Codex 세션이 한 프로젝트로 묶이고 레포 밖 세션은 프로젝트 없이 수집된다. git 정보가 없거나 턴 cwd가 바뀐 fixture도 최초 cwd 기준으로 처리된다."
covers = []
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "setup connect codex와 doctor의 Codex 수집 항목"
description = "setup connect가 Codex 수집 연결을 확인·안내하고 기존 사용자 notify를 덮어쓰지 않으며, doctor가 Codex 미수집·실패·마지막 수집 시각을 보인다. 공개 CLI가 바뀌면 배포 스킬과 커버리지 시험을 갱신한다."
verify = "Codex 기록 폴더가 없을 때와 있을 때 connect·doctor가 각각 맞는 상태와 안내를 보이고, 스킬 커버리지 시험이 통과한다."
covers = []
after = [3]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "이 Mac에서 확인: 실제 Codex 세션이 수집되어 recall로 찾아진다"
description = "운영 설치본에 반영한 뒤 활성·보관 파일의 중복과 부모·자식 파일을 고려해 비교 가능한 실제 Codex 세션 수와 Brain의 Codex 세션 수를 대조하고, recall·sessions read로 실제 대화를 찾아 읽으며, 비밀이 나갈 때 가려지는지 확인한다."
verify = "Codex 세션 수가 같고, 고른 실제 Codex 대화 몇 건이 recall로 찾아져 원문이 읽힌다."
