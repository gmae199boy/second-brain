# epic 13 확장 설치와 install 스킬 — 표 순서 = 만드는 순서. id는 영구.
# 한 레인: registry·설치·설정 코덱·감독자 조립·CLI 등록부·core 마이그레이션 번호를 거의 모든 스토리가 함께 고치므로 순서대로 만든다(코드 조사 8절).

[[entry]]
id = 1
type = "story"
title = "Tracer: brain ext install testext 뒤 ext status가 connected를 보인다"
description = "가장 얇은 길로 층을 잇는다. 최소 manifest 코덱(이름·버전·호환 core 버전·ABI 버전·연결 확인 명령·마이그레이션 위치만), `extensions/<name>/`의 패키지를 `<home>/extensions/<name>/`에 두는 설치, core 실행기에 소유자 `<name>`의 확장 마이그레이션을 넘기는 연결(번호는 core와 따로), core의 다음 번호 마이그레이션으로 만드는 registry 표(설치·활성·연결 확인을 다른 사실로)와 Store port·fake·계약, `brain ext install|list|status`(CommandSpec·명령 메타·SDK 1:1). 연결 확인은 12.1의 감독자가 testext의 명령을 자식 프로세스로 돌리고 ABI v1 결과를 registry에 남긴다. 시험 fixture `testext`(Node, 12.1의 `process_probe` 바탕)는 사용자용 옵션이 아니라 시험용 패키지 resolver로만 설치한다. resolver는 기본 홈이 아닌 Brain 홈(epic 11의 자원 이름 파생으로 운영과 격리된 홈)에서만 환경 변수로 켜지고, 새 CLI·데몬·에이전트 세션 프로세스도 같은 홈과 환경 변수로 그것을 쓴다(10이 받는다). 1은 뒤 스토리가 다시 쓰는 시험 기반도 만든다: 격리된 PG와 Brain 홈, testext 설치 fixture, 정리 도구. epic 12에서 받는 것: 12.1의 감독자·`process_probe`·실행 분류 등록부, 12.4의 ABI v1 schema. epic 11에서 받는 것: 11.10이 고정한 소유자별 마이그레이션 실행기와 PG 조립. 실제 경로와 시그니처는 epic 12가 끝난 HEAD에서 확인한다. manifest 전체·snapshot은 2, Python은 3, role 권한은 4, 단계 보고·재개는 5, 켜기/끄기와 공개 상태 view는 6, 스킬은 7이다. plan은 testext 하나, 연결 확인 명령 하나, 확장 DDL 0001 하나, 정상 ABI 결과 한 건에 필요한 것만 적는다. epic 11·12 완료 HEAD를 읽고도 한 세션을 넘으면 비필수 완성(목록·메타 다듬기 등)을 이름 붙인 다음 스토리로 나누고, 설치 → DDL → registry → 실제 자식 → status 경로는 1에 남긴다."
verify = "통합 시험(PG, 실제 Node 자식. 시험 이름과 실행 명령은 plan에 적는다)에서 빈 홈에 `brain ext install testext`를 하면 `<home>/extensions/testext/`가 생기고, 소유자 `testext`의 0001이 `brain.schema_migrations`에 기록되며, `brain ext status testext --json`이 설치·활성·연결 확인 `connected`를 보이고, `brain ext list`에 testext가 있으며, `brain guide schema ext`에 새 verb가 있다."
covers = ["E13-1", "E13-4", "E13-6"]
after = ["12.11", "11.10"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-extensions/epic-extensions-research-code.md, §1, §4, §6, §7, 스토리 후보 T1 A"]

[[entry]]
id = 2
type = "story"
title = "manifest v1과 설정 snapshot: 선언한 키만 받고, 비밀은 자식 프로세스 밖으로 나가지 않는다"
description = "manifest JSON Schema를 채운다: 일감 종류와 실행 명령(실행 분류 `supervised`), 기본 예약, 설정 키(`<ext>.*`, 타입·기본값·비밀 참조), raw view, 인증·로그인 단계. valid/invalid fixture와 기대 판정을 12.4와 같은 방식으로 core 패키지와 함께 배포하고 TS 코덱이 그 판정을 통과한다. 호환 core 버전·ABI 버전이 맞지 않으면 설치를 거부한다. manifest의 설정 키를 11.6이 만든 설정 코덱의 `<ext>.*` 자리에 등록하고(선언하지 않은 `<ext>.*`는 거부), 실행 시작 때 DB 설정·기계 값·`.env` 비밀 참조로 불변 snapshot을 만들어 감독자가 자식에게 ABI v1 입력으로 넘긴다(전달 칸은 12.4의 schema를 따른다). 비밀은 argv·로그·stdout·공개 상태에 나오지 않는다. manifest의 일감 종류는 12.1의 등록부에 `supervised`로 들어간다."
verify = "fixture 판정 시험이 manifest valid/invalid 파일 전부에서 기대 판정과 같고, 빌드 산출물에 schema와 fixture가 있으며, 호환 버전이 다른 manifest는 `ext install`이 정해진 오류 코드로 거부하고, `brain config set testext.unknown 1`은 거부되며, testext 일감의 자식이 받은 snapshot에 설정 값과 비밀 값이 있고 같은 실행의 argv·데몬 로그·stdout 기록에는 비밀 문자열이 없다(시험 이름과 실행 명령은 plan에 적는다)."
covers = ["E13-2", "E13-3"]
after = [1, "12.4", "11.6"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-extensions/epic-extensions-research-code.md, §3, §6, 스토리 후보 T2"]

[[entry]]
id = 3
type = "story"
title = "Python 확장 경로: pyfixture가 uv sync --frozen으로 설치되고 TS와 같은 fixture 판정을 낸다"
description = "Python 확장 설치를 만든다: 패키지의 `pyproject.toml`·`uv.lock`·`.python-version`으로 `<home>/extensions/<name>/`에 `uv sync --frozen --no-dev`, 설치된 Python의 patch 버전이 `.python-version`과 같은지 확인, uv·Python을 찾지 못하면 정해진 오류로 그 단계만 실패. 최소 Python fixture `pyfixture`(DB에 쓰지 않는 연결 확인 명령 하나)를 만들고, 그 Python 코드가 core 패키지에 배포된 ABI v1(12.4)과 manifest v1(2) fixture를 `jsonschema`로 읽어 TS와 같은 판정을 내는 시험을 둔다. Python 시험은 기본 suite에 넣지 않고 따로 부르는 진입점이다. 옛 Garmin 잠금 파일의 재현성은 epic 14다."
verify = "Python fixture 진입점(이름과 실행 명령은 plan에 적는다)에서 `brain ext install pyfixture`가 `<home>/extensions/pyfixture/`에 frozen 환경을 만들고 patch 버전 확인을 통과하며, 연결 확인이 `connected`이고, Python의 fixture 판정이 TS 판정과 파일마다 같으며, PATH에서 uv를 빼면 설치가 그 단계에서 정해진 오류 코드로 멈추고 registry에 그 단계 실패가 남는다. 기본 `pnpm test`는 Python 없이 통과한다."
covers = ["E13-2", "E13-4"]
after = [2]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-extensions/epic-extensions-research-code.md, §5(옛 잠금 파일 해시, 이 Mac의 uv·python3), §9, 스토리 후보 T2·T3"]

[[entry]]
id = 4
type = "story"
title = "확장 DB 권한: brain_ext_testext는 자기 schema와 허락된 곳에만 쓸 수 있다"
description = "설치가 setup의 마이그레이션 소유자로 확장 schema와 `brain_ext_<name>` role을 만든다(non-superuser·NOBYPASSRLS, 계약 표 owner와 분리, 출처는 role에 결합). role 비밀번호는 `.env`(0600)에 두고, 감독자는 확장 DB URL을 자식의 환경 변수로만 넘긴다. 권한은 자기 schema 전부, core 공개 view SELECT, 12.3의 attempt 확인 함수 EXECUTE(함수가 만들어진 뒤 생긴 role에도 이어지게)다. `work_items` 청구·갱신과 그 밖의 core 표 권한은 없다. 시험 안에서 만든 계약 표 예(12.3의 trigger 붙은 시험 표)에 확장 role로 INSERT해 출처 결합과 오래된 token 거부를 확인한다. 실제 계약 표의 RLS는 epic 14·15다."
verify = "PG 시험(시험 이름과 실행 명령은 plan에 적는다)에서 `brain_ext_testext`로 접속하면 자기 schema에 쓰고 core 공개 view를 읽을 수 있으며, `work_items` UPDATE와 다른 core 표 INSERT는 권한 오류이고, 시험 계약 표에 다른 출처 행을 넣으면 거부되며, 현재 attempt token의 INSERT는 되고 회수된 token의 INSERT는 trigger가 거부하고, role 속성이 non-superuser·NOBYPASSRLS이다."
covers = ["E13-5"]
after = [3, "12.3"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-extensions/epic-extensions-research-code.md, §4, 스토리 후보 T3"]

[[entry]]
id = 5
type = "story"
title = "단계 보고와 재개: 실패·취소·로그인 미완료·스케줄러 미준비가 다른 결과로 남고, 다시 돌리면 이어 간다"
description = "`ext install`의 단계(패키지 → 환경 → 마이그레이션 → role → 설정 → 로그인 → 연결 확인 → 예약 등록)마다 실제 결과를 registry에 남기고, 응답은 registry를 다시 읽은 값으로 만든다. 다시 돌리면 끝난 단계를 건너뛴다(중복 설치·마이그레이션·role·예약 없음). 결과는 `installed`·`failed`(단계와 코드)·`cancelled`·`login_required`·`connection_failed`·`scheduler_unavailable`로 나뉘고, 끝나지 않은 단계를 완료로 쓰지 않는다. 로그인 단계는 manifest의 인증 단계 명령을 감독자로 부르고, 사용자가 끝내야 하면 `login_required`로 멈춘다. testext의 시험용 가짜 로그인 제어(로그인 완료를 흉내 내는 상태)는 1의 시험용 resolver와 같은 조건(기본 홈이 아닌 홈, 환경 변수)에서만 켜지는 harness다. 10이 이것을 설치본 확인에 쓴다. 예약 등록은 12.9의 SDK를 쓰고, 예약 기능이 없거나 데몬 감독자가 돌지 않으면 `scheduler_unavailable`이다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 마이그레이션 단계에 실패를 넣으면 앞 단계 성공이 registry에 남고 결과가 `failed`(단계·코드)이며, 고친 뒤 다시 돌리면 패키지·환경 단계를 건너뛰고 끝까지 가고, 중간 취소는 `cancelled`, 로그인 전에는 `login_required`(연결 확인·예약 단계는 미완료), 예약 SDK를 끈 상태는 `scheduler_unavailable`이며, 정상 경로를 두 번 돌려도 예약·마이그레이션이 한 번씩이다."
covers = ["E13-6", "E13-7"]
after = [4, "12.9"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-extensions/epic-extensions-research-code.md, §2(지금 설치 결과의 한계), §7(경로 표), 스토리 후보 T3"]

[[entry]]
id = 6
type = "story"
title = "켜기·끄기: ext disable 뒤 진행 일감은 끊기고 데이터는 남으며, ext enable로 이어서 돈다"
description = "`brain ext enable|disable <name>`(CommandSpec·SDK 1:1). disable은 같은 트랜잭션에서 registry의 활성 상태를 바꾸고 12.10의 보류 그룹 `extension:<name>`을 보류한다. 12.10 port가 트랜잭션을 받지 못하면 registry 재조정 use case(시작 때와 `ext status` 때)를 둔다. 확장의 schema·데이터·파일은 남는다. `ext status`와 doctor가 꺼진 상태, 멈춘 일감 수, 보류된 예약을 보인다. 다시 켜면 대기 일감이 이어서 돈다. 공개 상태 view를 이 스토리가 완성한다. 1의 설치·활성·연결 사실과 5의 로그인·예약·실패 사실을 비밀 없이 한 조회 계약(SQL view나 SDK projection 중 plan이 정함)으로 내고, doctor·`ext status`·install 스킬·epic 17 검색이 같은 계약을 읽는다. 외부 소비자가 CLI 출력을 거꾸로 해석하지 않게 한다(검색 응답 표시는 epic 17)."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 testext 일감이 도는 중에 `brain ext disable testext`를 하면 그 일감이 취소되고, 대기 일감이 `extension_disabled`로 남으며, 예약이 발화하지 않고, testext schema의 행 수와 파일 해시가 그대로이며, doctor와 `ext status`가 꺼진 상태와 멈춘 일감 수를 보이고, `ext enable` 뒤 대기 일감이 끝난다. disable과 보류 사이에서 프로세스를 죽여도 다시 띄운 뒤 꺼진 확장의 일감이 청구되지 않는다. 같은 공개 상태 계약으로 미설치·설치(로그인 미완료)·활성·비활성과 멈춘 일감 수를 읽을 수 있고, 그 결과에 설정 비밀 값이 없다."
covers = ["E13-1", "E13-6", "E13-8"]
after = [5, "12.10"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-extensions/epic-extensions-research-code.md, §6(12.10 연결과 crash 일관성), 스토리 후보 T4"]

[[entry]]
id = 7
type = "story"
title = "install 스킬: 에이전트가 스킬을 읽고 실제 상태대로 설치부터 예약까지 안내한다"
description = "`plugin/skills/install/SKILL.md`를 플러그인에 기본으로 넣는다. 절차: `brain guide schema ext`로 지원 확인(없으면 미구현이라고 알리고 임의 설치 금지) → `ext status` → `ext install` → `login_required`면 사용자가 직접 끝내도록 안내(비밀번호·MFA를 대화나 스킬에 남기지 않음) → 다시 `ext install`로 이어 감 → 연결 확인 → 예약 등록 → `ext status`를 다시 읽어 단계별 실제 결과 보고. 별도 LaunchAgent를 만들지 않는다. 시험은 두 층이다: 정적 검사(스킬의 명령·옵션이 CommandSpec에 있음, 금지 지시가 없음, 플러그인 배포 목록에 포함)와 가짜 CLI를 둔 행동 시험(case: 정상, 이미 설치됨, 설치 실패, 로그인 미완료, 스케줄러 미준비, 명령 없음 — 에이전트가 부른 명령 순서와 최종 보고를 대조하고, 거짓 완료나 우회 설치를 실패로 센다). 행동 시험은 기본 suite 밖의 진입점이다."
verify = "정적 검사 시험이 스킬의 모든 명령·옵션을 CommandSpec과 대조해 통과하고 금지 문구 검사를 통과하며, 행동 시험 진입점(실행 명령은 plan에 적는다)에서 여섯 case 모두 기대한 명령 순서와 최종 보고가 나오고, 거짓 완료와 임의 설치 시도가 0건이다."
covers = ["E13-9"]
after = [6]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-extensions/epic-extensions-research-code.md, §1(guide schema), §7(스킬 시험 두 층), 스토리 후보 T5"]

[[entry]]
id = 8
type = "story"
title = "Python 없는 기본 Brain과 갱신 보존: 확장이 없으면 Python을 찾지 않고, 플러그인을 올려도 확장이 남는다"
description = "확장을 설치하지 않은 Brain의 setup·플러그인 bootstrap·hook 수집·doctor가 Python·uv를 찾거나 실행하지 않고 `<home>/extensions/`를 만들지 않음을 시험한다. Python·uv 탐색과 실행을 막은 PATH와 실행 감시(runner spy)로 확인한다. 플러그인 bootstrap 갱신(app-ref가 바뀐 설치)이 `<home>/extensions/`의 환경·설정·확장 DDL·데이터를 건드리지 않고, 갱신 뒤 `ext status`가 같은 상태를 보이는지 시험한다. 설치된 확장의 마이그레이션은 갱신 때 core 실행기가 다시 확인한다(새 번호만 적용)."
verify = "기본 suite 시험(시험 이름과 실행 명령은 plan에 적는다)에서 Python·uv 실행을 막은 환경으로 setup → hook 수집 → doctor가 통과하고 runner 기록에 Python·uv 호출이 0건이며 `<home>/extensions/`가 없고, testext를 설치한 홈에서 bootstrap 갱신을 돌린 뒤 `<home>/extensions/`의 파일 해시와 확장 schema 행 수가 같고 `ext status`가 갱신 전과 같다. pyfixture의 갱신 보존은 3이 만든 선택 Python 진입점에 더한 시험으로 확인하고, 기본 suite는 Python을 설치하거나 찾지 않는다. 두 명령과 사전 조건을 plan에 적는다."
covers = ["E13-10"]
