[[entry]]
id = 5
type = "story"
title = "파일과 기존 분석: 리포트·facts·그래프가 파일 등록 요청으로 core 파일이 되고, 어느 단계에서 죽어도 같은 요청으로 수렴한다"
description = "capture 파일 분류(E14-11)와 각 대상을 만든다. 리포트·facts는 `analyses` 행(안정 artifact key, 확인 가능한 날짜·출처, 모델·생성 시각이 없으면 NULL과 누락 flag)과 파일 요청이 되고, PNG·입력 JSON은 파일 요청과 분석과의 파일 관계가 된다. 로그는 비밀 검사를 통과한 것만 넣고, 설정과 비밀 검사에 걸린 파일은 제외 사유를 남긴다. schema 16 `evaluation` 행이 있으면 그대로 옮긴다(합성 fixture로 검증). `file_requests` 인계를 끝낸다: 요청 직후·인계 중·파일 저장 뒤 결과 확정 전 crash의 수렴, 해시 불일치 실패, 공개 결과 view의 상태(pending·processing·completed·failed, 재개 가능), 생산자의 바이트 보존(Brain 홈의 확장 staging, 상대 locator)과 확인 뒤 core 정리, 처리된 파일의 문서 추출 일감. body·profile·inbox는 없음/비어 있음을 구분해 보고하고, 있으면 측정일·필드별 mtime·원본 관계를 남긴다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 합성 capture(리포트 Markdown·facts JSON·PNG·입력 JSON·로그·TOML)를 반입하면 리포트·facts마다 `analyses` 한 행과 원문 해시가 같은 core 파일이 있고, 모델·생성 시각이 없는 문서는 NULL과 누락 flag이며 파일 mtime이 생성 시각에 쓰이지 않고, PNG·입력 JSON은 분석과 파일 관계로 이어지며, TOML과 시험 비밀 문자열이 든 로그는 제외 사유와 함께 빠지고, 요청 INSERT 직후·인계 트랜잭션 중간·FileStore 저장 뒤 결과 확정 전에 각각 프로세스를 죽였다 다시 띄우면 요청마다 파일 하나로 수렴하며, 예상 해시가 다른 요청은 `failed`이고 파일이 생기지 않고, 완료된 요청의 staging 바이트가 정리되며, Markdown 파일의 추출 세대와 조각이 생긴다. 합성 evaluation 행은 본문·JSON·model·created_at이 그대로다."
