[[entry]]
id = 6
type = "story"
title = "검증 보고서: brain ext run garmin import-verify가 출처별 건수·자연키·해시·관계·미해결 충돌을 비교해 보이고, 공개 집계에는 개인 값이 없다"
description = "E14-12를 만든다. 원본 snapshot을 다시 읽어 source→target을 전수 비교한다: 표별 건수와 자연키 집합 차이, raw TEXT 해시 동등성, NULL 개수·단위·수치 동등성, FK·dataset-local id mapping, 분석 본문·JSON·누락 flag, 전체 파일 해시·크기·관계·요청 결과, 미선택 충돌과 제외 사유, 같은 batch 재실행·중단 재개·비발신 결과. private 상세 보고서(Brain 홈의 확장 데이터 아래)와 공개 집계 출력(해시 값·원문·계정·개인 날짜·건강값 없음)을 나눈다. 공개 집계는 허용된 칸(건수, 충돌·제외 사유 수, 단계별 성공/실패 상태)만 투영하는 함수 하나로 만들고, 8이 plan에 붙이는 증거도 이 투영만 쓴다. 차이가 있으면 결과는 실패다. 원본 snapshot의 파일 해시가 반입 전과 같은지도 본다. 없던 revision·evaluation을 만든 것으로 보고하지 않는다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 합성 capture 반입 뒤 `brain ext run garmin import-verify`가 모든 항목 일치로 끝나고, 대상 행 하나를 시험용으로 바꾸거나 core 파일 하나의 위치를 지운 경우 각각 해당 항목이 불일치로 보고되고 결과가 실패이며, 합성 fixture에 넣은 개인 날짜·계정 id·건강값 표식과 해시 패턴·합성 원문 문자열이 공개 출력과 plan용 투영 어디에도 없으며, 미선택 충돌 수와 제외 사유가 fixture 기대값과 같다."
