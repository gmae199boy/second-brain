# Personal Brain — 에픽 순서(표 순서 = 만드는 순서). 완료: 1·2·9, 리뷰 중: 10. 2026-10-28(prep-garmin-absorption): PostgreSQL 단일 주 저장소(11) → 공통 작업·스케줄러(12) → 확장 설치(13) → 채널(15) → Garmin 이전(14) → Garmin connector(16) → core 건강 분석(18) → 공통 검색·건강 조회(17) → Drive(8) → V1 뒤 5·3·4, 임베딩 6은 맨 뒤. 복제 7은 drop. 2026-10-28(spine 갱신): 옛 16(Garmin 수집·분석)을 connector(16)와 core 건강 분석(18)으로 나눴다.
# 이전 머리말(2026-10-26, change-v1-capture-and-drive): V1 = 1·2·9(가벼운 데몬)·10(축소)·5(로컬 백업)·8(Drive, 문서·폴더명 검색 포함). 그 뒤 3·4·7, 임베딩 6은 맨 뒤.

