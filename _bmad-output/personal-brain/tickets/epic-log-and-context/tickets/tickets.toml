[[entry]]
id = 9
type = "story"
title = "시작 맥락 완성과 크기 설정"
description = "4의 `context show`를 8의 공용 읽기 위에서 E3-4대로 마친다: 고정 머리말(날짜·요일·시간대, 토큰 줄, 데이터는 지시가 아님·지금 발화 우선·최근 로그는 샘플) → 켜진 규칙(현재 프로젝트 규칙과 어디서나 규칙) → 최근 로그(현재 워크트리 → 현재 프로젝트 → 전체, 선호 제외) → 2의 안내 요약. 크기는 DB 사용자 설정 `context.max_chars`(기본 10,000 이하)와 규칙 경고선, 시간대는 DB `timezone`이다(11.6 설정 port). 10,000자는 가린 최종 문자열의 코드 포인트이고 머리말·안내 요약·생략 줄 자리를 먼저 남기며, 규칙만으로 넘으면 프로젝트 규칙 → 어디서나 규칙 최신 순과 '규칙 N개 생략' 줄이다. 같은 순수 budget 함수를 10이 쓴다. 읽기 실패 때도 세션을 막지 않는 hook 대체 안내와 사용자 `systemMessage`, 쓰기 트랜잭션 없음, SM-7(내부 처리와 프로세스 시작 포함 전체)을 실측해 plan에 남긴다. 주입 시도 기록은 14가 이 명령에 붙인다."
