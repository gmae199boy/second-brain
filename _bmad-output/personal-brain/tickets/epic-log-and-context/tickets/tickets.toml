[[entry]]
id = 16
type = "story"
title = "stats show: 기간의 기록·주입 지표가 독립 SQL 계산과 같다"
description = "E3-10을 만든다(epic 5 Done when 6에서 옮김). Core 지표 함수·집계 Store port(PG·fake·계약)와 `brain stats show --from --to [--exclude-import] [--json]`(CommandSpec·명령 메타·SDK 1:1, 출력 코덱 통과): SM-4a(전체·적격 세션, 적격은 사용자 발화 ≥ 상수), SM-5(doctor와 같은 함수), SM-C1(`kind='start'` 글자 수), SM-C3, SM-7 내부 시간(`elapsed_ms`), PRD §8-8 대리 지표(과거형 단서 뒤 같은 세션 도구 메모에 `brain recall`·`brain sessions read`가 나온 비율, 단서 목록과 판정 함수는 Core 하나, MCP 이름 포함), Stop 점검 뒤 로그 비율(분모 `kind='stop', ok`). 기간은 AD-13의 구간 함수(날짜 + 설정 시간대 → 반열린 UTC, `meta`에 되울림), `import` 세션은 기본 포함, 잴 수 없는 지표는 0이 아니라 null + 경고다. 사람이 채점하는 지표는 넣지 않는다. 독립 기대값은 제품 집계 함수를 쓰지 않은 손 계산과 직접 SQL이다."
verify = "시험(가짜 clock. 시험 이름과 실행 명령은 plan에 적는다)에서 합성 기간의 각 지표가 직접 SQL로 센 값과 같고, 세션·시작 주입은 있지만 로그가 0인 기간은 로그 건수·로그 보유 비율이 0이고 주입 글자 수·내부 시간은 실제 값이며, Stop 피드백이나 과거형 단서가 없어 분모가 0인 비율과 transcript 폴더가 없는 SM-5는 null과 경고이고, `--exclude-import`가 import 세션을 빼며, 기간 경계(자정, DST 전환일)가 반열린 구간으로 처리되고 `meta`에 되울리며, Stop 실패 턴(`StopFailure`)이 분모에 들어가지 않는다."
covers = ["E3-10"]
after = [12, "17.5"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-operations/epic-operations.md, Done when 6", "_bmad-output/personal-brain/tickets/epic-log-and-context/epic-log-and-context-research-code-pg.md, §1, §7"]

