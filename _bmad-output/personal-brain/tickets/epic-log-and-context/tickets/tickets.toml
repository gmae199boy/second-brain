[[entry]]
id = 12
type = "story"
title = "Stop 기록 점검"
description = "3의 실측 결과(출력 방식, 발화 수 상수)로 `brain log remind`(`hook: only`, 읽기 전용)를 만든다. `Stop` 이벤트에만, `[discipline] stop_remind`가 켜져 있고(`config.toml`, 기본 false, 설치기는 묻지 않음; 꺼져 있으면 설정과 표식만 읽고 Store를 조립하지 않음) `stop_hook_active`가 false이며 transcript를 지금 parser로 읽어 센 사용자 발화(이미지·@파일만 붙인 사람 메시지도 한 번으로 셈)가 상수 이상이고 `log_entries`와 spool 어디에도 이 세션의 로그가 없고 `<home>/run/stop-remind/<harness>-<id>` 표식이 없을 때만 2의 reason으로 피드백을 내고 그 뒤에 표식을 만든다. 모르면 묻지 않고 어떤 오류든 출력 없이 exit 0, 토글이 켜진 채 점검한 호출은 출력이 없어도 14의 경로로 `kind='stop'` 시도를 남긴다(`ok`는 피드백을 낸 호출, `code`는 내지 않은 이유, `chars`, `elapsed_ms`). 이 세션의 로그가 spool에 있는지 보는 비파괴 조회(claim 중 파일 포함)를 처음 만들고, 30일 지난 표식은 drain이 지운다. hook payload에서 Stop 이벤트·`stop_hook_active`를 명시적으로 읽는다. `hooks.json`에 Stop 동기 줄(같은 런처, `|| exit 0`, `timeout` 5초)을 더한다. PG 접속은 11.7의 시간 상한 안에서만 한다."
verify = "Stop 계약 suite(시험 이름과 실행 명령은 plan에 적는다)가 통과한다: 토글 on·발화가 상수 이상·로그 없음이면 피드백과 표식이 생기고, 로그(spool 포함) 있음·`stop_hook_active` true·표식 있음·재진입은 출력 없이 `kind='stop'` 시도에 사유와 0글자가 남고, 세션 행이 없을 때는 stop 시도가 spool에 남았다가 세션 수집 뒤 drain에서 하나가 되며, PG를 멈춰 두어도 exit 0이고 전체가 5초 안에 끝나며, 토글 off이면 Store 조립·DB 접속이 0이고, 이미지만 붙인 메시지가 발화로 세어진다."
covers = ["E3-6"]
