[[entry]]
id = 4
type = "story"
title = "Tracer: PG 위에서 적은 로그 한 줄이 다음 세션 시작 맥락에 나온다"
description = "가장 얇은 길로 모든 층을 잇는다. LogStore(append·최근 읽기)를 PG adapter·fake·계약 테스트와 함께 두고(epic 11의 Store 조립 방식), `brain log append`(진행 한 종류, 세션 토큰, 본문 인자)와 `brain context show`(고정 머리말의 오늘 날짜·요일·시간대·이 세션의 토큰 줄 + 최근 로그, hook 출력 코덱으로 가림)를 만든다. context show는 PG 로컬 읽기만 하고(epic 11.7의 접속·쿼리 시간 상한, 여러 SELECT는 READ ONLY 트랜잭션) 쓰기 트랜잭션·마이그레이션·세션 생성·drain을 부르지 않는다. 명령 메타의 `hook`을 `only`까지 표현하게 하고(AD-28; `guide schema`·검증·drain 제외 포함), `plugin/hooks/hooks.json`에 기존 비동기 bootstrap·수집 줄과 별도인 SessionStart 동기 `context show` 줄(같은 런처, `|| exit 0`)을 더하며, CLI가 harness 등록부를 Core 조립에 주입한다(I155). 시험 기반도 4가 만들고 뒤 스토리가 다시 쓴다: 격리 PG·Brain 홈, 개발용 hook harness, 정리 도구. 각 plan은 실행 명령, 사전 조건, 관찰값, 정리 명령을 적는다. 받는 것: 11.7의 hook 경로·DB 불가 처리, 11.10의 PG 계약 runner와 격리 홈, 11.11 뒤의 PG 전용 조립. 실제 시그니처는 epic 5가 끝난 HEAD에서 확인한다. plan 상한은 진행 로그 하나, 세션 둘이다."
verify = "통합 시험(격리 PG, 개발용 hook harness. 시험 이름과 실행 명령은 plan에 적는다)에서 한 세션에 `brain log append`로 진행 한 줄을 적고 새 세션을 열면 SessionStart 동기 줄의 출력에 오늘 날짜·시간대·세션 토큰 줄과 그 로그가 보이고, `context show`가 도는 동안 INSERT·UPDATE·일감 생성·마이그레이션 호출이 0이며(PG 읽기 전용 role fixture에서도 성공), DB를 멈춰 두면 exit 0과 대체 안내가 나오고, `brain guide schema context show`의 `hook`이 `only`다."
covers = ["E3-1", "E3-4", "E3-9"]
after = [1, 2, "5.8", "11.7", "11.10", "11.11"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-log-and-context/epic-log-and-context-research-code-pg.md, §1, §3"]

[[entry]]
