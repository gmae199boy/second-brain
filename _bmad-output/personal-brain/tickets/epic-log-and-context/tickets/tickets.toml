[[entry]]
id = 6
type = "story"
title = "log append 완성: 네 종류, 정제, 선수집, SPOOLED, 대체"
description = "4의 `log append`를 E3-1대로 마친다: 진행·결정·규칙·선호 네 종류, 본문 인자와 stdin(바이트 상한), 규칙이 아닌 로그의 저장 전 정제(개행 → 공백, 제어문자·U+0000 제거, 길이 상한)와 규칙 문장은 고치지 않고 여러 줄·제어문자·상한 초과면 USAGE 거절, epic 11의 `sessions.ingest`로 그 세션을 먼저 수집하고 transcript를 못 찾으면 세션 행 없이 spool, DB에 못 쓰면 새 spool record(로그 ID·사건 시각·작성 모델·인용 증거 보존)로 `SPOOLED` 성공과 drain 재생, 결정·선호의 대체(`--supersedes <로그 id>`, 다른 종류·없는 id·이미 대체된 행은 거절, 동시 대체는 하나만), `SESSION_NOT_FOUND`·`TRANSCRIPT_UNREADABLE`의 중앙 코드 표 등록과 hint(I50), 대체 여부로 현재 유효성을 계산하는 공용 판정(8·9가 씀)과 그 해석(내용·이유는 한 문장, 상태는 `supersedes_id`로 계산)을 PRD FR-20에 반영한다. 규칙은 여기서 `pending`으로 저장하고 켜기 판정은 7이 넣는다."
verify = "append 계약 suite(PG·fake. 시험 이름과 실행 명령은 plan에 적는다)에서 네 종류를 각각 적고 Store 행·spool·재생 결과를 읽으면 진행 로그의 개행이 공백이 되고 규칙의 여러 줄은 exit 2로 거절되며, DB를 멈춰 둔 채 적은 로그가 `SPOOLED`로 성공했다가 drain 뒤 같은 ID·사건 시각으로 들어가고, 결정을 `--supersedes`로 대체하면 옛 행이 남은 채 새 행이 그것을 가리키며 같은 행을 두 번 동시에 대체하면 하나만 성공하고, 없는 세션 토큰은 `SESSION_NOT_FOUND`와 hint를 내며, PRD FR-20이 승인된 해석과 일치함을 문서 대조로 확인한다."
