[[entry]]
id = 7
type = "story"
title = "규칙 인용 대조와 수집 뒤 재대조 일감"
description = "규칙을 적을 때 받은 인용(사용자 발화 문장, 선택으로 메시지와 코드 포인트 위치)을 `rule_quote_evidence`에 남기고, 그 세션의 저장된 사용자 발화를 짝 칸으로 복원한 논리 원문 위에서 원래 좌표로 자른 뒤 양쪽 NFC 정규화로 대조한다. 위치가 있으면 그 구간, 없으면 유일하게 한 곳에서 맞을 때 `on`, 아니면 `pending`과 `RULE_UNVERIFIED`다. 수집 성공 트랜잭션이 세션 단위 core 일감 `rule_recheck`를 멱등하게 만들고(실행 분류 `core`, epic 12의 일감 계약), 실행 때 `pending`만 읽어 `WHERE rule_state = 'pending'` CAS로 올린다(`off`는 절대 자동으로 켜지지 않음). 대조 실패는 정상 `pending`이고 일감 실패로 세지 않는다. 가린 출력에서 온 `[REDACTED:…]` 인용은 특별 처리 없이 실패한다. 적용 범위(어디서나 기본, 요청하면 세션 꼬리표의 프로젝트)를 append 때 받는다."
verify = "규칙 대조 계약 suite(시험 이름과 실행 명령은 plan에 적는다)에서 사용자가 한 문장을 그대로 인용한 규칙은 `on`, 한 글자 다른 인용·두 곳에 맞는 인용·`[REDACTED:` 인용·NFD로 쓴 같은 문장의 위치 어긋남은 기대대로 판정되고, U+0000이 든 발화의 인용이 원래 바이트로 맞으며, 수집 전에 적어 `pending`이던 규칙은 수집 뒤 `rule_recheck`에서 `on`이 되고, 픽스처로 `off`에 둔 규칙은 재대조를 여러 번 돌려도 `off`이며, 대조 실패가 `failures`에 남지 않는다."
covers = ["E3-2"]
after = [6, "11.14", "12.5"]
hitl = false
risk = "high"
