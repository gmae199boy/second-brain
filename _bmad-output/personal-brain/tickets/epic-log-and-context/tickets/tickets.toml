title = "다음 core 마이그레이션: 주입 종류·처리 시간, 규칙 인용 증거, 빠진 불변 trigger"
description = "PostgreSQL의 다음 core 마이그레이션(AD-31, owner `core`의 다음 번호, 체크섬 고정)으로 `context_injections`에 `kind`(`start | stop` CHECK, 기존 행은 `start`)와 `elapsed_ms`(nullable, 비음수, 미측정은 NULL이며 0으로 채우지 않음)를 더하고, 규칙 인용 증거 표 `rule_quote_evidence`(로그 id, 인용 text, 원래 UTF-8 바이트 nullable, 메시지 id, 코드 포인트 `[start, end)`, 불변)를 둔다. 11.2 baseline이 이미 강제하는 불변 trigger를 먼저 읽고, `log_entry_edits`·`context_injections` 행 불변과 `log_entries`의 `kind`·`session_id`·`occurred_at`·`author_model` 불변 중 빠진 것만 더한다(I60). baseline 0001은 고치지 않는다. Core `ContextInjection` 자료형을 맞춘다. 7·14·12가 이것을 쓴다."
verify = "마이그레이션 시험(시험 이름과 실행 명령은 plan에 적는다)에서 기존 주입 행이 `kind='start'`·`elapsed_ms` NULL이 되고, 모르는 `kind`·음수 `elapsed_ms`가 거부되며, `log_entry_edits`·`context_injections`·`rule_quote_evidence` 행을 고치거나 지우면, `log_entries`의 불변 칸을 바꾸면 거부되고, 두 번째 실행이 아무것도 바꾸지 않으며, owner `core` 버전이 하나 오르고 doctor 버전 점검이 ok다."
