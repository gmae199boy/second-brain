[[entry]]
id = 4
type = "story"
title = "--count: chunks·logs·docs의 집계가 같은 필터의 전수 결과와 같고, 기간 안의 달이 모두 나온다"
description = "E4-4를 만든다. `recall chunks|logs|docs --count`가 목록 쿼리와 같은 predicate로 limit 이전 모집단을 센다. `chunks`·`logs`는 `{sessions, rows, by_month}`, `docs`는 `{files, rows, by_month}`(`files`는 file_id와 이름 전용 결과의 `source_file_id`를 따로 세어 더함, `rows`는 합쳐진 결과 행 수). 월은 2의 구간 함수로 정하고, 기간을 주면 그 안의 모든 달(0 포함), 없으면 자료가 있는 달만이다. `meta.count`는 1, `has_more`는 false, `RESULT_TRUNCATED` 없음, 8,000자 상한 밖이며 쓴 구간과 시간대를 `meta`에 되울린다. 공통 envelope의 가리기·오류 계약은 그대로다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 같은 필터의 전수 결과를 직접 세어 비교하면 세 verb의 `sessions`·`files`·`rows`가 같고, 한 세션에 로그가 여럿이면 `sessions`는 1이며, 긴 메시지의 두 `part` 조각은 `rows` 2이고, 이름과 본문이 함께 맞는 문서는 한 번만 세며, 이름 전용 Drive 사진이 `files`에 들어가고 가린 파일은 빠지며, 석 달 기간에 자료가 한 달뿐이면 `by_month`에 세 달이 0을 포함해 나오고, 0건도 0을 내며, `RESULT_TRUNCATED`가 붙지 않는다."
covers = ["E4-4"]
after = [3, "8.6"]
hitl = false
risk = "medium"
