references = ["_bmad-output/personal-brain/tickets/epic-recall-and-mirror/epic-recall-and-mirror-research-code.md, §4"]

[[entry]]
id = 8
type = "story"
title = "index rebuild: 새 설정으로 모든 세션의 조각을 다시 만들고, 다 만든 뒤에만 검색이 바뀐다"
description = "E4-8을 만든다. `brain index rebuild [--config ...]`가 epic 17의 chunker·writer(`part` 키 그대로)를 새 `index_config_id`로 모든 세션에 다시 적용한다(같은 규칙이면 설정 find-or-create와 조각 일감 멱등). 새 설정 세대를 다 만든 뒤 활성 포인터를 한 트랜잭션에서 바꾸므로 그동안 검색은 옛 설정만 쓰고, 멈추면 이어 간다. 메시지·로그·출처는 바뀌지 않고 문서 추출 세대·`document_chunks`는 건드리지 않는다. 조각이 아직 없는 세션은 결과에 `UNINDEXED`로 드러난다(일반 0건과 다름). doctor가 활성·요청 설정, 불일치, 미색인 세션 수, 실패 색인 단계와 재시도 행동을 보인다. SM-7을 내부와 프로세스 시작 포함으로 나눠 중앙값으로 재고 조건(자료 수·설정 id·이미지·locale)과 함께 plan에 남긴다. 5의 러너로 rebuild 전후를 비교한다: 같은 뜻의 설정으로 다시 만들면 중립 fixture 점수가 떨어지지 않아야 하고, 규칙을 바꿔 떨어지면 실패 분류와 후속 버그를 남기고 미달로 표시한다. rebuild 중 들어온 증분 조각 생성과 가리기 재생성이 새 설정에도 반영된 뒤에만 전환한다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 조각 규칙을 바꿔 `brain index rebuild`를 돌리면 끝난 뒤 검색이 새 설정 조각만 쓰고, 중간에 프로세스를 죽인 뒤 검색 결과가 옛 설정 하나로만 나오며 다시 돌리면 이어서 끝나고, 메시지·로그·`document_chunks`의 건수와 해시가 그대로이며, 조각이 없는 세션은 `UNINDEXED`이고, doctor가 설정 불일치와 실패 색인을 보이며, 같은 뜻의 설정으로 다시 만든 rebuild 뒤 중립 fixture 점수가 떨어지지 않으며, rebuild 중 메시지를 가리면 전환 뒤 새 설정 조각에도 가린 값이 없고, SM-7 두 측정이 plan에 남는다."
covers = ["E4-8"]
after = [7, "17.2"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-recall-and-mirror/epic-recall-and-mirror-research-code.md, §5"]

[[entry]]
id = 1
type = "story"
title = "이미지 EXIF와 촬영 일시: 사진의 촬영 일시가 지어낸 값 없이 저장되고, 예전에 unsupported로 닫힌 사진도 다시 읽히며, docs 검색이 촬영 날짜로 거른다"
description = "(epic 10의 10.9에서 옮겨 옴, 2026-10-26. 2026-10-28 정제) 10.8의 추출기 등록 자리에 이미지 메타데이터 추출을 더한다(text fallback보다 앞, 바이트로 형식 판정). 라이브러리는 exifr(runtime adapter에서 import해 Core에 주입, `reviveValues: false`로 날짜·offset 원문을 유지하는지 원문 fixture로 확인. exif-reader는 원래 태그 문자열을 얻는 별도 경로·태그 매핑·컨테이너 지원을 입증한 경우에만 대안; Date를 다시 포맷한 값을 원문이라 하지 않음)이고 버전을 `extractor_version`에 반영한다. EXIF는 믿지 않는 입력이다(크기 상한, 파싱 오류는 영구 오류). 이미지는 메타데이터만 있는 추출 성공(빈 조각)으로 저장하고, `file_metadata`의 EXIF 키와 촬영 일시 세 칸(`captured_at_local` 원문, 시간대를 알 때만 `captured_at` UTC 정규형, `captured_at_source` = 쓴 태그 이름; DateTimeOriginal → CreateDate, offset은 OffsetTimeOriginal → OffsetTime)을 메타데이터 저장·세대 완료·가림 재검사와 같은 확정 트랜잭션에 쓴다(바이트를 읽은 뒤 가리기가 끼면 메타데이터가 생기지 않음). GPS·기계·DB 시간대로 시간대를 추정하지 않는다. epic 8의 Carry 능력으로 이미 `unsupported`로 닫힌 이미지를 바이트 형식 판정으로 다시 골라 추출기 버전마다 한 번 넣는다(매 drain 전체 재시도 금지). epic 8의 `recall docs`에 촬영 일시 필터를 더한다: 현지 날짜 필터는 `captured_at_local`, 절대 구간 필터는 `captured_at`이 있는 것만, 수집일·추출일 필터와 구분, 이름 전용 Drive 사진은 촬영 일시를 지어내지 않고 이름 검색을 유지한다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 시간대가 있는 EXIF·없는 EXIF·EXIF 없는 이미지·깨진 EXIF 픽스처를 추출하면 각각 세 칸이 맞게 채워지거나 비고, 깨진 것은 첫 실패에서 영구 오류로 닫히며, 시간대가 없을 때 `captured_at`이 비어 있고 `captured_at_local`은 원문 그대로이며, 추출 중 바이트를 읽은 뒤 그 파일을 가리면 메타데이터가 남지 않고, 추출기 버전을 올리기 전 `unsupported`로 닫힌 이미지가 한 번 다시 들어가 세 칸이 생기며 같은 버전에서 다시 돌려도 두 번 들어가지 않고, `brain recall docs`의 현지 촬영 날짜 필터가 그 사진을 찾고 시간대 없는 사진은 절대 구간 필터에서 빠진다."
covers = ["E4-1"]
after = [8, "8.4", "10.8"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-recall-and-mirror/epic-recall-and-mirror-research-code.md, §8"]

