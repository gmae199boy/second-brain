# epic 4 조회와 미러 — 표 순서 = 만드는 순서. id는 영구.
# 2026-10-28 PostgreSQL·epic 17 검색 경로 위로 정제. entry 1(EXIF)은 id와 뜻을 유지하고 위치만 옮겼다. 새 id 2~10.
# 한 레인: Store port·PG adapter·brain.ts·명령 등록부·출력 코덱·queue를 모든 스토리가 함께 고친다(조사 9절).

[[entry]]
id = 2
type = "story"
title = "Tracer: 서로 다른 프로젝트의 로그와 로그 없는 세션이 같은 날짜로 시간순에 나오고, 출처로 원문을 읽는다"
description = "가장 얇은 길로 조회 층을 잇는다(E4-2). Core 날짜 구간 함수(날짜 + DB `timezone` → 반열린 UTC, epic 17·3이 이미 만든 공용 함수가 있으면 그것을 쓰고 없는 능력만 더함)와 기간 읽기 Store 능력(PG·fake·계약)을 두고, `brain recall time --from --to`가 작업 로그와 세션을 프로젝트 무관 시간순으로 낸다. 로그 없는 세션은 가장 이른 user 메시지의 첫 요청 문장을 읽을 때 꺼내고 저장하지 않는다(D7, 같은 시각이면 안정 id 순이되 선후를 주장하지 않음). 출처는 epic 17의 `recall expand`·`sessions read` 입력 모양이다. `brain sessions list`(기간·꼬리표·쪽 나눔)도 만든다. 명령은 CommandSpec·명령 메타·SDK 1:1, 출력 코덱 통과. 시간 조회는 시간순을 유지한 채 epic 17의 공통 결과 budget(가린 뒤 8,000자, 뒤쪽 시간부터 빠짐, `meta.next`, limit+1, 0건·`SEARCH_FAILED`)을 쓰고, `recall.*` 선수집(spine AD-6)을 앞 에픽의 연결로 time·logs에 적용한다. 시험 기반(격리 PG·Brain 홈, 합성 fixture, 정리 도구)을 2가 만들고 3~10이 다시 쓴다. 각 plan은 실행 명령, 사전 조건, 관찰값, 정리 명령을 적는다. 받는 것: epic 17의 결과 계약·원문 읽기, epic 3의 작업 로그 Store. 실제 시그니처는 epic 3이 끝난 HEAD에서 확인한다. plan 상한은 프로젝트 둘, 세션 셋, 날짜 하나다."
verify = "통합 시험(격리 PG. 시험 이름과 실행 명령은 plan에 적는다)에서 서로 다른 프로젝트의 로그 한 줄과 로그 없는 세션 하나가 같은 날짜로 `brain recall time`에 시간순으로 나오고, 로그 없는 세션은 첫 요청 문장으로 보이며 그 문장이 DB에 새로 저장되지 않고, 결과의 출처를 `brain recall expand`에 주면 그 시각 앞뒤 원문이 나오며, 기록이 없는 날짜는 `ok`의 빈 배열이고, 자정 직전·정각과 America/New_York DST 전환일이 반열린 구간으로 처리돼 `meta`에 되울리며, `brain sessions list`가 쪽 단위로 기간의 세션을 내며, 긴 기간의 시간 조회가 8,000자를 넘으면 뒤쪽 시간부터 빠지고 `meta.next`로 이어 읽은 결과를 합치면 중복·누락이 없고, 아직 DB에 없는 합성 transcript가 있는 세션을 `recall time`이 먼저 증분 수집해 결과에 포함하며 반복 호출에도 중복이 없다."
covers = ["E4-2"]
after = ["3.17", "17.3"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-recall-and-mirror/epic-recall-and-mirror-research-code.md, §2"]

[[entry]]
id = 3
type = "story"
title = "작업 로그 대분류 검색: recall logs가 로그 문장을 찾고, 그 출처로 앞뒤 대화를 읽는다"
description = "E4-3을 만든다. 검색 Store의 logs branch에 `log_entries.text`를 더하고(11의 expression GIN, 새 검색 엔진 없음), `brain recall logs`가 epic 17의 질의 함수로 종류(결정만·선호만 등)·기간·꼬리표 필터와 함께 찾는다. 결과는 `log` 출처(`log_entry_id`, session, harness, 꼬리표, 날짜, `from_at` = `to_at` = 로그 시각)이고 epic 17의 공통 결과 budget(근접 정렬, 가린 뒤 8,000자, `RESULT_TRUNCATED`, 0건·`SEARCH_FAILED`)을 쓴다. 출처로 `recall expand`·`sessions read`가 그 시각 앞뒤 원문으로 내려간다(로그 id를 받는 adapter가 필요하면 여기서 더함). recall 스킬에 logs·time 안내를 덧붙인다(항상 logs 먼저를 규율로 정하지 않음)."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 합성 결정·규칙 로그를 한국어 두 글자로 `brain recall logs`가 찾고 종류·기간 필터가 맞게 거르며, 결과 출처로 `recall expand`가 그 시각 앞뒤 메시지를 겹침 없이 내고, 가린 뒤 8,000자를 넘기면 낮은 순위부터 빠지고 `meta.next`가 붙으며, 0건은 `data: []`와 `meta.hint`이고 잠금 초과는 `SEARCH_FAILED`이며, recall 스킬 정적 검사가 logs·time을 포함한다."
