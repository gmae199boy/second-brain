[[entry]]
id = 6
type = "story"
title = "미러: 세션 하나가 가린 Markdown 미러가 되고, 지우고 다시 만들어도 이름과 내용이 같다"
description = "E4-6을 만든다. Core 미러 렌더러(DB 상태 + 비밀 패턴 버전의 순수 함수, frontmatter에 패턴 버전, 메시지·도구 메모를 안정 순서로, `sessionForOutput` 뒤 본문 가리기)를 출력 코덱 등록부에 넣고 probe가 실제 렌더러를 지나게 한다. 파일 경로는 `<mirror.path>/YYYY-MM-DD_<harness>_<project>_<토큰 뒤 12자>.md`(project의 제어문자와 `<>:\"/\\|?*`는 `_`, 날짜는 DB `timezone`의 현지 날짜)이고, 대소문자를 접은 같은 경로는 세션의 시작 시각·id 순으로 첫째가 기본 이름, 다음이 ` (2)`·` (3)`이고, 더 이른 충돌 세션이 뒤늦게 들어오면 그 충돌 그룹을 함께 조정하며 옛 경로를 남기지 않는다(그룹 단위 직렬화). 읽기 snapshot으로 렌더링하고 DB 잠금 밖에서 임시 파일 → rename으로 쓴다. 세션 미러 일감(epic 12의 같은 키 직렬화로 세션마다 한 번에 하나)과 `brain mirror rebuild`가 같은 함수를 쓴다. 미러 위치는 기계 값 `[mirror] path`(기본 `~/.second_brain/mirror/`)이다. 미러는 역수집하지 않는다."
verify = "시험(격리 홈. 시험 이름과 실행 명령은 plan에 적는다)에서 합성 세션의 미러가 기대한 이름과 frontmatter 패턴 버전으로 생기고 시험 비밀 문자열과 도구 메모의 셸 `NAME=value` 값이 가려져 있으며, 미러 폴더를 지우고 `brain mirror rebuild`를 돌리면 모든 파일이 바이트까지 같고, 대소문자만 다른 project 둘의 세션이 순서와 상관없이 같은 ` (2)` 배정을 받고, 기본 이름 미러가 있는 상태에서 더 이른 충돌 세션을 추가하면 그룹이 수렴해 세션마다 파일 하나이며 전체 rebuild와 같은 이름·내용이고 옛 경로가 남지 않으며, 미러 파일을 고쳐도 DB가 바뀌지 않고, 렌더링 중 DB 쓰기 잠금을 잡지 않으며, 출력 코덱 계약 시험이 미러 렌더러를 포함한다."
covers = ["E4-6"]
after = [5, "12.7"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-recall-and-mirror/epic-recall-and-mirror-research-code.md, §4"]

[[entry]]
id = 7
type = "story"
title = "미러 수명과 가리기: 가린 값은 즉시 미러에서 사라지고, 수집·가리기·버전 상승이 겹쳐도 최신 상태로 수렴한다"
description = "E4-6의 수명과 E4-7을 끝낸다. 수집 성공과 `messages.redact`의 트랜잭션이 그 세션의 미러 일감을 멱등하게 넣는다(redact는 epic 17이 조각 재생성을 붙인 같은 트랜잭션에 미러 일감을 더하고, 하나라도 못 하면 rollback). redact는 확정 직후 그 세션의 미러 파일(충돌 재배정으로 남은 옛 경로 포함)을 지우고, 지우지 못하면 경고와 doctor `warn`(재생성될 때까지)이다. 미러 일감은 snapshot 세대를 확인해 렌더링 뒤 새 수집·가리기가 끼었으면 다시 돌고, 만료된 옛 일감의 늦은 rename이 새 파일을 덮지 않는다(현재 attempt 확인). 비밀 패턴 버전이 오르면 모든 세션의 재생성 일감을 멱등하게 넣는다. rename 실패·일감 실패는 failures와 doctor에 보인다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 메시지를 가리면 redact가 끝난 직후 그 세션의 미러 파일이 없고 재생성 뒤 새 미러에 가린 값이 없으며, 미러 파일 삭제를 실패시키면 경고와 doctor `warn`이 재생성까지 남고, 렌더링 중에 수집을 끼우면 최종 미러가 새 메시지를 포함하며, 옛 attempt의 늦은 rename이 새 미러를 덮지 못하고, 패턴 버전을 올리면 모든 세션의 미러가 한 번씩 다시 만들어지며 중간에 죽여도 이어서 끝나고, 충돌 재배정 직후 기존 세션을 가리면 옛 경로와 새 경로 어디에도 가린 값이 없으며, redact 트랜잭션에서 미러 일감 넣기를 실패시키면 본문 치환까지 rollback된다."
covers = ["E4-6", "E4-7"]
