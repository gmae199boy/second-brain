[[entry]]
id = 5
type = "story"
title = "회귀 러너: tooling/eval이 고정 문항의 hit@k를 재고, 결과 파일에는 식별자·질의·점수만 남는다"
description = "E4-5를 만든다. 새 workspace 패키지 `tooling/eval`(SDK 읽기 전용)이 `~/.second_brain/eval/questions.toml`의 `[[question]]`(안정 id, verb `chunks|logs|docs`, query, expect 식별자 목록, k, 선택 필터)을 schema로 검증하고(k 양의 정수, 모르는 verb·빈 문항·중복 id 거부) 돌려 any-hit hit@k를 잰다. 날짜별 결과를 `~/.second_brain/eval/results/`에 식별자·질의·점수만 쓰고(본문·발췌·원시 응답·오류 상세 없음), 검색 실패는 적중 0과 다른 실행 실패로 남긴다. 같은 문항으로 두 실행을 비교해 떨어진 문항을 보이는 명령을 둔다. 저장소에는 러너와 중립 fixture만 두고(epic 17의 중립 fixture 재사용 가능), 실제 문항은 저장소로 옮기지 않는다. SM-3 사람 채점은 대신하지 않는다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 중립 fixture 문항으로 러너를 돌리면 손으로 정한 hit@k와 같고, 같은 질의를 logs·chunks 두 verb로 넣은 문항이 각자 점수를 가지며, 결과 파일에 합성 본문 문자열이 없고, 잘못된 문항 파일(k = 0, 모르는 verb, 중복 id)은 정해진 오류이며, 검색 실패가 0점과 다른 실패로 기록되고, 두 실행의 비교가 떨어진 문항 id를 보인다."
