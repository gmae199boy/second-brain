[[entry]]
id = 7
type = "story"
title = "수집 사건 알림: 같은 날 같은 사건은 채널 발신 요청 하나로만 나가고, 확장은 Telegram을 직접 부르지 않는다"
description = "E16-7을 만든다. 여섯 사건(auth_failed·rate_limited·blocked_403·normalize_failed·repeated_partial·error)과 알리지 않는 종료(success·skipped_blocked·no-op·쓰기 lock timeout)를 옛 규칙대로 가른다. repeated_partial은 오늘·어제가 모두 transient 포함 partial일 때, normalize_failed는 이번 실행 시작 이후 실패만 endpoint 건수로 묶는다. 사건 행(garmin schema, `(source, account, timezone, 현지 날짜, 사건)` 유일)과 채널 발신 요청을 짧은 트랜잭션 하나에 넣고, 의미 키는 `(사건 행 id, Garmin 봇·채팅 conversation, collection-notice:<사건>, 템플릿 revision)`이다. 받는 것: 15.1·15.3의 발신 요청 계약과 확장 role RLS. 실제 attempt·재시도는 epic 15의 결정을 따른다."
verify = "시험(PG, 15.1의 가짜 Telegram 서버 재사용. 시험 이름과 실행 명령은 plan에 적는다)에서 같은 날 429가 두 번 나도 채널 발신 요청과 가짜 서버 POST가 하나이고, 다음 날 같은 사건은 새 요청이며, 사건 행 INSERT 직후 worker를 죽여도 요청이 한 번 인계되고, success 실행은 요청을 만들지 않으며, 확장 프로세스가 Telegram 주소로 연결한 기록이 0이고, 요청 본문에 시험 비밀 문자열이 없다."
covers = ["E16-7"]
after = [6, "15.3"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/tickets/epic-garmin-runtime/epic-garmin-runtime-research-code.md, §5, 스토리 후보 S6"]

