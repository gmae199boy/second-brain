# epic 16 Garmin connector: 인증·수집·정제 — 표 순서 = 만드는 순서. id는 영구.
# 한 레인: extensions/garmin/의 manifest·lock·store port·garmin 마이그레이션·worker를 모든 스토리가 함께 고친다(코드 조사 10절).

[[entry]]
id = 1
type = "story"
title = "Tracer: 합성 Garmin 응답 한 건이 수집 일감으로 raw와 건강 행이 되어 현재 view에 보이고, 다시 돌려도 늘지 않는다"
description = "가장 얇은 길로 connector 층을 잇는다. manifest에 `collect` 일감(`supervised`)을 선언하고, worker가 ABI v1 입력(계정·target·시간 범위·attempt token)과 설정 snapshot을 받아 진행·결과 이벤트를 낸다. 외부 라이브러리 경계(`garmin` 패키지의 client)를 port로 감싸고 시험에서는 fake client를 쓴다. 합성 endpoint 응답 한 건(날짜 endpoint 하나)이 coverage 판단 → raw 저장(garmin 보존 표, 새 수집 dataset, 원문 문자열 그대로) → 정규화 v8의 순수 계산 → 14.2의 보관 키로 건강 행 INSERT → \"현재\" view까지 간다. raw와 그 항목의 건강 행은 같은 짧은 트랜잭션이고, 현재 attempt 확인을 같은 트랜잭션에 둔다. PG store port(garmin schema reader·writer)의 최소형과 그 시험 기반(fake client, 합성 응답 생성기, 격리된 PG와 Brain 홈, 정리 도구)을 1이 만들고 2~9가 다시 쓴다. 각 plan은 실행 명령, 사전 조건, 관찰값, 정리 명령을 적는다. 받는 것: 14.1의 확장 뼈대·garmin schema·raw view key 정규형, 14.2의 지표 catalog·보관 키·\"현재\" view, 12.1·12.3의 감독자·ABI v1·attempt 확인, 13.2의 manifest·설정 snapshot. 실제 시그니처는 착수 시점 main HEAD에서 확인한다. plan 상한은 endpoint 하나, 지표 하나, 정상 경로 하나다. 넘치면 비필수 완성을 이름 붙인 다음 스토리로 나누고, worker → store port → 건강 행 → 현재 view와 멱등·오래된 쓰기 거부는 1에 남긴다."
verify = "통합 시험(PG, 실제 Python worker, 데몬 감독자, fake client. 시험 이름과 실행 명령은 plan에 적는다)에서 감독자가 `collect`를 돌리면 garmin 보존 표에 합성 응답의 원문이 바이트까지 같게 새 수집 dataset으로 남고, `garmin.raw_records`의 key가 `<scope>/<원래 key>`이며, 그 날의 건강 행이 정규화 버전 8로 \"현재\" view에 보이고, 같은 일감을 다시 돌려도 모든 표의 행 수가 같으며, 회수된 attempt token으로 돌린 worker의 raw·건강 행 쓰기는 거부되고, fake client 밖으로 나간 네트워크 호출이 0이다."
covers = ["E16-1", "E16-3", "E16-4", "E16-8"]
after = ["14.1", "14.2"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-garmin-runtime/epic-garmin-runtime-research-code.md, §1, §3, §10, 스토리 후보 S1"]

[[entry]]
id = 2
type = "story"
title = "인증과 계정 보호: 차단·MFA 뒤에는 해제 전까지 외부 호출이 0이고, 같은 계정의 일감은 한 번에 하나만 돈다"
description = "E16-2를 만든다. 세션은 라이브러리의 login/dump로 tokenstore(`garmin.tokenstore`, 기본 `~/.garmin-pipeline/tokens`, 0700/0600)에서 연다. 대화형 로그인(비밀번호·MFA, 같은 client에서 MFA 최대 3회)은 epic 13의 인증 단계로만 하고 worker의 JSONL stdout과 섞지 않는다. 호출 간격(1~2초, 날짜 사이 5초), 연속 403 세 번 차단, first-call 보호를 옮긴다. 계정 보호 상태 표(garmin schema)를 두고, 429·403 차단과 인증 실패·MFA 필요를 외부 호출 전에 먼저 저장한다. 해제 규칙: 인증 실패·MFA는 재인증 성공, 429·403은 다음 현지 날짜의 탐색 호출 하나의 성공, 이틀 연속 차단은 `release-block` 수동 일감. 예약·수동·force 모두 보호 상태를 우회하지 않는다. 인증·수집은 epic 12의 `(source, account)` 직렬화 키를 쓰고, 계정 identity(로그인 profile의 Garmin 사용자 profile id)가 처음 정해지기 전에는 tokenstore 기준 보호 키를 쓴다. ABI 오류 분류(다시 할 수 있는지)를 옛 오류에 대응시키고(코드 조사 2절 표), 오류는 허용 목록의 코드·단계·endpoint만 낸다. garminconnect·curl-cffi를 lock에 더하고 macOS arm64 frozen 설치·import를 확인한다."
verify = "fake client 시험(시험 이름과 실행 명령은 plan에 적는다)에서 데이터 403 세 번이면 차단 상태가 저장되고 그 실행의 나머지 호출이 0이며, 429 뒤 같은 날 예약·수동·force 실행이 모두 외부 호출 0으로 끝나고, 다음 현지 날짜(가짜 clock)에 탐색 호출 하나가 성공하면 풀리며, 이틀 연속 차단이면 `brain ext run garmin release-block` 전까지 호출 0이고 doctor가 보이며, MFA 필요 뒤에는 재인증 성공 전까지 호출 0이고, 보호 상태 저장 직후 worker를 죽이고 다시 띄워도 보호가 남으며, 같은 계정의 `collect` 둘을 동시에 넣으면 하나씩 돌고 다른 계정은 함께 돌며, 호출 사이 간격이 1초 이상이고, 시험 비밀번호·토큰 문자열이 stdout·로그·failures 어디에도 없다."
covers = ["E16-1", "E16-2"]
after = [1, "12.7", "13.5"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-garmin-runtime/epic-garmin-runtime-research-code.md, §2, §6(tokenstore), 스토리 후보 S2"]

[[entry]]
id = 3
type = "story"
title = "전수 수집과 재개: 15개 endpoint를 옛 진입표대로 받고, 중간에 죽거나 취소돼도 받은 raw는 남고 빠진 날만 다시 받는다"
description = "날짜 endpoint 11개와 활동 endpoint 4개(세트는 needs_sets 활동만), history_start(이전된 운영 dataset의 값이 있으면 그것, 없으면 첫 실행 today−30), 실행당 최대 10일, 확정 안 된 어제·누락 메우기, 생활 습관 재확인, 11:15 재시도 진입표(not_run·error·rate_limited·blocked는 전체 계획, auth_failed는 재인증 뒤만, partial+transient는 남은 것만, success는 no-op), recent_lists, 거부 일수 상한을 옮긴다. coverage는 PG의 같은 계정 모든 dataset(이전된 raw 포함)을 읽고, 실행 시작에 고정한 snapshot으로 판단한다. raw 원문·NoData·checked_at·fetched_at·library_version 전이는 옛 의미 그대로다. 외부 호출 동안 트랜잭션을 잡지 않는다. endpoint 전후·날짜 대기마다 진행 이벤트와 취소 반응. 결과(성공·부분·차단·인증 필요)를 ABI 결과로 명시한다. run·fetch_error는 새 수집 dataset 안에서 이어 쓴다. collect의 ABI 결과 요약에 수집 결과의 UTC cutoff(수집 snapshot 시각)와 현지 날짜를 싣는다(epic 18이 core의 일감 결과로 읽는다). manifest에 기본 예약 둘(collect 11:00, retry 11:15)을 선언하고, 옛 `_DEFAULTS`의 connector 설정 전체 대응표(옛 키 → 새 `garmin.*` 이름·타입·기본값·제외 사유, 분석 키는 epic 18)를 완성해 manifest 설정 선언과 snapshot 검증으로 옮긴다."
verify = "fake client 시험(시험 이름과 실행 명령은 plan에 적는다)에서 빈 상태에서 `collect`가 history_start부터 최대 10일을 받고, 이전된 raw가 있는 날은 다시 받지 않으며, 옛 raw 시험 입력(key 순서·한국어·surrogate·NoData·순서만 바뀐 문자열)의 저장 문자열과 시각 전이가 옛 기대값과 같고, 11:15 재시도가 진입표의 각 경우대로 계획되며, 세 번째 날짜를 받는 중에 worker를 죽이고 다시 돌리면 앞 두 날의 raw가 남고 빠진 날만 받으며, 취소하면 다음 endpoint 전에 멈추고 회수된 attempt의 쓰기가 거부되고, partial 결과가 성공과 다른 ABI 결과로 남으며, 선언하지 않은 `garmin.*` 키와 잘못된 값(예: 호출 간격 min > max)은 설정 단계에서 거부되고, 실행 중 설정을 바꿔도 그 실행은 시작 snapshot 값을 쓰며, 기본 예약 둘을 두 번 등록해도 하나씩이고, collect 결과 요약에 cutoff와 현지 날짜가 있다."
covers = ["E16-3", "E16-8"]
after = [2]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-garmin-runtime/epic-garmin-runtime-research-code.md, §3, §8(raw 비교), 스토리 후보 S3"]

[[entry]]
id = 4
type = "story"
title = "전수 정규화와 권위 v2: 옛 구현과 같은 fixture에서 같은 수치가 새 행으로만 쌓이고, 새 수집 값이 이전 값보다 앞선다"
description = "정규화 v8의 daily·activity·샘플·세트·day_summary·workout·exercise_log 계산을 옮기고, 결과를 14.2의 보관 키로 INSERT만 한다(옛 전체 삭제·재계산과 파서 실패 때 열 지우기를 쓰지 않는다). 같은 raw 재처리는 멱등, 바뀐 raw는 새 관측 revision, rebuild(`normalize` 일감)는 새 정규화 버전 행이다. 항목별 실패는 격리돼 normalize 상태에 남고, 미발행 raw는 `normalize`가 다시 찾는다. 권위 기록에 규칙 v2(새 수집 → D2 → D1 → D4 → D5 → D3)를 쓰고 v1은 바꾸지 않는다. 계정 identity는 로그인 profile id이고, 이전 dataset의 확인된 id와 같아야 같은 논리 키가 된다. 동등성 기대값: 합성 fixture만 옛 archive 코드에 한 번 넣어 기대 JSON을 만드는 opt-in 스크립트(격리된 임시 환경, 기본 suite 밖)를 두고, 만든 JSON을 저장소에 고정해 새 코드가 비교한다. catalog에 없는 지표는 호환 core 마이그레이션으로 더한다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 옛 normalize 시험 입력의 열별 수치·NULL·단위·샘플 시각·activity와 day 연결·세트·휴식 결과가 고정된 기대 JSON과 같고, 같은 raw를 다시 처리해도 행이 늘지 않으며, raw를 바꾸면 새 revision 행이 생기고 이전 행이 남고, rebuild 뒤 정규화 버전이 다른 행이 생기고 이전 버전 행이 보관되며, 한 항목의 파서 실패가 다른 항목의 행을 지우지 않고, 같은 날짜에 이전된 D2 값과 새 수집 값이 다르면 규칙 v2대로 새 수집 값이 현재이며, 권위 규칙 v1 행이 그대로다."
covers = ["E16-4"]
after = [3]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-garmin-runtime/epic-garmin-runtime-research-code.md, §3(정규화·PG 지점), §8, 스토리 후보 S4"]

