title = "body와 digest: 체성분 원본은 파일로 보존되고, digest 일 값이 옛 구현과 같게 건강 요약 행이 된다"
description = "`artifacts` 일감을 만든다(collect 뒤 의존, epic 12.6). body: inbox·inbody 바로 아래 원본 참조와 검증 JSON(NaN·Infinity·중복 key 거부)으로 필드별 mtime 병합을 지키고, 원본 파일은 옮기기 전에 `file_requests`로 보내 staging에 보존하며, 측정 행에 필드 mtime·원본 관계를 남긴다. 처리된 원본의 이동은 core 확인 뒤에만 한다. digest: manifest(시간대·cutoff·baseline)와 raw·활동·종목 labels·body sidecar로 순수 dict를 계산하고, 일 값(day values)을 core 건강 요약 행으로 publish한다(catalog에 없는 지표는 호환 core 마이그레이션). 전체 digest JSON도 `file_requests`로 등록하고, 요청 metadata에 수집 결과 id·UTC cutoff·시간대·현지 날짜·산출 revision을 담는다(epic 18의 입력 snapshot이 이 파일을 읽는다). 측정 JSON은 사용자가 넣은 것이든 epic 18의 `body_intake`가 쓴 것이든 같은 계약으로 읽는다. 모델을 부르지 않는다. 한국어 종목 이름 리소스를 확장 패키지로 옮기고 공통 loader를 둔다. 동등성 기대값은 4의 opt-in 스크립트로 만든다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 옛 digest·weight-lifestyle 시험 입력의 dict 값(sleep·day·workouts·recovery·body·weight·drinks)이 고정된 기대 JSON과 같고(NULL을 0으로 만들지 않음), 일 값이 건강 요약 행으로 \"현재\" view에 보이며, 같은 입력으로 다시 돌려도 행이 늘지 않고, body 원본이 core 파일이 된 뒤에만 processed로 옮겨지며, core 확인 전에 worker를 죽여도 원본이 제자리에 남고, 잘못된 측정 JSON 하나가 다른 측정을 지우지 않으며, digest JSON 파일이 core 파일이 되고 그 요청 metadata에 수집 결과 id·cutoff·현지 날짜·revision이 있다."
