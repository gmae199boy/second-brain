title = "bootstrap hook 시험 중복 제거: 두 suite가 같은 hook 시험을 두 번 돌리지 않고 검증 집합은 그대로다"
description = "기본 Vitest config와 Python config가 둘 다 tooling/bootstrap/test/hook.test.ts를 고른다(기본 cache 약 48.6초, Python 약 39.3초). Python 쪽에만 있는 보존 case(BRAIN_PYTHON_UPDATE_TEST=1, 약 2.7초)는 살리고 공통 case는 한 suite에서만 돌게 나눈다. hook.test.ts는 beforeAll snapshot과 앞선 설치 case가 만든 home·bin·DB를 뒤의 Python 보존 case가 이어 쓰므로, 파일 전체를 Python flag가 켜진 한 suite로 옮기거나 나눈 각 집합에 필요한 setup을 따로 준다. tooling/test-changed/rules.mjs의 bootstrap 규칙(tooling/bootstrap/ 변경 시 Python 전체, hook 경로 하드코딩)도 바뀐 배치에 맞춰, hook 시험과 fixture·src 변경이 실제로 그 시험을 가진 suite를 빠짐없이 고르게 한다. 실제 container·설치·갱신 검증은 줄이지 않는다."
verify = "변경 전후 두 suite에서 hook 관련 case 목록(이름)을 비교해 합집합이 같고 공통 case가 한 번씩만 실행되며, Python 전용 보존 case가 BRAIN_PYTHON_UPDATE_TEST=1 조건에서 그대로 돈다. 옮기거나 나눈 각 hook 시험이 단독으로도 통과하며, tooling/test-db/test/test-changed.test.ts와 run.mjs의 실제 list·run 선택으로 hook 관련 파일 변경 때 pnpm test:changed가 바뀐 배치의 시험을 고름을 보인다. 전체 suite 시간은 커밋 직전 필수 1회에서 기록한다."
