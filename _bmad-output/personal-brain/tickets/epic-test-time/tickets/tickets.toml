description = "extensions/garmin/src/charts.py의 prepare는 home 아래 private MPLCONFIGDIR을 쓰므로 새 home을 만드는 시험마다 macOS 폰트 열거(약 9.3초)가 반복된다. 시험 세션에서 한 번 만든 폰트 캐시를 각 시험 home의 private 캐시로 복사하거나 미리 채우는 방식과, 생산의 첫 실행 비용을 줄이는 방식을 비교한다. 생산 MPLCONFIGDIR 위치·0700 권한·home 격리, Apple SD Gothic Neo → DejaVu Sans 선택, 캐시가 깨졌거나 matplotlib 버전이 바뀌었을 때 다시 만드는 동작은 유지한다. 19.5 뒤에는 여러 slot·process가 동시에 돌므로, 공유 seed 캐시를 쓰면 누가 만드는지, 완성된 캐시만 원자적으로 공개되는지, 각 home에는 복사본만 들어가는지(또는 slot별 seed)를 정한다. 시험에서 폰트 선택이나 그래프 렌더를 mock으로 바꾸지 않는다. 시험 home 준비(apps/cli/test/ext-fixture.ts의 extHome → pg-home.ts의 pgHome)를 19.1과 함께 쓰므로 19.1 뒤에 한다."
