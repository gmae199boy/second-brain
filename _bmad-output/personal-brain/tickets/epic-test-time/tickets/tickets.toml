description = "apps/cli/python-test/garmin-import-verify.test.ts가 여러 티켓(16.7·16.9·18.1·18.2)에서 재발했고 16.7 기준 커밋 6회 중 2회 실패가 재현됐다. 실패 모양은 실패 응답에 data.report가 없는데 시험이 바로 참조하는 TypeError, EXTENSION_INVALID, 무작위 UUID가 card-number 가림 규칙에 걸리는 경우다. 먼저 결정적으로 재현해 원인을 하나씩 분리하고 고친다. 실패할 때는 가림 규칙 안에서 원래 예외·실패 envelope·work_id를 남겨 다음 실패가 진단 가능하게 한다. 가림 규칙이 실제 card-number를 가리는 계약, 반입 검증의 판정 의미, 시험 assertion은 약하게 하지 않는다. 원인이 제품 코드면 제품을 고치고, 시험 fixture의 무작위성이면 fixture를 고친다. batch-import NUL·normalize attempt 경합·redaction 행 수는 원인이 미확정이라 이 스토리 밖이다."
