title = "시험 DB 초기화: 독립 DB 격리를 유지한 채 매 시험의 전체 migration 반복이 사라진다"
description = "19.5가 바꾼 slot 구성 위에서 packages/postgres/test/fixture.ts와 apps/cli/test/pg-home.ts의 시험 DB 준비를 바꾼다. 최신 migration을 한 번 적용한 template DB를 만들고 시험마다 그 복제로 독립 DB를 얻는 방식과, DB를 초기화해 재사용하는 방식을 비교해 하나를 고른다. 재사용을 고르더라도 동시에 도는 시험끼리 DB를 공유하지 않고, 한 시험이 끝난 상태가 다음 시험에 남지 않아야 한다. template을 고르면 migration 내용(파일 hash)이 바뀔 때 다시 만들고, 병렬 worker 사이에서 생성 경쟁이 없어야 한다. 이 fixture는 18.10의 회귀 시험과 import 계약 시험, apps/cli/test/ext-fixture.ts의 extHome → pg-home.ts의 pgHome을 거치는 Garmin E2E도 쓴다. role·권한·소유자는 시험마다 지금과 같게 준비한다. migration 자체, 파괴적 DDL, role·권한, 빈 DB 상태를 검증하는 시험은 지금처럼 새 DB에 migration을 적용한다. 시험 case·assertion은 줄이지 않는다."
verify = "착수 시 고정한 기준 커밋과 같은 환경에서 redaction·store·work-store·sessions-ingest 네 파일의 warm-up 뒤 3회 중앙값을 전후 비교해, 네 파일의 DB 준비·정리 합계가 기준의 절반 이하이고 case 수와 통과 결과가 같다. 전체 suite 시간은 커밋 직전 필수 pnpm test·pnpm test:python 1회의 시간을 기준 커밋의 같은 1회와 나란히 기록한다(반복 측정하지 않는다). 한 시험이 쓴 행·role·schema 변경이 다른 시험에 보이지 않음을 시험으로 보이고, template을 채택했으면 migration 파일을 바꿀 때 template이 다시 만들어지고, 병렬 실행에서 template 생성이 slot(PG cluster)·migration hash마다 한 번만 일어남을, 재사용을 채택했으면 초기화 뒤 상태가 새 migration DB와 같음을 함께 보인다. 성능 비교의 반복 실행은 전용 독립 DB·home에서 직렬 잠금 아래 하며 AGENTS.md의 마무리 회귀 1회와 별개다. 반복 검증은 pnpm test:changed, 커밋 직전 pnpm test와 pnpm test:python을 순차로 한 번씩 실행한다."
