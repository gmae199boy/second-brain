title = "등록 확인 대기: 그래프와 digest 파일이 끝나는 대로 확인되고 요청마다 1초를 기다리지 않는다"
description = "extensions/garmin/src/runtime_artifacts.py의 그래프 발행 루프와 digest 발행은 파일 등록 요청 뒤 완료를 확인하기 전에 매번 time.sleep(1)을 한다. 그래프 요청을 먼저 모두 보낸 뒤 한꺼번에 확인하는 방식, 대기 간격을 점진적으로 늘리는 방식 등을 비교해 고른다. 그래프별 실패 격리, collect.boundary의 취소·중지 검사, COLLECT_INVALID_ATTEMPT·COLLECT_STOPPED 전파, attempt fencing, 완료 캐시 재사용, revision 의미와 file_requests 계약은 유지한다. digest 발행의 별도 대기 루프(ARTIFACT_FILE_FAILED 포함)도 같은 기준으로 고친다. core 등록기 쪽은 바꾸지 않는다. extensions/garmin/tests/check_charts.py가 캐시·렌더와 발행 취소를 함께 검증하므로 19.2 뒤에 한다."
verify = "착수 시 실제 core 등록 경로에서 잰 기준과 비교해, 신규 그래프 3장 발행과 digest 발행의 대기 합계가 각각 기준의 절반 이하이고(render·request·대기 분리 계측), 그래프 하나 실패·등록 실패·digest ARTIFACT_FILE_FAILED·대기 중 취소·attempt 무효·중단 뒤 재개·완료 캐시 재사용에서 결과(graphs·graph_failed·예외)가 기존과 같음을 보인다. 등록 완료 확인 조회가 대기 없이 바쁘게 반복되지 않음(조회 횟수 상한)을 함께 보인다."
