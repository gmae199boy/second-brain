type = "story"
title = "명령과 resend 스킬: brain channels status로 보고 resend로 못 간 것만 다시 연다"
description = "`brain channels list|status|resend <request-id>`(CommandSpec·명령 메타·SDK 1:1, 출력 코덱 통과)를 만든다. status는 `sent`·`definite_failed`·`unknown`·`failures`·legacy를 구분하고, 비밀 값을 보이지 않는다. resend는 실패·불명·`failures`로 닫힌 요청만 같은 요청의 새 attempt로 다시 열고, `sent`·legacy(3이 남긴 적격성 표식)·진행 중 요청은 정해진 오류로 거부한다. 성공하면 그 `failures` 항목을 해소한다. 플러그인 스킬 `plugin/skills/channels/SKILL.md`가 `brain guide schema channels` → status → resend → status 순서로 실제 결과를 보고한다. 13.7의 정적 검사와 가짜 CLI 행동 시험 방식으로 검증한다(case: 못 간 알림 다시 보내기, 이미 보낸 것, legacy, 명령 없음)."
verify = "CLI 시험(시험 이름과 실행 명령은 plan에 적는다)에서 `unknown` 요청의 `brain channels resend`가 새 attempt를 열어 `sent`가 되고 `failures`가 해소되며, `sent`·legacy·진행 중 요청의 resend는 정해진 오류 코드로 거부되고, status 출력에 비밀 문자열이 없으며, 스킬 정적 검사와 네 case 행동 시험이 통과한다."
