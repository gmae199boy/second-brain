[[entry]]
id = 1
type = "story"
title = "Tracer: brain daemon run이 떠서 밀린 일감을 처리한다"
description = "가장 얇은 길로 데몬의 층을 잇는다: 명령 등록부에 `daemon run`을 더하고(stdout 엔벨로프 없음), 같은 빌드에서 `createBrain`을 조립해 상주하며 drain을 반복하고(간격·예산 상수는 이 스토리가 정함), `<home>/run/daemon.pid` 단일 인스턴스 잠금(원자적 생성, 살아 있는 pid는 나이와 상관없이 빼앗지 않고 죽은 pid만 회수), 30초 heartbeat(`<home>/run/heartbeat` mtime), `<home>/log/daemon.log`(회전은 9가 붙임), SIGTERM 정상 종료(진행 중 일감을 끝내거나 lease 만료로 넘기고 pid를 지움)를 만든다. DB에 못 쓴 transcript 수집은 기존 spool로 남긴다. 이 상주 루프와 로그 쓰기 자리는 9가 회전을 붙인다. 이 상주 루프와 Core 조립 자리는 4·5가 확장한다. pid·heartbeat 기록은 3의 공용 생존 판단과 status·doctor가 읽는다."
verify = "임시 home에서 `brain daemon run`을 띄우면 pid 파일과 heartbeat가 생기고 heartbeat mtime이 30초 간격으로 갱신되며, 미리 넣어 둔 일감이 처리되고, 두 번째 `daemon run`은 잠금 때문에 뜨지 않으며, 죽은 pid가 남은 잠금은 회수되고, SIGTERM을 보내면 정상 종료하고 pid 파일이 사라진다."
covers = ["E9-1", "E9-3"]
after = ["2.11", "2.12"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-daemon/epic-daemon-research-code.md, §1, §2, §3, §6, §7"]

[[entry]]
id = 2
type = "story"
title = "launchd 등록: 설치하면 데몬 Label 하나가 로그인 때 뜬다"
description = "launchctl 호출을 감싼 adapter(테스트용 가짜 포함)와 plist 작성기를 만들고, 공용 설치 함수(`setup run`, 플러그인 bootstrap이 부르는 같은 함수)에 데몬 등록 단계를 더한다: Label `io.github.gmae199boy.second-brain.daemon`, `~/Library/LaunchAgents/<Label>.plist`, `RunAtLoad`·`KeepAlive`, shim을 거쳐 `brain daemon run`, `launchctl bootstrap gui/<uid>`. 같은 Label이 이미 있으면 다시 등록하지 않는다. 등록 해제 함수도 이 adapter에 두어 6이 쓴다. 실제 Mac에서의 확인은 8이 한다."
verify = "가짜 launchctl adapter로 `setup run`을 두 번 돌리면 plist 하나와 bootstrap 호출 한 번이 기록되고 plist 내용(Label, RunAtLoad, KeepAlive, shim 경로의 `daemon run`)이 기대와 같으며, 설치 흐름의 다른 단계와 기존 설치 테스트가 그대로 통과한다."
covers = ["E9-5"]
after = [1, "2.4", "2.5"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-daemon/epic-daemon-research-code.md, §3, §4"]

[[entry]]
id = 3
type = "story"
title = "생존 판단과 폴백: 데몬이 살아 있으면 명령은 drain을 건너뛴다"
description = "heartbeat mtime이 90초(간격의 3배) 안이면 살아 있다고 보는 판단 함수 하나를 만들고(heartbeat 없음·미래 시각·pid 사망은 죽음), 명령 끝의 기회적 drain이 데몬이 살아 있을 때 건너뛰게 하며(죽었거나 멈췄으면 지금처럼 기회적 drain과 SessionStart drain이 받침), doctor에 데몬 생존·마지막 heartbeat 항목(죽었거나 멈췄으면 `warn`)을 더하고, `daemon status`(생존·pid·마지막 heartbeat)를 만든다. 같은 판단 함수를 6의 `daemon stop` 상태 표시가 쓴다."
verify = "heartbeat를 89초 전으로 두면 명령 뒤 기회적 drain이 돌지 않고 doctor가 ok이며, 91초 전이거나 없으면 기회적 drain이 돌고 doctor가 `warn`이며 exit 0이고, `daemon status --json`이 같은 판단을 낸다. 데몬 없이 epic 2·10의 기존 테스트가 통과한다."
covers = ["E9-2", "E9-6"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "파일 감시: Stop hook 없이 저장된 transcript가 10초 안에 수집된다"
description = "데몬 안에서 Claude transcript 폴더(connector가 찾는 폴더, 기본 `~/.claude/projects`)를 감시하고(`[files] path`는 감시하지 않음), 변경을 2초 모은 뒤 기존 scan 경로로 넘긴다(감시 이벤트로 직접 수집하지 않음). 데몬이 기동할 때 scan을 한 번 돌려 꺼져 있던 동안의 변경을 메운다. 감시가 실패하거나 폴더가 없으면 로그에 남기고 주기 scan으로 받친다. 1의 상주 루프에 붙는다."
verify = "임시 home과 임시 transcript 폴더로 데몬을 띄운 뒤 hook 없이 transcript 파일을 쓰면 10초 안에 세션이 DB에 들어오고, 같은 파일을 연달아 여러 번 고쳐도 scan은 2초 묶음마다 한 번이며, 데몬이 꺼진 동안 쓴 transcript는 다음 기동 때 수집된다."
covers = ["E9-3"]
after = [1]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "마이그레이션 0009와 예약 틱: 시각이 된 일감이 한 번만 들어간다"
description = "SQLite 마이그레이션 0009(schema version 9)로 예약 테이블(일감 종류·대상·반복 간격(초, 없으면 한 번)·다음 시각·마지막 실행 시각)을 만들고, 데몬 안의 틱이 시각이 된 예약의 일감을 `work_items`에 넣으며 같은 트랜잭션에서 마지막 실행 시각과 다음 시각(실행 시점 + 간격, 한 번짜리는 끝남)을 갱신한다. 놓친 회차는 하나로 합쳐 데몬이 꺼져 있던 동안 지난 예약도 다음 기동 때 한 번만 들어간다. DB에 못 쓰면 트랜잭션이 되돌려져 예약이 시각 지남으로 남는다(새 spool 종류 없음). 검증용 일감 종류 하나를 더하고, 사용자 등록·조회·삭제 명령은 만들지 않는다(다음 조각). Postgres는 epic 7. 1의 상주 루프에 붙고, 4와 같은 루프 코드를 건드리므로 4 뒤에 만든다."
verify = "fake clock으로 예약 시각을 넘기면 틱이 검증용 일감 하나를 넣고 drain이 처리하며, 시각을 세 주기 건너뛴 뒤 데몬을 띄워도 일감은 하나만 들어가고, 틱 도중 트랜잭션이 실패하면 일감도 마지막 실행 시각도 바뀌지 않고 DB가 돌아온 다음 틱에 한 번 들어가며, 한 번짜리 예약은 다시 들어가지 않고, `SQLITE_SCHEMA_VERSION`이 9이고 doctor `schema-version`이 ok다."
covers = ["E9-4"]
after = [1, 4]
hitl = false
risk = "high"

