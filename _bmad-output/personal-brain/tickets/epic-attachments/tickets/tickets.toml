verify = "마이그레이션 테스트에서 저장된 첨부의 `source_kind`를 바꾸거나 `stored` 행의 `file_id`를 다시 쓰거나 종료된 추출 세대의 `status`를 바꾸면 거부되고, 열린 세대를 `failed`(+`failed_stage`)로 닫는 것과 실패 세대의 조각 삭제는 통과하며, `SQLITE_SCHEMA_VERSION`이 8이고 doctor `schema-version`이 ok다."
