description = "Brain 위치의 블롭 하나를 지우는 drain 일감(멱등, 지운 뒤 `deleted_at`)을 두어 12의 파일 가리기와 epic 8의 Drive 이전이 그대로 쓰게 한다. 고아 블롭 자동 순회(유예 24시간)와 doctor 건수·바이트 점검은 V1 뒤(가볍게, 2026-10-26)."
verify = "Brain 위치의 블롭 삭제 일감을 두 번 돌려도 오류가 없고 `deleted_at`이 한 번 채워지며, `external` 위치와 루트 밖 파일을 가리키는 일감은 거부되고 대상 파일은 그대로다."
covers = ["E10-6"]
after = [3, "2.11"]
hitl = false
risk = "medium"

[[entry]]
id = 12
type = "story"
title = "파일 가리기와 첨부 미가림 경고"
description = "Core `Redaction`에 `fileId`와 범위 null을 더하고(I75), Core `files.redact`와 CLI `brain files redact`(확인 게이트, 내용 단위라 같은 파일을 공유하는 메시지 수를 확인 전에 보임)가 한 가리기 트랜잭션에서 `redacted_at`, 추출 세대·조각·FTS, `file_names`·이름 FTS·`file_metadata` 삭제, `redactions` 기록, 11의 블롭 삭제 일감을 묶고, 4·8·10이 둔 이름·추출 생성 가드가(메타데이터 생성 가드는 epic-recall-and-mirror 4.1(옛 10.9)이 이 규칙을 따라 스스로 둔다, 2026-10-26) 가린 파일을 건너뛰는지 검증하며, `messages redact`가 그 메시지에 가리지 않은 첨부가 있으면 `ATTACHMENT_NOT_REDACTED`를 내고 그 코드 설명을 마스킹 B에 맞춘다."
verify = "추출된 문서를 `brain files redact --yes`로 가리면 조각·이름·메타데이터가 FTS 어디에서도 찾히지 않고 drain 뒤 Brain 위치의 블롭이 지워지며 `external` 원본은 그대로이고, 다시 추출 경로(10)가 그 파일을 건너뛰며, `--yes` 없이는 exit 3이고, 첨부가 있는 메시지를 `messages redact`하면 `ATTACHMENT_NOT_REDACTED` 경고가 나온다."
covers = ["E10-7"]
after = [4, 8, 10, 11, "2.1", "2.13", "2.17"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/deferred-work.md, I75", "_bmad-output/personal-brain/tickets/epic-capture/tickets/story-messages-redact-plan.md, Implementation Notes (P34)"]

