id = 1
type = "story"
title = "닫힌 세션 다시 읽기와 수집 실패 해소"
description = "스캔이 크기 차이만이 아니라 세션에 저장된 `parser_version`과 현재 parser 버전도 비교해, 크기가 같은 닫힌 세션도 `session_ingest` 일감으로 전체 다시 읽게 하고(마이그레이션 없이 있는 칸으로, 디스크에서 transcript가 사라진 세션은 건너뛰고 그 수를 남김), 일반 `brain.sessions.ingest`(hook 경로)의 성공이 spool·대기열 경로처럼 그 세션의 미해결 `session_ingest` 실패를 해소하게 하며(회고 C4), 줄어든 transcript가 스캔마다 다시 대기열에 들어가지 않는 정책을 정해 고친다(P19); 이 다시 읽기 경로는 5가 첨부 채우기에 그대로 쓴다."
verify = "parser 버전 상수를 테스트에서 올리면 크기가 같은 닫힌 세션이 다음 drain에서 한 번 다시 읽혀 `parser_version`이 새 값이 되고 두 번째 drain은 아무것도 넣지 않으며, 실패가 기록된 세션을 hook 경로로 정상 수집하면 `failures list`에서 사라지고, 줄어든 transcript는 스캔을 두 번 돌려도 일감이 하나만 생긴다."
