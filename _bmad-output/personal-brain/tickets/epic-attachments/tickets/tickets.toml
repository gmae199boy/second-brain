verify = "SQLite와 fake가 추출 Store 계약 suite(pdf `page` 사본 불일치·pdf 아닌 조각의 `page` 값·undefined와 null 경계 포함)를 통과하고, 그 suite에서 청구 만료와 늦게 끝난 작은 `attempt`의 성공을 재현해도 포인터가 바뀌지 않으며, 실패한 시도의 조각이 FTS에서 찾히지 않고, 만료된 열린 세대가 다음 청구에서 `failed`로 닫힌다."
