[[entry]]
id = 2
type = "story"
title = "Tracer: 붙여 넣은 이미지 한 장이 원본째 남는다"
description = "가장 얇은 길로 모든 층을 잇는다: Core에 `FileStore` port(`put`·`get`·`exists`·`url`·`delete`)와 첨부 자료형을 두고 `ParseResult`·`IngestBatch`에 첨부 자리를 더하며, Claude Code parser가 사용자 메시지의 image 블록을 첨부(자리·출처·바이트)로 내고 이미지만 있는 메시지도 버리지 않게 해 parser 버전을 5로 올리고, 수집이 트랜잭션 밖에서 블롭을 로컬 FileStore(내용 주소 locator, 임시 파일 → rename, 0700/0600, 첫 구현부터 `brain` 소유·루트 안 검사와 기본 fake·계약 harness를 갖추고 3이 경계 사례·목록 읽기·`external` 표현을 완성함)에 넣은 뒤 `files`·`file_locations`(`brain` 소유)·`message_attachments`(`stored`, 표시 이름·위치 메타데이터 보존)를 한 쓰기로 남기고 같은 내용은 한 번만 저장하며, 이미 있는 메시지에도 같은 자리의 첨부를 멱등으로 잇고 이전 parser가 버린 이미지 전용 메시지는 다시 읽기에서 살려(5가 이 결과를 그대로 씀), DB에 못 쓴 첨부 연결 메타데이터는 새 spool record 종류(검증기·재주입 handler 포함, 바이트 없이 64KiB 이하)로 남기고(4가 같은 record를 씀), 이 Store 능력과 `createBrain`·CLI 조립 자리가 3·4·14가 확장할 경계다."
verify = "사람이 임시 home에서 이미지를 붙여 넣은 Claude Code 세션을 개발용 Stop hook으로 수집하면 `<home>/files` 아래 블롭 하나와 `files`·`file_locations`·`message_attachments` 행이 생기고 메시지에서 그 위치를 받을 수 있으며, 같은 이미지를 두 메시지에 붙이거나 수집을 다시 돌려도 `files` 행과 블롭은 하나이고, DB를 막아 둔 채 수집한 이미지 연결은 spool에서 재주입된 뒤 같은 행이 되며, 도구 결과 안의 이미지는 첨부로 남지 않는다."
covers = ["E10-1", "E10-2"]
after = [1, "2.6", "2.23"]
hitl = true
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-capture/epic-capture-research.md, §4", "_bmad-output/personal-brain/tickets/epic-attachments/epic-attachments-research-code.md, §2, §3, §9"]

