[[entry]]
id = 4
type = "story"
title = "프로세스 ABI v1 완성: 같은 fixture에 TS 코덱이 기대 판정을 내고, 비정상 종료가 정한 결과로 남는다"
description = "schema 파일을 채운다: `heartbeat`, `error`(코드, `retryable`), `result`의 선택 `usage`(입력·캐시·출력 토큰. 비음수 정수, 없음과 0을 구분), 입력 환경 변수 계약(DB URL, 일감 id, attempt token, account·target·시간 범위·실행 세대), exit code와 최종 이벤트의 우선순위, 잘린 줄·너무 긴 줄·비정상 EOF·중복 최종 이벤트·모르는 버전·stderr(가려서 길이 상한 안에서 남김). valid/invalid fixture와 기대 판정 파일을 두고, core 패키지 배포 산출물에 schema와 fixture를 싣는다(epic 13의 Python이 같은 파일을 읽는다). TS 코덱은 새 검증기 의존 없이 손으로 쓴다. 감독자는 각 비정상 경우를 attempt 결과(`failed`와 오류 코드)로 기록하고, `usage`와 걸린 시간을 attempt에 남긴다. 새 오류 코드는 `packages/core/src/codes.ts` 표와 guide에 더한다."
verify = "fixture 판정 시험(시험 이름과 실행 명령은 plan에 적는다)이 모든 valid/invalid 파일에서 기대 판정과 같고, 패키지 빌드 산출물에 schema와 fixture가 들어 있으며, 감독자 시험에서 결과 없는 exit 0·결과 뒤 0이 아닌 exit·모르는 버전·깨진 줄이 각각 정한 attempt 결과와 오류 코드로 남고, `usage`가 있는 result는 attempt에 토큰 셋이 남으며 없는 result는 비어 있다(0이 아니다)."
