verify = "1의 timer 시험(시험 이름과 실행 명령은 plan에 적는다)에서 Asia/Seoul 11:00 예약이 하루 한 번 돌고, America/New_York의 DST 시작·끝 날에 없는 시각은 다음 유효 시각에, 겹친 시각은 한 번만 돌며, 사흘 동안 틱이 없다가 깨어나면 빠진 사흘 범위를 담은 일감 하나가 생기고, 오늘 수동 실행이 성공했으면 예약이 오늘은 돌지 않으며, 시간대를 바꾸면 다음 발화가 새 시간대 기준이고 이전 성공 기록의 날짜는 그대로다. ScheduleStore 계약 suite가 fake와 PG에서 통과한다."
