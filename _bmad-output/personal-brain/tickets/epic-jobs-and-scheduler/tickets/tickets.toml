[[entry]]
id = 10
type = "story"
title = "확장 끄기 계약: 보류 그룹을 보류하면 진행 일감은 끊기고 대기 일감은 켤 때까지 멈춘다"
description = "보류 그룹 단위로 보류·해제하는 Store verb와 Core use case를 만든다. 일감과 예약은 보류 그룹을 가질 수 있다. `<ext>.*` 종류는 자동으로 그룹 `extension:<ext>`에 속하고, 그 확장의 데이터를 읽는 core 일감·예약(epic 18의 분석)은 넣는 쪽이 같은 그룹을 붙인다. registry(epic 13)가 보류·해제를 부르고, epic 18이 분석 일감·예약에 그룹을 붙인다. 보류하면 대기 일감은 `extension_disabled`로 멈추고, 그 그룹의 예약 발화와 새 청구가 막히며, 진행 중 supervised 일감은 2의 취소 경로로 끊긴다. 해제하면 대기 일감이 이어서 돈다. `failures retry`·`schedules run`이 보류를 우회하지 않고, `queue list`가 보류를 보인다. 시험은 가짜 이름공간 `testext.*`, 그 그룹을 붙인 core 종류 일감 하나, probe를 쓴다."
verify = "시험(시험 이름과 실행 명령은 plan에 적는다)에서 `testext` 보류 그룹을 보류하면 진행 중 probe가 취소되고, 대기 일감(그룹을 붙인 core 종류 일감 포함)이 `extension_disabled`로 남으며, 그 그룹의 예약이 발화하지 않고, `failures retry`와 수동 실행이 그 일감을 청구하게 만들지 못하며, 해제하면 대기 일감이 이어서 돌고, 다른 그룹과 그룹이 없는 core 일감은 영향을 받지 않는다."
covers = ["E12-11"]
after = [9]
hitl = false
risk = "medium"
