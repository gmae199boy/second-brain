# epic 12 공통 작업 runtime과 스케줄러 — 표 순서 = 만드는 순서. id는 영구.
# 한 레인: ports/store.ts·WorkStore 계약·PG work 모듈·새 core 마이그레이션·감독자·daemon/run.ts·CLI 조립을 거의 모든 스토리가 함께 고치므로 순서대로 만든다(코드 조사 8절).

[[entry]]
id = 1
type = "story"
title = "Tracer: 감독자가 probe 자식을 600초 넘게 돌리는 동안 대화 수집이 처리된다"
description = "가장 얇은 길로 층을 잇는다. 일감 종류의 실행 분류 등록부(`core` | `supervised`, 이름이 아니라 등록부가 정한다)와 새 core 마이그레이션(epic 11의 0001 다음 번호. 일감 행의 현재 attempt·실행 분류, attempt 이력 표의 최소 칸: token·시작·마지막 진행·갱신·종료·결과). WorkStore에 supervised 청구(attempt token 발급), token CAS로 하는 임대 갱신, token이 맞을 때만 되는 결과 확정을 더하고 fake·PG 계약 case를 둔다. 데몬 밖 drain과 기회적 drain은 `core` 일감만 청구한다. ABI v1의 정상 경로(`progress`·`result` 이벤트, 환경 변수 입력 DB URL·일감 id·attempt token)를 schema 파일 첫 판과 TS 코덱으로 둔다. 장수 프로세스 port(그룹 spawn, stdout 줄 흐름, 신호, 종료 대기·reap)와 Node 구현은 epic 11.1의 외부 명령 runner를 넓히거나 그 옆에 둔다(완료형 Promise만으로는 감독할 수 없다, 코드 조사 2절). 감독자는 데몬 안에서 core drain 회차와 따로 돌고, 회차마다 닫는 Store에 묶이지 않는다. 출하용 probe worker(`process_probe`: core가 제공하지만 실행 분류는 `supervised`인 일감 종류. 정한 시간 동안 진행 이벤트를 내고 끝난다)와 시험용 fake worker를 만든다. 뒤 스토리가 다시 쓰는 시험 기반도 1이 만든다: 시간을 앞으로 돌릴 수 있는 timer·clock, 가짜 프로세스 port, 격리된 PG 시험 setup(2·5·8이 쓴다). epic 11에서 받는 것: 11.1의 외부 명령 runner(그룹 감독과 stdout 흐름으로 넓히는 일은 1의 몫), 11.3의 PG WorkStore·ScheduleStore와 계약 runner, 11.9의 PG 데몬 조립과 재연결 backoff(감독자가 그 옆에 붙는다), 11.10의 고정된 0001과 PG fixture(새 마이그레이션은 그 다음 번호), 11.11 뒤의 SQLite 없는 경계. 실제 경로와 시그니처는 epic 11이 끝난 HEAD에서 확인한다. plan은 정상 경로(progress → result 한 종류, probe 한 건)에 필요한 port·DDL·fixture만 적고, 오류 행렬은 2~5, ABI 완성과 배포는 4, doctor와 작업 목록은 5·9에 둔다. 모델·확장 일감 등록은 열지 않는다. epic 11 코드를 읽고도 한 세션을 넘으면, 비필수 완성을 이름 붙인 다음 스토리로 나누고 PG → 감독자 → 자식 → token 결과 확정과 동시 수집 경로는 1에 남긴다."
verify = "가짜 시계·가짜 프로세스 port 시험에서 probe 일감이 700초 동안 진행 이벤트를 내는 사이 임대가 갱신되어 다른 감독자와 drain이 같은 일감을 청구하지 못하고, 그 사이 넣은 `session_ingest` 일감이 core drain으로 끝나며, 결과는 현재 token으로만 확정된다(옛 token의 확정은 lost). 실제 Node 자식 통합 시험(짧은 probe, PG)에서 데몬이 probe를 띄우고 결과를 확정하며, `brain queue drain`은 `process_probe`를 청구하지 않는다(시험 이름과 실행 명령은 plan에 적는다)."
covers = ["E12-1", "E12-2", "E12-5"]
after = ["11.3", "11.9", "11.10", "11.11"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-jobs-and-scheduler/epic-jobs-and-scheduler-research-code.md, §1, §2, §6, §8, 스토리 후보 T1"]

[[entry]]
id = 2
type = "story"
title = "취소와 종료 확인: 취소한 그룹은 손자까지 정리되고, 확인할 수 없는 일감은 다시 돌지 않는다"
description = "`brain queue cancel <id>`(DB에 취소 요청을 남김. CommandSpec·명령 메타·SDK 1:1)와 감독자의 실행: 요청을 보면 그룹 SIGTERM → 유예(Core 상수) → SIGKILL → reap, 결과 `cancelled`. 데몬 종료도 같은 정리를 한다. attempt에 PID·PGID·OS 시작 신원을 기록한다. 신원은 (부팅 시각 `sysctl kern.boottime`, PID, `LC_ALL=C ps -o lstart= -p <pid>`의 1초 단위 시작 시각)이고, 그룹 구성원은 `ps -o pid=,pgid=,lstart= -g <pgid>`로 본다(2026-10-28 이 Mac에서 확인, 에픽 Notes). `ps`가 종료 코드 1과 빈 출력을 내면 '없음', 실행 실패·권한 같은 다른 실패면 '확인 불가'다. 지금 `daemon.pid`의 `started_at`은 OS 신원이 아니다(코드 조사 2절). 데몬 시작 때 이전 incarnation의 열린 attempt를 대조한다: 같은 프로세스가 살아 있으면 그룹을 정리한 뒤 회수, 사라졌으면 `died`로 회수, 신원이 다르면(PID 재사용) 죽이지 않고 회수, 확인할 수 없으면 `unknown`으로 남겨 다시 청구하지 않는다."
verify = "통합 시험(실제 Node 자식. 시험 이름과 실행 명령은 plan에 적는다)에서 TERM을 무시하는 probe와 그 손자 프로세스가 `brain queue cancel` 뒤 유예가 지나면 SIGKILL로 정리·reap되고 일감 결과가 `cancelled`이며, 감독자를 SIGKILL한 뒤 자식이 살아 있는 채로 데몬을 다시 띄우면 그 그룹을 정리한 뒤 회수하고, 같은 PID를 다른 프로세스가 쓰는 경우(가짜 신원)는 죽이지 않으며, 신원 조회가 실패하면 `unknown`으로 남아 다시 청구되지 않는다."
covers = ["E12-3", "E12-10"]
after = [1]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/tickets/epic-jobs-and-scheduler/epic-jobs-and-scheduler-research-code.md, §2(잠금·PID 시작 신원), §6(옛 Garmin 그룹 정리), 스토리 후보 T2"]

