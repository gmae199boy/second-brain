title = "예약·작업 명령: schedules와 queue list가 상태·걸린 시간·토큰을 보인다"
description = "`brain schedules add|list|remove|run`과 `brain queue list`(상태·attempt·마지막 진행·걸린 시간·토큰 사용량)를 CommandSpec·명령 메타·SDK 1:1로 만든다(`brain guide schema`에 보인다). 출력은 Core 출력 코덱을 거친다. doctor에 모델 분류 일감의 토큰과 걸린 시간 항목을 더한다(호출 횟수와 상한은 없다). install 스킬(epic 13)이 부를 예약 등록 SDK가 이것이다."
