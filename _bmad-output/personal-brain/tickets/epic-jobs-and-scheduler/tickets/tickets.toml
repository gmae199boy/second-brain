[[entry]]
id = 5
type = "story"
title = "상태 구분: 정체·사망·오류·취소가 다른 결과로 남고 doctor에 보인다"
description = "일감 결과 칸(`succeeded` | `failed` | `cancelled` | `dependency_failed`)을 `completed_at`과 따로 채운다. core drain의 성공·영구 실패 경로도 포함한다(지금은 둘 다 `completed_at`만 채운다, 코드 조사 5절). 정체 판정: 진행 이벤트가 종류별 창(Core 상수, 기본 15분, 모델 분류 일감 25분) 동안 없으면 그룹을 정리하고 `stalled`로 기록한 뒤 일시 오류로 다시 시도한다. heartbeat는 진행이 아니다. 자식이 결과 없이 사라지면 `died`로 다시 시도한다. 오류는 `retryable` 분류로 AD-21을 따르고, 10번 실패하면 `failures`에 남긴다. doctor에 정체·사망·불명 일감과 마지막 오류 항목을 더한다(DB를 읽을 수 없으면 skip과 이유)."
verify = "1의 timer·가짜 프로세스 시험(시험 이름과 실행 명령은 plan에 적는다)에서 heartbeat만 내는 probe가 15분 뒤 `stalled`로 정리되고 다시 청구되어 attempt 이력에 두 attempt가 남고, 진행을 내는 probe는 같은 시간에 정리되지 않으며, 모델 분류 일감은 25분이 기준이고, 결과 없이 죽은 자식은 `died`로 다시 돌며, doctor가 `stalled`·`died`·`unknown`을 다른 항목으로 보이고, core drain의 성공과 영구 실패가 서로 다른 일감 결과로 남는다."
