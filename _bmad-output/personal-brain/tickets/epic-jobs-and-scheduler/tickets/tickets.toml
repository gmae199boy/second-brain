title = "이 Mac에서 확인: 플러그인 배포로 긴 작업·취소·현지 예약이 설치본에서 돈다"
description = "기능 묶음을 플러그인 배포(`plugin/app-ref`를 앞선 커밋으로, `plugin/.claude-plugin/plugin.json`의 `version`을 함께 올림)로 이 Mac의 설치본에 넣고, 사람이 실제로 확인한다: 예약 명령으로 넣은 긴 probe 일감(예: 12분)이 도는 동안 새 Claude Code 세션이 hook으로 수집되고, `brain queue list`가 진행·걸린 시간을 보이며, `brain queue cancel`로 끝나고, 몇 분 뒤로 잡은 현지 시각 예약이 한 번 돌며, 데몬을 멈춘 채 예약 시각을 넘긴 뒤 다시 켜면 놓친 날짜 규칙대로 한 번 돌고, doctor가 상태를 보인다. plan에는 다시 돌릴 때 쓸 정리 절차(확인용 예약·probe 일감·성공 기록 지우기)도 적는다."
