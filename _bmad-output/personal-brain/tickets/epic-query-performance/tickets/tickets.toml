# epic 22 제품 조회 성능 — 표 순서 = 만드는 순서. id는 영구. (2026-11-05)

[[entry]]
id = 1
type = "story"
title = "Tracer: 반입 정리 조회가 완료 이력 10만 건에서도 같은 결과를 기준의 절반 이하 시간에 낸다"
description = "E22-1을 만든다. sql report 재현 절차(후보 4)를 따라 전용 PG·합성 fixture(완료 이력 1천/1만/10만, 미정리 0/100, 공유 locator)와 측정 러너(warm-up+3회 중앙값, EXPLAIN (ANALYZE, BUFFERS), 결과 해시 비교)를 만든다. 이 러너는 2~5가 다시 쓴다. `packages/postgres/src/imports.ts`의 미정리 anti-join 두 개를 쿼리 변경·후보 인덱스(`(source, locator)`, `request_id WHERE cleaned_at IS NULL`)로 비교하고, 채택한 인덱스는 새 forward migration으로 더한다. 같은 쓰기 배치(file_requests·결과 INSERT)의 전후 시간과 인덱스 크기를 기록한다."
verify = "측정 러너가 기준 커밋과 변경 코드에서 같은 fixture로 결과 해시가 같고 10만/미정리 100 조건의 중앙값이 기준의 절반 이하이며, 유휴(모두 cleaned) 조건이 나빠지지 않고, 채택 인덱스의 크기·쓰기 배치 전후 시간이 plan에 있으며, 공유 locator 차단 시험이 그대로 통과한다."
covers = ["E22-1"]
after = ["21.6"]
hitl = false
risk = "medium"
references = ["_bmad-output/personal-brain/research-performance-2026-11-04/sql/report.md, 후보 4·재현 4"]

