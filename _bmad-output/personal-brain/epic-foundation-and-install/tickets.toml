[[entry]]
id = 10
type = "story"
title = "SQLite store 기반: 드라이버, 쓰기 통로, 시각 코덱"
description = "`packages/sqlite`에 `node:sqlite`용 얇은 Kysely 드라이버, 이미 있는 파일만 `mode=rw`로 여는 연결 함수 하나(pragma `busy_timeout`·`foreign_keys`·`recursive_triggers`, 같은 트랜잭션 안에서만 유효한 redact 표시 SQL 함수 등록과 `try/finally` 관리), `BEGIN IMMEDIATE`로 여는 쓰기 유일 통로 `withWrite`, HealthStore·SchemaStore 구현(원본 열림·WAL·FTS5 trigram·`foreign_keys` 탐침, 스키마 버전), 마이그레이션 실행기를 만든다. Core에는 24글자 시각 정규형 코덱(Store 경계에서 다른 형식 거부)을 두고, `StoreHealth`의 벡터 칸을 원본 칸으로 바꾸는 포트 변경과 `packages/postgres`의 health·계약 사례를 함께 맞춘다. 루트 `engines.node`는 `>=24.16.0`이다."
verify = "SQLite가 core/testing의 HealthStore·SchemaStore 계약 사례를 통과하고 postgres 계약 테스트도 그대로 통과하며, 쓰기 트랜잭션의 첫 문장이 `begin immediate`이고, 없는 경로는 `DB_UNAVAILABLE`이며 파일이 생기지 않고, 시각 코덱이 오프셋 형식을 거부하고, 두 프로세스 동시 쓰기의 `busy_timeout` 대기 시간을 실측해 기록한다(spool 전환은 epic 2)."
covers = ["E1-1", "E1-2", "E1-3"]
after = [2]
hitl = false
risk = "high"
unknown = "동기 API만 있는 `node:sqlite`에서 `busy_timeout` 대기가 hook 지연(NFR-7)에 주는 영향."
references = ["_bmad-output/personal-brain/architecture-brain-v1-slice-1/architecture-brain-v1-slice-1.md, AD-7", "_bmad-output/personal-brain/architecture-brain-v1-slice-1/architecture-brain-v1-slice-1.md, AD-10", "_bmad-output/personal-brain/architecture-brain-v1-slice-1/reviews/review-currency-2026-10-14.md"]

