id = 5
type = "story"
title = "마이그레이션 0009: 주입 종류·처리 시간과 불변 trigger"
description = "SQLite 마이그레이션 0009(schema version 9, 에픽 10의 0008 뒤)로 `context_injections`에 `kind`(`start | stop`)와 `elapsed_ms`(Brain 내부 처리 시간, 미측정은 null이며 0으로 채우지 않음)를 더하고 기존 행을 `start`로 두며, `log_entry_edits`·`context_injections` 행의 변경·삭제 거부와 `log_entries`의 `kind`·`session_id`·`occurred_at`·`author_model` 변경 거부를 trigger로 강제한다(I60); 7이 쓸 `pending` 규칙의 인용·출처 메시지·코드 포인트 구간을 다시 대조할 때까지 남기는 영속화 계약을 먼저 정해 필요한 칸을 0009에 넣고(spool을 택하면 로그 재주입 뒤 재대조까지 살아 있는 수명 계약), Core `ContextInjection` 자료형을 맞추며, 7·14·12가 이것을 쓴다; Postgres는 epic 7."
