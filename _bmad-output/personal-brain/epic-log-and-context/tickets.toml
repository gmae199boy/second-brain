[[entry]]
id = 11
type = "story"
title = "플러그인 스킬 생성과 parity 테스트"
description = "2의 규율 상수와 명령 메타로 플러그인 스킬(`plugin/skills/`의 `/brain:*`, 기록하기·규칙 적기·로그 관리 등 이름과 분할은 계획에서 정함)을 빌드가 생성하고 생성물을 커밋하며, parity 테스트가 생성물과 커밋본의 일치, `tested_against`(만든 Brain 버전), 스킬 코드블록에 적힌 모든 명령·flag가 `brain guide schema`에 있는지를 지키게 한다; 아직 없는 에픽 4 명령은 넣지 않으며, 생성물 커밋은 15의 단일 배포에 실린다."
verify = "생성 스크립트를 다시 돌려도 커밋본과 차이가 없고, 스킬 코드블록에 없는 flag를 하나 넣거나 상수 문장을 바꾸고 재생성하지 않으면 parity 테스트가 실패한다."
covers = ["E3-5"]
after = [2, 8]
hitl = false
risk = "medium"

[[entry]]
id = 12
type = "story"
title = "Stop 기록 점검"
description = "3의 실측 결과(출력 방식, 발화 수 상수)로 `brain log remind`(`hook: only`, 읽기 전용)를 만들어 `Stop` 이벤트에만, `[discipline] stop_remind`가 켜져 있고(설정 코덱·설치기 보존, 기본 false, 묻지 않음; 꺼져 있으면 설정과 표식만 읽고 DB를 열지 않음) `stop_hook_active`가 false이며 transcript를 parser로 읽어 센 사용자 발화(이미지·@파일만 붙인 사람 메시지도 한 번으로 셈, 10.4 뒤의 최종 parser로 다시 확인)가 상수 이상이고 `log_entries`와 spool 어디에도 이 세션의 로그가 없고 `<home>/run/stop-remind/<harness>-<id>` 표식이 없을 때만 2의 reason으로 피드백을 내고 그 뒤에 표식을 만들며, 모르면 묻지 않고 어떤 오류든 출력 없이 exit 0, 토글이 켜진 채 점검한 호출은 출력이 없어도 각각 14의 경로로 `context_injections`(`kind='stop'`, `ok=1`은 피드백을 낸 호출, `code`는 내지 않은 이유, `chars`는 출력 글자 수·없으면 0, `elapsed_ms`는 내부 시간)에 남기고, 이 세션의 로그가 spool에 있는지 보는 비파괴 조회를 처음으로 만들며, 30일 지난 표식은 drain이 지우고, `hooks.json`에 Stop 동기 줄(같은 런처, `|| exit 0`, `timeout` 5초)을 더한다; 무출력 조건별 픽스처·기대 출력·DB 무접근 관측 방법을 15의 설치 체크리스트로 넘기며, 배포와 설치 상태 확인은 15가 한다."
verify = "Stop 계약 suite가 통과한다: 토글 on·발화가 상수 이상·로그 없음이면 피드백과 표식이 생기고, 세션 행이 있는 픽스처에서 로그(spool 포함) 있음·`stop_hook_active` true·표식 있음·재진입은 출력 없이 `kind='stop'` 행에 사유와 0글자가 남고, 세션 행이 없을 때는 출력 없이 사유·0글자의 stop record가 spool에 남았다가 픽스처로 세션을 수집한 뒤 drain에서 stop 행 하나가 되며, DB 파일을 막아 두어도 exit 0이고, 토글 off이면 DB를 열지 않으며, 이미지만 붙인 메시지가 발화로 세어진다."
covers = ["E3-6"]
after = [3, 5, 9, 14, "10.4"]
hitl = false
risk = "high"
references = ["_bmad-output/personal-brain/architecture-brain-v1-slice-1/architecture-brain-v1-slice-1.md, AD-6, AD-17, AD-28", "_bmad-output/personal-brain/change-discipline-and-metrics/change-discipline-and-metrics.md"]

[[entry]]
id = 15
type = "story"
title = "플러그인 배포와 설치 상태 확인"
description = "11의 생성 스킬·4의 SessionStart 줄·12의 Stop 줄을 담은 이전 커밋으로 plugin `app-ref`를 고정하고 `plugin.json` version을 README '릴리스'대로 올려(에픽 10과 함께 쓰는 한 곳) 이 기계의 플러그인을 갱신한 뒤, 사람이 단일 체크리스트로 플러그인으로 설치한 상태에서 시작 맥락(Done when 1·5)과 12가 넘긴 조건별 Stop 체크리스트(Done when 9)를 실행하고 결과를 계획에 남긴다."
verify = "갱신된 플러그인으로 연 세션의 시작 맥락에 오늘 날짜·토큰 줄·켜진 규칙이 보이고, 토글을 켜고 발화가 상수 이상인 세션을 로그 없이 멈추면 모델이 한 번 더 일하며 그 이유 문장이 hook 출력에 있고, 로그(DB·spool) 있음·`stop_hook_active` true·표식 있음·세션 없음에서는 아무것도 내지 않고 토글을 끄면 DB를 열지 않으며, Stop 줄의 `timeout`이 5초이고, DB 파일을 막아 둔 채 멈춰도 세션 종료가 막히지 않으며, drain 뒤 `kind='start'`·`kind='stop'` 행이 남는다."
covers = ["E3-5", "E3-6"]
after = [11, 12, 14, "2.5"]
hitl = true
risk = "medium"

