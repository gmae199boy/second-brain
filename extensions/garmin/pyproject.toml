[project]
name = "brain-garmin"
version = "1.0.0"
requires-python = "==3.14.10"
dependencies = [
    "curl-cffi==0.17.0",
    "garminconnect==0.3.20",
    "jsonschema>=4.26.0",
    "matplotlib==3.11.2",
    "psycopg[binary]==3.3.6",
    "requests==2.34.2",
]

[tool.setuptools.package-data]
"*" = ["labels/*.json", "schemas/*.json", "store/migrations/*.sql"]
