# 테스트 전용 PostgreSQL. tmpfs만 사용합니다.
name: second-brain-test
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54329:5432"
    # The image declares VOLUME /var/lib/postgresql; masking it with a tmpfs
    # keeps `compose down` from leaving an anonymous volume behind.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
