implementation_handoff = """
$orchestration 스킬과 persistent_facts의 Orca 절차를 따라 체크포인트를 init 또는 restore하고 제어 도구의 start --role implementer로 구현 워커를 띄운다. agent는 codex, model은 gpt-6.1-terra, effort는 medium이며 현재 checkout의 명시적인 worktree 선택자를 사용한다. Task spec은 아래 지시와 Orca 완료 보고 의무로 구성한다. 지휘자 자신의 역할·티켓 done 권한은 넘기지 않는다.

Read {plan_file} fully and implement it — the plan is the sole source of truth. Load every file listed in its frontmatter `context:` before you start. Do not commit; the orchestrator commits.

구현 워커는 계획을 따라 직접 소스·시험을 구현하고 검증한다. build 워크플로를 재귀 실행하거나 호스트 Agent/subagent·직접 codex exec·추가 워커를 사용하지 않는다. 계획·티켓의 상태 변경과 커밋·done 표시는 지휘자 소관이다.

지휘자는 배정 전에 계획의 실행 항목을 검증 가능한 작은 단계로 나누고 현재 단계·파일 범위·완료 관찰·다음 단계를 checkpoint한다. 최초 spec에는 전체 계획 경로와 첫 단계의 구체적 구현 지시를 함께 준다. 워커는 각 단계를 실제로 구현·시험한 뒤 type status / subject phase-ready와 보고 파일을 보내고 같은 활성 Dispatch에서 다음 단계 지시를 기다린다. 지휘자는 결과·diff·시험을 확인하고 checkpoint한 다음 message --subject next-phase로 다음 단계만 지시한다. 모든 실행 항목이 충족돼야 implementation-ready로 넘어간다. 전체 요구·검증·리뷰·done 판정은 줄이지 않는다. 일부 항목 구현, 큰 작업, 긴 대기, 스스로 정한 응답/시간 예산만으로 worker_done failed를 보내지 않는다. 실제 계속할 수 없는 구체적 원인만 실패로 보고하고 재현 근거와 남은 작업을 파일에 남긴다.

이 Task는 최초 구현과 지휘자의 검증·리뷰 반영까지 포함한다. 최초 구현 후 한국어 변경 내용·검증 결과·미완료 사항 전문을 임시 파일에 저장하고, injected preamble의 정확한 handle과 Task/Dispatch로 type status / subject implementation-ready 및 실제 report-path를 보낸다. 이 시점에는 worker_done이나 최종 응답으로 끝내지 않고 자신의 inbox를 check --wait하며 질문·후속 수정 지시를 처리한다. 최종 수정·검증이 끝났다는 지휘자의 명시적인 finalize 지시를 받은 뒤 전체 보고를 갱신하고 worker_done을 한 번 보낸다. 실제로 과업을 수행할 수 없으면 기다리지 말고 outcome failed로 정식 보고한다. 현재 모델을 유지하고 capacity 오류는 같은 세션에서 재개한다.

지휘자는 도구가 저장한 Run·Task·Dispatch·worker handle을 확인하고 check --timeout-ms 45000을 반복하면서 질문에 답하고 phase-ready를 받으면 앞 절차로 다음 단계를 보내며, 전체 implementation-ready 중간 보고 또는 실제 실패 보고까지 기다린다. 중간 보고를 받으면 기존 Verify와 리뷰 단계로 진행하며 구현자의 같은 Dispatch를 유지한다. 모든 수정 지시는 제어 도구의 message로 이 활성 Dispatch에 전달하고 각 단계·검증·판단을 checkpoint한다. 리뷰와 최종 검증이 끝나면 finalize를 보내고 정식 worker_done과 최종 보고를 수락한 뒤 release한다. 이미 완료된 structured worker 핸들에 worker-start --terminal을 호출하지 않는다.
"""

