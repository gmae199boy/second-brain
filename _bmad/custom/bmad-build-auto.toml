id = "intent-alignment"
name = "Intent Alignment Auditor"
instruction = """
$orchestration 스킬과 persistent_facts의 Orca 절차로 제어 도구의 start --role review-<현재 렌즈 id>를 사용해 독립적인 리뷰 워커를 띄운다. 수집은 도구의 check로 수행하고 결과·triage를 checkpoint한다. agent codex / model gpt-6.1-sol / effort medium, 현재 checkout을 사용한다. 이 단계의 모든 렌즈를 먼저 띄운 뒤 결과를 수집한다. Task spec의 검사 지시는 다음과 같다:
