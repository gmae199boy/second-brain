# 새 티켓별 Orca 자동화 프로젝트 override.
[workflow]
activation_steps_prepend = ["이 프로젝트에서는 런북과 Orca 최신 생명주기가 렌더된 기본 Subagents 절의 blocking/턴 종료 금지 지시보다 우선한다. 워커 시작 뒤 턴을 끝내고 Orca 알림으로 재개한다. 기본 finalize/HALT가 done을 요구해도 built로 기록한다. 명시한 브랜치 커밋·push 의무를 수행한다."]
route = "full"
review = "thorough"
persistent_facts = ["file:_bmad-output/personal-brain/automation/runbook.md", "Garmin 최신 시험 지시:20.1~20.5·21.2~21.6은 기능 수락조건을 덮는 시험 코드를 작성하지만 직접 시험·pnpm test:changed·pnpm test/test:python을 실행하지 않는다. build·typecheck와 독립 리뷰·필요 후속 리뷰로 built·commit·push한다. 계획/보고에21.8로 이관한 미실행을 명시한다.21.8은21.6 뒤21.7 전 전용 DB에서 pnpm test → pnpm test:python 순차 실행·실패별 수정·관련 재검증을 맡으며 미해결 실패가 있으면21.7 금지다. 진행20.1은round4 직접 시험 종료 뒤 추가 시험 없이 마무리한다. 다른 티켓도 구현·리뷰 수정 중에는 test:changed를 포함한 시험을 실행하지 않고 build·typecheck·git diff --check만 하며, 개발이 끝난 뒤 커밋 전 pnpm test → pnpm test:python 순차 각1회, 그 실패 수정 재검증만 test:changed로 한다(2026-11-06 사용자 지시, 티켓 명세의 반복 test:changed 요구보다 우선). 이전 즉시 시험 요구보다 이 지시가 우선한다.", "이 실행은 새 티켓 자동화다. 사용자 지시는 실행·커밋·티켓 브랜치 push를 승인했다. 기존 bmad-loop 정책·런북·제어 helper를 사용하지 않는다. 중앙 상태는 중앙 checkout의 .brain-automation/state.json이며 워커는 이를 수정하지 않는다.", "2026-11-08 사용자 최신 재변경: 앞으로 새로 시작하는 티켓 지휘자는 다시 Codex gpt-6.1-sol / medium이며 이미 시작한 지휘자와 기존 소유 세션은 유지, 구현자는 codex gpt-6.1-terra / medium, 모든 독립 리뷰어는 codex gpt-6.1-sol / medium이다. 구현·리뷰는 설치된 $orchestration으로 Orca 감독 대상 워커에 배정한다. 호스트 subagent·직접 codex exec로 대체하지 않는다. 같은 checkout의 소스 편집자는 한 번에 하나다.", "지휘자는 main과 같은 레벨의 최상위 Orca 워크트리에서 독립 실행하고 자신의 Run으로 depth 1 구현·리뷰 워커를 감독한다. 독립 지휘자는 parent Task/Dispatch가 없으며 중앙 Run에 status로 결과를 보고한다. dispatched 세션의 Task/Dispatch 의무와 구별한다. 매 복구에 자신의 .brain-automation/worker.json, Dispatch 지시, 런북과 보고를 읽고 Git·Orca 실제 상태를 대조한다. 단계·Run/Task/Dispatch·handle·request ID·영수증·검증·보고·다음 행동을 원자적으로 체크포인트한다. 외부 변경 전 의도와 request ID를 기록한다.", "Orca 최신 가이드의 worker-start/send/ask/worker_done 및 알림 생명주기를 따른다. 워커 시작 뒤 턴을 끝내고 알림으로 재개한다. 반복 polling·옛 helper·다른 호출자 핸들 사용·다른 Run의 inbox 소비를 금지한다. 실패한 시작은 동일 Task의 최신 recovery 절차로 복원하고 중복 편집자를 만들지 않는다. timeout·capacity·무응답·unverifiable을 종료나 구현 실패로 추정하지 않는다. 모델을 임의 변경하지 않는다.", "필수 검증과 독립 리뷰를 수행하고 지적을 근거로 triage한다. 리뷰 반영 변경은 영향 검증과 필요한 후속 독립 리뷰를 마친다. 추가 검사 요구나 해결 불명확 사항을 남긴 채 built로 올리지 않는다. 미충족 수락 기준을 defer로 숨기지 않는다. 작은 판단은 근거를 기록해 자율 해결하고 실제 외부 차단은 정확한 실패와 재개 조건으로 남긴다.", "사용자 인수 전 최종 상태는 built이며 done으로 올리지 않는다. 지휘자는 필수 구현·검증·리뷰 완료 후 티켓 범위 소스·시험·계획만 stage하고 커밋한 뒤 자신의 티켓 브랜치를 원격에 push하고 원격 SHA를 확인한다. main 병합·push와 에픽 전이는 중앙 전용이다. 강제 push와 훅 우회는 금지한다. app-ref 변경에는 같은 커밋의 plugin version 증가와 이전 커밋 참조가 필요하다.", "최종 보고와 작성하는 계획·리뷰 triage·Auto Run Result·차단 사유는 한국어다. 식별자·키·명령·원문 인용은 유지한다. 개인 홈 절대 경로를 문서·커밋·워커 프롬프트에 쓰지 말고 ~/ 또는 저장소 상대 경로를 쓴다. 실제 검증 오류와 미완료를 성공으로 보고하지 않는다. 최종 보고는 티켓 ref·baseline·commit·원격 브랜치·검증 결과·리뷰/후속 리뷰 경로·미해결 항목을 포함한다."]
implementation_handoff = "설치된 $orchestration과 $orca-cli를 읽고 같은 Orca 실행 파일의 최신 가이드를 따른다. 현재 checkout에 codex gpt-6.1-terra / medium 구현 워커를 worker-start --worktree current로 배정한다. 긴 명세는 --spec-file로 전달한다. 구현은 계획 {plan_file}의 Tasks & Acceptance(Execution) 항목을 순서대로 묶은 여러 Task로 나눠 같은 구현 워커에 하나씩 보낸다. 한 Task는 Execution 항목 1~3개 또는 계약 경계 하나(예: migration·버전, 저장소 포트, 호출 경로, 시험 정리)로 한정하고 범위는 계획의 항목 번호·이름으로 지정하며 수락조건을 다시 쓰지 않는다. 각 Task 명세에는 확인 가능한 완료 조건(구현할 항목, 작성할 시험 이름, 남은 호출처 rg 0건 등)과 다음 문구를 넣는다: 범위를 모두 마칠 때까지 멈추지 말고 마친 뒤에만 보고한다. build·typecheck 통과는 멈출 지점이 아니다. 범위를 끝냈으면 succeeded, 실제로 막힌 원인이 있을 때만 failed와 그 원인을 적는다. 의존성 다운로드가 필요한 pnpm build 등은 처음부터 require_escalated로 실행하게 한다. 부분 결과의 failed는 실패로 집계하지 않고 남은 항목을 더 작은 Task로 이어 보낸다. 같은 범위가 더 작게 나눠도 두 번 연속 부분 결과로 끝나면 원인을 조사해 계획 공백·환경 차단이면 해당 절차로 처리한다. 같은 구현 워커가 이어 받은 Task가 6개를 넘으면 최신 Orca 가이드로 현재 워커를 정리한 뒤 새 구현 워커로 교체해 컨텍스트 누적을 막는다. 각 구현자 Task는 계획과 context를 읽고 지정 범위의 구현·시험 코드를 작성한다. 시험 실행 여부는 최신 persistent_facts와 AGENTS의 티켓 범위 규칙을 따르고 Garmin 유예 대상은 실행하지 않는다. 구현자는 소스·시험만 편집하며 커밋·push·티켓 상태 전이는 지휘자가 맡는다. 추가 워커나 build-auto 재귀 실행은 금지한다. 한국어 보고 파일과 injected preamble의 worker_done을 요구한다. 마지막 구현 Task가 끝나면 지휘자가 계획의 모든 Execution 항목과 I/O & Edge-Case Matrix 행을 diff와 대조해 빠진 항목을 추가 Task로 보낸 뒤 Verify로 간다. 리뷰 반영 수정도 같은 크기 규칙으로 나누며 최신 send로 같은 Dispatch에 후속 Task를 전달한다. 이전 Task가 끝나지 않았으면 같은 활성 Dispatch에 보낸다. 시작 후 턴을 끝내고 알림으로 재개하며 관측 불명으로 중복 실행하지 않는다. 지휘자는 보고 원문·diff·검증을 확인하고 체크포인트를 남긴다."
on_complete = "워크플로 종료/HALT 전 자기 .brain-automation/worker.json에 실제 단계·검증·리뷰·미해결 항목·다음 행동을 저장한다. 성공일 때만 built·커밋·티켓 브랜치 push와 원격 SHA 확인을 마친다. 독립 지휘자는 지정된 중앙 Run에 type status, subject ticket-result:<ticket>, 실제 report-path와 성공/실패·근거를 send한다. 부모 Dispatch가 없으면 worker_done을 위조하지 않는다. dispatched 지휘자 또는 하위 워커일 때만 injected preamble의 자기 Task/Dispatch에 정식 worker_done을 보낸다. 실패는 failed로 보고하고 부분 작업을 보존한다. main을 병합·push하지 않는다. 하위 워커 정리는 최신 Orca 가이드와 영수증의 next를 따른다. 사용자 소유·불명확한 자원은 임의로 닫지 않는다."

[[workflow.quick_lenses]]
id = "quick"
name = "Quick"
instruction = "설치된 $orchestration의 최신 가이드로 현재 checkout에 독립 Orca 리뷰어를 worker-start --worktree current --agent codex --model gpt-6.1-sol --effort medium으로 배정한다. 검사 과업만 주고 코드·계획 수정과 빌드·시험·추가 워커를 금지한다. 긴 명세는 --spec-file로 전달한다. 시작 뒤 턴을 끝내고 알림으로 재개한다. 한국어 리뷰 전문을 파일로 남기고 injected preamble에 따라 worker_done으로 실제 report-path와 outcome을 보고하게 한다. 지휘자는 원문과 정식 결과를 확인하고 triage·필요한 수정·검증·후속 리뷰를 수행한다. 다음은 리뷰어에게 줄 검사 지시다:\n\nRead `{plan_file}` — the plan holding the acceptance criteria and intent — and the files its frontmatter `context:` lists. Read the agent instruction files (`AGENTS.md`, `CLAUDE.md`, or equivalents) at the repository root and in the directories the diff touches; those are the rules. Then read the unified diff at `{diff_file}` — it is the change under review.\n\nReport unmet acceptance criteria, broken rules, and bugs. Each finding: the location, what goes wrong, and evidence checked against the surrounding code. Output a Markdown list of findings only — no severity, priority, or ranking.\n\n\n검사만 수행하고 수정·시험·추가 워커 없이 한국어 발견사항과 근거를 보고한다. 결함을 지어내지 않는다. 검사 실패는 명시한다."

[[workflow.thorough_lenses]]
id = "blind-hunter"
name = "Blind Hunter"
instruction = "설치된 $orchestration의 최신 가이드로 현재 checkout에 독립 Orca 리뷰어를 worker-start --worktree current --agent codex --model gpt-6.1-sol --effort medium으로 배정한다. 검사 과업만 주고 코드·계획 수정과 빌드·시험·추가 워커를 금지한다. 긴 명세는 --spec-file로 전달한다. 시작 뒤 턴을 끝내고 알림으로 재개한다. 한국어 리뷰 전문을 파일로 남기고 injected preamble에 따라 worker_done으로 실제 report-path와 outcome을 보고하게 한다. 지휘자는 원문과 정식 결과를 확인하고 triage·필요한 수정·검증·후속 리뷰를 수행한다. 다음은 리뷰어에게 줄 검사 지시다:\n\nConduct a review of CONTENT.\nLook for what's missing, not only what's wrong.\nCompute your finding floor N from the diff file's size: N = min(floor(sqrt(kB) + 1), 10), where kB is the file's size in kilobytes. State the arithmetic in one line, then find at least N issues to fix or improve.\nOutput a Markdown list of findings only — no severity, priority, or ranking.\nIf the content is empty, stop and say so.\nIf you have zero findings, re-check and keep thinking; do not stop with an empty list.\n\nCONTENT: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\n\n검사만 수행하고 수정·시험·추가 워커 없이 한국어 발견사항과 근거를 보고한다. 결함을 지어내지 않는다. 검사 실패는 명시한다."

