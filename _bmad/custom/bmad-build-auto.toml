instruction = "설치된 $orchestration의 최신 가이드로 현재 checkout에 독립 Orca 리뷰어를 worker-start --worktree current --agent codex --model gpt-6.1-sol --effort medium으로 배정한다. 검사 과업만 주고 코드·계획 수정과 빌드·시험·추가 워커를 금지한다. 긴 명세는 --spec-file로 전달한다. 시작 뒤 턴을 끝내고 알림으로 재개한다. 한국어 리뷰 전문을 파일로 남기고 injected preamble에 따라 worker_done으로 실제 report-path와 outcome을 보고하게 한다. 지휘자는 원문과 정식 결과를 확인하고 triage·필요한 수정·검증·후속 리뷰를 수행한다. 다음은 리뷰어에게 줄 검사 지시다:\n\nRead `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions.\n\nclaims_file (leave unread until your instructions call for it): {claims_file}\n\nReview content: the unified diff at `{diff_file}`. Read that file — it is the content under review.\n\n\n검사만 수행하고 수정·시험·추가 워커 없이 한국어 발견사항과 근거를 보고한다. 결함을 지어내지 않는다. 검사 실패는 명시한다."

